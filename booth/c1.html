<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#000000">
<title>C-1 시민사회</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Freesentation/Freesentation.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/c1.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.147.0/examples/jsm/",
  "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
} }
</script>
</head>
<body class="c1">

<!-- Step 1~3 공용 무대: 카메라(인식) / 3D 모리스 칼럼 -->
<div id="stage" class="cam-screen">
  <div id="arLayer" class="cam-layer"></div>
  <div id="mv" class="cam-layer mv off"></div>
  <div class="stage-top">
    <div class="topbar dark">
      <button class="icon-btn" data-back></button>
      <div class="tb-title" data-step-label></div>
      <span class="tb-right"><span id="modeTag" class="mode-tag"></span><button id="closeBtn" class="icon-btn" aria-label="닫기 — 전단지를 칼럼에 돌려놓기" hidden><span data-ic="close"></span></button></span>
    </div>
    <div class="progress dark" data-progress></div>
  </div>
  <!-- 스캔 안내: 모리스 칼럼 실루엣 점선 (3D 모델 실측 프로파일과 같은 윤곽) -->
  <div id="guide" class="guide off" aria-hidden="true"><svg id="guideSvg"></svg></div>
  <div id="pillWrap" class="pill-wrap off"><span id="pill" class="pill"></span></div>
  <div id="camLoading" class="cam-loading" hidden><div class="spinner"></div><span id="camLoadingText">카메라 준비 중</span></div>
</div>

<!-- Step 1. 모리스칼럼 광고탑 스캔 — 카메라 위에 칼럼 윤곽 점선만, 인식되면 3D 칼럼으로 -->
<section class="step overlay-step" data-step="1">
  <div class="cam-bottom">
    <button id="s1Cam" class="btn white"><span data-ic="camera"></span>카메라로 스캔하기</button>
    <button id="s1Demo" class="btn dark-line">데모로 진행</button>
  </div>
</section>

<!-- Step 2. 모리스 칼럼 — 자유롭게 돌려 보고, 압정 꽂힌 전단지 6장 중 아무거나 눌러 떼어 본다 -->
<section class="step overlay-step" data-step="2">
  <div class="cam-bottom">
    <p class="s2-desc"><span>밀어서 돌리기 · 두 손가락으로 확대 · 전단지를 눌러 살펴보기</span></p>
  </div>
</section>

<!-- Step 3. 전단지 확대 — 떼어 낸 전단지가 화면 가운데 3D 로 떠 있다 (끌어서 돌리기·핀치 확대)
     카페 게르부아는 떠 있는 종이 위에서 삽화 애니메이션이 재생된다 -->
<section class="step overlay-step" data-step="3">
  <div class="s3-bottom">
    <div id="caption" class="caption" hidden>
      <strong id="cTitle"></strong>
      <p id="cBody"></p>
      <p id="cMeta" class="c-meta"></p>
    </div>
    <div id="animHud" class="anim-hud" hidden>
      <div id="subtitle" class="subtitle" aria-live="polite"></div>
      <div class="timeline"><i id="timeBar"></i></div>
      <button id="s4Replay" class="btn dark-line" hidden><span data-ic="replay"></span>다시 보기</button>
    </div>
    <p class="s2-desc"><span>끌어서 돌리기 · 두 손가락으로 확대</span></p>
  </div>
  <div id="animErr" class="cam-msg" hidden></div>
</section>

<script type="module" src="js/c1.js"></script>
</body>
</html>
