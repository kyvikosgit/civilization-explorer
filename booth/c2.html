<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#FFFFFF">
<title>C-2 산업혁명</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Freesentation/Freesentation.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/c2.css">
</head>
<body class="c2">

<!-- Step 1. 현장 체험 — 구성(안) Step1 체험존 자유 관람 + Step2 다음 목적지 단서 발견 (방문객이 부스에서 직접) -->
<section class="step" data-step="1">
  <div class="topbar">
    <button class="icon-btn" data-back></button>
    <div class="tb-title" data-step-label></div>
    <span></span>
  </div>
  <div class="progress" data-progress></div>
  <div class="wrap">
    <header class="mhead">
      <div class="cap">MONET 100 — C-2 · 현장 체험</div>
      <h2>체험존 자유롭게 관람</h2>
      <div class="rule"></div>
      <p class="sub">산업혁명 시대를 재현한 공간 내 전시물 및 오브제 자유 관람</p>
    </header>
    <div class="concept" style="margin-top:18px"><img src="assets/concept/c2_booth.jpg" alt="산업혁명 체험존 시안"><span class="tag dark">시안 이미지</span></div>
    <h3 class="sec-title">다음 목적지 단서 발견</h3>
    <p class="lead" style="margin:0">벽면 지도, 신문, 책상 위 소품 등에서 다음 목적지에 대한 힌트 탐색</p>
    <div class="note-box">이 두 단계는 부스 현장에서 진행되며 앱 조작이 없습니다. 단서를 찾았다면 퀴즈에 참여하세요.</div>
    <div style="margin-top:20px"><button class="btn" data-next>앱 퀴즈 참여하기</button></div>
  </div>
</section>

<!-- Step 2. 앱 퀴즈 참여 — 지도 -->
<section class="step quiz" data-step="2">
  <div id="mapBox" class="map-box">
    <svg id="map" xmlns="http://www.w3.org/2000/svg" aria-label="파리 주변 지도"></svg>
  </div>
  <header class="quiz-top">
    <div class="quiz-bar">
      <button class="icon-btn" data-back></button>
      <div class="quiz-title">INDUSTRIAL REVOLUTION</div>
      <span class="quiz-count">4/8</span>
    </div>
    <div class="progress" data-progress></div>
    <div class="banner">
      <strong>단서를 바탕으로<br>다음 목적지로 가는 노선을 선택하세요.</strong>
      <p id="banner2" hidden></p>
    </div>
  </header>
  <div class="quiz-bottom">
    <div id="chips" class="chips" role="radiogroup" aria-label="목적지 선택"></div>
  </div>
</section>

<div id="confirmSheet" class="sheet" role="dialog" aria-label="선택 확인">
  <div class="grip"></div>
  <div class="eyebrow" id="cfRegion"></div>
  <h3 class="confirm-title">이 지역을 선택하시겠습니까?</h3>
  <div class="btn-row" style="margin-top:18px">
    <button id="cfRetry" class="btn line">다시 고르기</button>
    <button id="cfOk" class="btn">선택</button>
  </div>
</div>

<div id="resultSheet" class="sheet" role="dialog" aria-label="결과">
  <div class="grip"></div>
  <div id="resBody"></div>
</div>

<script type="module" src="js/c2.js"></script>
</body>
</html>
