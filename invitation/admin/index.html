<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>사전 차량 등록 명단 · MONET 100 VIP 오프닝</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Diphylleia&display=swap">
<style>
:root{--bg:#EDEBE5;--paper:#FFFFFF;--gold:#B39243;--ink:#1E1E1E;--sub:#6A6A64;--line:#E4E1D9;--serif:'Diphylleia','Gowun Batang','AppleMyungjo',serif;--sans:-apple-system,'Apple SD Gothic Neo','Pretendard','Noto Sans KR',sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--sans);-webkit-tap-highlight-color:transparent}
.wrap{max-width:720px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-left,0px)) 48px}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:26px 22px}
h1{margin:0;font:400 22px/1.3 var(--serif);text-align:center;letter-spacing:.02em}
.kick{margin:0 0 8px;text-align:center;font:400 12px/1 var(--serif);letter-spacing:.14em;color:var(--gold)}
.sub{margin:8px 0 0;text-align:center;color:var(--sub);font-size:13px}
form.login{display:flex;flex-direction:column;gap:10px;max-width:300px;margin:26px auto 4px}
input{font:400 16px/1 var(--sans);padding:13px 16px;border:1px solid #D9D6CE;border-radius:10px;background:#FAF9F6;color:var(--ink);text-align:center}
button{font:600 14px/1 var(--sans);border-radius:10px;padding:12px 16px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:#fff}
button.ghost{background:none;color:var(--ink);border-color:#D9D6CE}
button.del{white-space:nowrap;font-weight:500;font-size:13px;padding:8px 10px;background:none;color:#9A4A2E;border-color:#E6D3CB}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.err{min-height:1.4em;margin:0;text-align:center;color:#9A4A2E;font-size:13px}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:22px 0 12px}
.bar .n{margin-right:auto;font-size:14px;color:var(--sub)}.bar .n b{color:var(--ink);font-size:18px;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:12px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;font-weight:600;color:var(--sub);letter-spacing:.04em;border-bottom-color:var(--ink)}
td.no{width:44px;color:var(--sub)}
td.pl{font-size:18px;font-weight:600;letter-spacing:.04em}
td.at{color:var(--sub);font-size:13px;white-space:nowrap}
td.x{width:1%;text-align:right}
.empty{padding:36px 0;text-align:center;color:var(--sub)}
.printhead{display:none}
[hidden]{display:none!important}
@media (max-width:420px){td.at{font-size:12px}th,td{padding:11px 4px}}
@media print{
  @page{size:A4;margin:16mm 16mm 18mm}
  html,body{background:#fff}
  .wrap{max-width:none;padding:0}
  .sheet{border:0;padding:0}
  .screen-only,.bar,td.x,th.x,.kick,.sub{display:none!important}
  .printhead{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 10mm;border-bottom:1.5px solid #000;padding-bottom:4mm}
  .printhead h1{font-size:17pt;text-align:left}
  .printhead span{font-size:10pt;color:#333}
  h1.screen{display:none}
  th,td{padding:3.2mm 2mm;border-bottom:.6px solid #999}
  th{color:#000;border-bottom:1.2px solid #000;font-size:9.5pt}
  td.pl{font-size:15pt}
  td.at,td.no{color:#222;font-size:10pt}
  tr{break-inside:avoid}
}
</style>
</head>
<body>
<div class="wrap"><div class="sheet">
  <div class="printhead"><h1>MONET 100 VIP 오프닝 · 사전 차량 등록 명단</h1><span id="pdate"></span></div>
  <p class="kick screen-only">MONET 100 VIP 오프닝 · STAFF ONLY</p>
  <h1 class="screen">사전 차량 등록 명단</h1>
  <p class="sub">2026. 12. 4 (금) 16:00 – 19:30 · 신세계백화점 본점 주차장</p>

  <form class="login screen-only" id="login">
    <input id="pw" type="password" inputmode="text" autocomplete="current-password" placeholder="비밀번호" aria-label="비밀번호" required>
    <button type="submit">명단 보기</button>
    <p class="err" id="err" role="alert"></p>
  </form>

  <div id="list" hidden>
    <div class="bar">
      <span class="n">등록 <b id="cnt">0</b>대</span>
      <button class="ghost" type="button" id="reload">새로고침</button>
      <button type="button" id="print">인쇄</button>
    </div>
    <table>
      <thead><tr><th>번호</th><th>차량 번호</th><th>등록 시각</th><th class="x"></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <p class="empty" id="empty" hidden>아직 등록된 차량이 없습니다.</p>
  </div>
</div></div>
<script>
(function () {
  var SB = 'https://bttjtkhfyzapcsqocick.supabase.co', KEY = 'sb_publishable_0IErNY9FrSeZurr0goY5aA_FG3qftYs';
  var $ = function (id) { return document.getElementById(id); };
  var pw = '';
  try { pw = sessionStorage.getItem('ip_pw') || ''; } catch (e) {}
  function rpc(fn, body) {
    return fetch(SB + '/rest/v1/rpc/' + fn, { method: 'POST', headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.text().then(function (t) { var j = t ? JSON.parse(t) : null; if (!r.ok) throw j; return j; }); });
  }
  var fmt = new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
  var fmtFull = new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', year: 'numeric', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
  function pretty(v) { var t = String(v).replace(/\s+/g, ''), m = t.match(/^([가-힣]{2})?(\d{1,3})([가-힣])?(\d{4})$/); return m && (m[1] || m[3]) ? (m[1] ? m[1] + ' ' : '') + m[2] + (m[3] || '') + ' ' + m[4] : v; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function load() {
    return rpc('invite_parking_list', { p_pw: pw }).then(function (rows) {
      $('login').hidden = true; $('list').hidden = false;
      $('cnt').textContent = rows.length; $('empty').hidden = rows.length > 0;
      $('rows').innerHTML = rows.map(function (r, i) {
        return '<tr><td class="no">' + (i + 1) + '</td><td class="pl">' + esc(pretty(r.plate)) + '</td><td class="at">' + fmt.format(new Date(r.created_at)) + '</td><td class="x"><button class="del" type="button" data-id="' + r.id + '" data-pl="' + esc(pretty(r.plate)) + '">삭제</button></td></tr>';
      }).join('');
      $('pdate').textContent = '출력 ' + fmtFull.format(new Date()) + ' · 총 ' + rows.length + '대';
    });
  }
  $('login').addEventListener('submit', function (e) {
    e.preventDefault(); pw = $('pw').value.trim(); $('err').textContent = '';
    load().then(function () { try { sessionStorage.setItem('ip_pw', pw); } catch (e) {} })
      .catch(function (j) { $('err').textContent = j && j.message === 'denied' ? '비밀번호가 맞지 않습니다.' : '불러오지 못했습니다. 다시 시도해 주세요.'; });
  });
  $('reload').addEventListener('click', function () { load().catch(function () { alert('불러오지 못했습니다.'); }); });
  $('print').addEventListener('click', function () { load().finally(function () { window.print(); }); });
  $('rows').addEventListener('click', function (e) {
    var b = e.target.closest('button.del'); if (!b) return;
    if (!confirm(b.dataset.pl + ' 을(를) 명단에서 삭제할까요?')) return;
    rpc('invite_parking_delete', { p_pw: pw, p_id: +b.dataset.id }).then(load).catch(function () { alert('삭제하지 못했습니다.'); });
  });
  if (pw) load().catch(function () { pw = ''; try { sessionStorage.removeItem('ip_pw'); } catch (e) {} });
})();
</script>
</body>
</html>
