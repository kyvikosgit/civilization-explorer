<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0F0E0D">
<title>C4 · 나다르 사진관</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Freesentation/Freesentation.css">
<link rel="stylesheet" href="proto-base.css">
<link rel="stylesheet" href="css/crowd.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sacramento&display=block">
<link rel="stylesheet" href="../ticket/fonts.css">
<link rel="stylesheet" href="c4.css">
<link rel="stylesheet" href="c4-fx.css">
</head>
<body class="page c4 intro-on">

<!-- ── 들어가기(약 3초, 누르면 건너뜀): 나다르가 찍은 35, boulevard des Capucines 정면 사진을 밤으로 옮긴 판 · 안개
     → 실제 간판 자리의 서명 "Nadar"가 한 글자씩 켜진다 → 창이 켜짐 → 유리 스튜디오의 마그네슘 섬광 속으로 → 초상화 벽이 깊이에서 밀려 나온다 -->
<div class="intro" id="intro" role="button" tabindex="0" aria-label="나다르 사진관 — 누르면 건너뜁니다">
  <canvas class="in-scene" id="inScene" aria-hidden="true"></canvas>
  <canvas class="in-mist" id="inMist" aria-hidden="true"></canvas>
  <div class="in-flash" id="inFlash" aria-hidden="true"></div>
  <span class="in-skip" aria-hidden="true">누르면 건너뜁니다</span>
</div>

<div class="topbar">
  <a class="icon-btn" id="back" href="index.html" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
  <div class="tb-title">C4 · 나다르 사진관</div>
  <span></span>
</div>

<nav class="tabs" role="tablist" aria-label="화면">
  <button class="tab on" role="tab" aria-selected="true" data-tab="ask" type="button">사진관</button>
  <button class="tab" role="tab" aria-selected="false" data-tab="me" type="button">내 초상</button>
</nav>

<!-- 마그네슘 연기 — 섬광 뒤 피어올라 벽 위로 흩어진다(들어가기 · 사진 쪽 고르기) -->
<canvas class="smoke" id="smoke" aria-hidden="true"></canvas>

<main class="stage screen" id="ask" data-screen="ask" data-view="wall">

  <!-- ── 1. 사진관 벽: 24명의 초상화를 살롱식으로(화면 가득, 아주 느리게 위로). 액자를 누르면 그 사람이 사진이 되고, 위아래로 끌면 둘러보기,
       아래 "초상화 | 사진"으로 벽 전체가 물결처럼 바뀐다 -->
  <section class="view wall-view" id="wallView" aria-label="사진관 벽">
    <div class="wall-bg" aria-hidden="true"></div>
    <div class="layer far" aria-hidden="true"><div class="track" id="far"></div></div>
    <div class="layer near"><div class="track" id="hang"></div></div>
    <header class="w-head">
      <h1>같은 얼굴이<br>두 번 남았습니다.</h1>
      <p class="w-lead">한 번은 화가의 붓으로, 한 번은 사진가의 렌즈로.<br>어느 쪽이 그 사람을 더 닮았을까요?</p>
      <p class="w-hint" id="wHint">누르면 사진으로 · 끌어서 둘러보기</p>
    </header>
    <div class="w-foot">
      <!-- 누가 · 언제 — 마지막으로 누른 초상의 이름표(지금 보이는 쪽 먼저, 다른 쪽은 옅게) -->
      <div class="w-cap" id="wCap" aria-live="polite" hidden>
        <button class="cap-x" id="capX" type="button" aria-label="선택 풀기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
        <b class="cap-name" id="capName"></b>
        <span class="cap-now" id="capNow"></span>
        <span class="cap-other" id="capOther"></span>
      </div>
      <div class="seg" id="seg" role="group" aria-label="벽 전체를 바꾸기">
        <i class="seg-thumb" aria-hidden="true"></i>
        <button type="button" data-m="paint" aria-pressed="true">초상화</button>
        <button type="button" data-m="photo" aria-pressed="false">사진</button>
      </div>
      <button class="btn white ask-btn" id="toQ" type="button">당신이라면?</button>
    </div>
  </section>

  <!-- ── 2. 질문: 뒤로 흐릿한 두 줄기(왼쪽 그림은 위로, 오른쪽 사진은 아래로) 위에 어두운 막, 그 위에 질문과 두 답.
       반쪽을 누르면 사진 = 섬광, 그림 = 니스 빛 → 그쪽이 화면을 채우고 → 두 줄기가 오늘의 비율대로 나뉘며 큰 숫자 -->
  <section class="view q-view" id="qView" aria-label="질문">
    <div class="qs" data-k="paint" aria-hidden="true"><div class="qs-track" id="qsPaint"></div></div>
    <div class="qs" data-k="photo" aria-hidden="true"><div class="qs-track" id="qsPhoto"></div></div>
    <div class="veil" aria-hidden="true"></div>
    <!-- 고른 뒤: 두 반쪽이 오늘의 비율대로 나뉘고, 그 위에 큰 숫자 -->
    <div class="sp-nums" id="spNums" aria-hidden="true">
      <div class="sp-cap" id="spCap">오늘의 관람객</div>
      <div class="sn" data-k="paint"><b><span class="cnt">0</span><i>%</i></b><small>그림</small></div>
      <div class="sn" data-k="photo"><b><span class="cnt">0</span><i>%</i></b><small>사진</small></div>
      <i class="sp-seam"></i><i class="sp-sweep"></i>
    </div>
    <div class="flood" id="flood" aria-hidden="true"></div>
    <div class="halves" id="halves">
      <button class="half" data-k="paint" type="button"><span class="half-in"><b>그림으로</b><small>화가가 보고 그린 대로</small></span></button>
      <button class="half" data-k="photo" type="button"><span class="half-in"><b>사진으로</b><small>렌즈 앞에 앉은 그대로</small></span></button>
      <i class="divider" aria-hidden="true"></i>
    </div>
    <header class="q-head">
      <div class="q-ask"><h1>사람을 남긴다면,<br>그림입니까 사진입니까?</h1></div>
      <div class="q-mine" aria-live="polite"><h1 id="mineHead"></h1><p id="mineSubHead"></p></div>
    </header>

    <!-- 오늘의 관람객(위의 두 반쪽 · 큰 숫자) 기준 한 줄. 끝 단추 공통: [처음으로 | 수집함에 저장], 아래에 다시 고르기(글자 링크) -->
    <section class="reveal crowd dark center" id="reveal" aria-live="polite">
      <div class="rv-scroll" id="rvScroll">
        <div class="crowd-stamp" id="crowdStamp"></div>
      </div>
      <div class="end-row rv-actions">
        <a class="btn dark-line" href="index.html">처음으로</a><button class="btn white" id="saveStance" type="button">수집함에 저장</button>
        <div class="end-links"><button class="end-link" id="again" type="button">다시 고르기</button></div>
      </div>
    </section>
  </section>
</main>

<!-- ── 내 초상: 전면 카메라(또는 데모 이미지) → 노출 4초 → 같은 한 장에서 기기 안에서 두 벌 — 19세기 사진(카르트 드 비지트) · 아카데미 유화 초상(금박 액자)
     → 한 틀 안에 겹쳐 놓고 가운데 막대를 끌어 비교(왼쪽 초상화 · 오른쪽 사진). AI · 서버 없음 -->
<main class="wrap screen" id="me" data-screen="me" hidden>
  <header class="me-head">
    <h1>내 초상</h1>
    <p id="meSub">노출 4초 · 사진과 초상화, 기기 안에서만</p>
  </header>

  <section class="studio">
    <div class="plate" id="plate">
      <video id="cam" class="cam" playsinline muted autoplay></video>
      <img id="still" class="still" alt="" hidden>
      <div class="oval" id="oval"></div>
      <div class="count" id="count" hidden><b id="countNum">4</b><span>노출 중 · 움직이지 마세요</span></div>
      <div class="busy" id="busy" hidden><div class="spinner"></div><span id="busyTxt">현상 중</span></div>
      <div class="cam-off" id="camOff"><p id="camMsg">카메라를 켜면 여기에 비칩니다</p></div>
    </div>
    <!-- 결과: 한 틀 — 아래는 사진, 위는 초상화(왼쪽부터 막대까지만 보인다). 어디를 끌어도 막대가 따라온다 -->
    <div class="duo" id="duo" hidden>
      <canvas class="duo-cv" id="duoPhoto" role="img" aria-label="내 초상 · 19세기 사진"></canvas>
      <div class="duo-clip" id="duoClip"><canvas class="duo-cv" id="duoPaint" role="img" aria-label="내 초상 · 유화 초상화"></canvas></div>
      <span class="duo-lab l" id="labPaint" aria-hidden="true">초상화</span>
      <span class="duo-lab r" id="labPhoto" aria-hidden="true">사진</span>
      <div class="duo-handle" id="duoHandle" role="slider" tabindex="0" aria-label="초상화와 사진 사이 막대" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" aria-valuetext="초상화 50% · 사진 50%">
        <i class="duo-line" aria-hidden="true"></i>
        <span class="duo-knob" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 7.5L5 12l4.5 4.5M14.5 7.5L19 12l-4.5 4.5"/></svg></span>
      </div>
    </div>
    <div class="plate-foot" id="plateFoot">Nadar · 35, boulevard des Capucines</div>
  </section>

  <div class="me-actions" id="meActions">
    <button class="btn white" id="camStart" type="button">카메라 켜기</button>
    <button class="btn dark-line" id="camDemo" type="button">데모 이미지로</button>
  </div>
  <div class="me-actions" id="meShoot" hidden>
    <button class="btn white" id="shoot" type="button">노출 4초 · 촬영</button>
  </div>
  <!-- 끝 단추 공통: [처음으로 | 수집함에 저장], 아래에 다시 찍기(글자 링크) -->
  <div class="end-row me-end" id="meDone" hidden>
    <a class="btn dark-line" href="index.html">처음으로</a><button class="btn white" id="saveMe" type="button">수집함에 저장</button>
    <div class="end-links"><button class="end-link" id="again2" type="button">다시 찍기</button></div>
  </div>
</main>

<script type="module" src="c4.js"></script>
</body>
</html>
