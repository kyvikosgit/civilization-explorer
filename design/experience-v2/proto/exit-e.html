<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#121110">
<title>출구 · 나의 선택</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Freesentation/Freesentation.css">
<link rel="stylesheet" href="../ticket/fonts.css">
<link rel="stylesheet" href="proto-base.css">
<link rel="stylesheet" href="exit-common.css">
<link rel="stylesheet" href="exit-e.css">
<link rel="stylesheet" href="exit-keep.css">
</head>
<body class="xe">

<!-- 출구 시안 E — 큰 선택(가치 판단)과 작은 선택의 위계.
     큰 선택 둘(C1 · C4)은 한 화면씩: 질문 → 그 방의 물건(포스터 둘 / 고른 쪽 얼굴들) → 내 선택 → 같은 칸(선택지)에 맞춘 두 줄 "1874년"(출처 있는 사실) · "오늘의 관람객"(점, 내 점만 주황).
     그다음 흰 쟁반 "그 밖에 고른 것"(C0 메달 · C2 행선지) → 가져가는 것 다섯 → 저장·공유. 평범한 세로 스크롤, 보이는 만큼 차례로 천천히 드러난다(스냅 · 자동 넘김 없음) -->
<main class="xe-deck" id="deck">
  <div class="vsw-row"><nav class="vsw" aria-label="출구 시안"><span class="vsw-lb">출구 시안</span><a href="exit.html">A</a><a href="exit-b.html">B</a><a href="exit-c.html">C</a><a href="exit-d.html">D</a><a href="exit-e.html" aria-current="page">E</a></nav></div>

  <!-- 큰 선택 I · C1 -->
  <section class="xe-ch" id="ch1" data-st="c1" aria-labelledby="q1">
    <header class="xe-hd rv">
      <div class="xe-room" id="room1"></div>
      <h2 class="xe-q" id="q1">어느 전시를<br>보러 가시겠습니까?</h2>
    </header>
    <div class="xe-obj posters rv" id="obj1" aria-hidden="true"></div>
    <div class="xe-me rv">
      <div class="xe-me-lb">나는</div>
      <div class="xe-me-v" id="me1"></div>
      <div class="xe-me-sub" id="sub1"></div>
    </div>
    <div class="xe-cmp" id="cmp1"></div>
  </section>

  <!-- 큰 선택 II · C4 -->
  <section class="xe-ch" id="ch2" data-st="c4" aria-labelledby="q2">
    <header class="xe-hd rv">
      <div class="xe-room" id="room2"></div>
      <h2 class="xe-q" id="q2">사람을 남긴다면,<br>그림입니까 사진입니까?</h2>
    </header>
    <div class="xe-obj faces rv" id="obj2" aria-hidden="true"></div>
    <div class="xe-me rv">
      <div class="xe-me-lb">나는</div>
      <div class="xe-me-v" id="me2"></div>
      <div class="xe-me-sub" id="sub2"></div>
    </div>
    <div class="xe-cmp" id="cmp2"></div>
  </section>

  <!-- 작은 선택 -->
  <section class="xe-end" id="minor" aria-labelledby="minorH">
    <div class="xe-sheet">
      <h2 class="xe-sec-hd rv" id="minorH">그 밖에 고른 것</h2>
      <div class="xe-minor" id="minorCards"></div>
    </div>
  </section>

  <!-- 가져가는 것 — 어두운 나무 탁자 위의 물건 다섯(exit-keep.js). 누르면 집어 들고, 끌어서 돌리고, 기차표 · 엽서는 두 번 눌러 뒷면 -->
  <section class="xe-keep" aria-label="가져가는 것">
    <div class="rv" id="keep"></div>
    <div class="kt-acts">
      <button class="btn white" id="shareTable" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 19h14"/></svg>모두 한 장으로 저장</button>
      <div class="row">
        <button class="btn dark-line" id="share" type="button">나의 선택 저장</button>
        <button class="btn dark-line" id="restart" type="button">처음부터</button>
      </div>
      <p class="foot" id="foot"></p>
    </div>
  </section>
</main>

<script type="module" src="exit-e.js"></script>
</body>
</html>
