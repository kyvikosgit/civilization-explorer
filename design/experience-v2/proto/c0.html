<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0b0605">
<title>C0 · 당신은 오늘의 심사위원입니다</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Freesentation/Freesentation.css">
<link rel="stylesheet" href="proto-base.css">
<link rel="stylesheet" href="c0.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.147.0/examples/jsm/"
} }
</script>
</head>
<body class="c0 intro-pending">

<!-- 살롱 전시실 한 장면 — 입장 · 후보작 벽 · 앞으로 나온 그림 · 오늘의 심사위원단이 모두 이 안에서(c0.js, 방은 c0-intro.js). 화면 전환 없음 -->
<section class="scr on" id="s2">
  <div class="stage" id="stage" data-mode="intro">
    <canvas class="gl" id="gl" aria-label="1873년 살롱 전시실 · 후보작을 누르면 앞으로 나옵니다"></canvas>
    <div class="scrim" aria-hidden="true"></div>
    <div class="topbar wall-top"><button class="icon-btn" id="back2" aria-label="벽으로 돌아가기"><i data-ic="back"></i></button><div class="tb-title" id="wallTitle"></div><span></span></div>

    <!-- 역할 — 벽 위에 얇게 겹친다(벽을 누르지 않는다) -->
    <div class="role" id="role">
      <div class="eyebrow">Salon de 1873</div>
      <h1>당신은 오늘의 심사위원입니다</h1>
      <p class="lead">후보작 다섯 점 가운데 올해의 메달을 줄 한 점을 고르십시오. <button type="button" class="crit-link" id="critBtn">살롱의 기준</button></p>
    </div>
    <div class="hint" id="hint"><span class="pill">그림을 누르면 앞으로 나옵니다</span></div>

    <div class="gest" id="gest"><span class="pill">끌어서 돌려 보기 · 두 손가락으로 확대</span></div>
    <div class="tags" id="tags"></div>
    <div class="dock" id="dock"><button class="btn white award" id="award"><span class="m" id="awardMedal"></span>이 그림에 메달</button></div>
    <div class="intro-skip" aria-hidden="true">누르면 건너뜁니다</div>
    <div class="fade" aria-hidden="true"></div>
  </div>

  <!-- 결과 패널 — 아래에서 올라온다 -->
  <div class="reveal" id="reveal">
    <div class="rv-kick">당신이 메달을 준 그림</div>
    <h2 class="rv-title" id="revTitle"></h2>
    <div class="rv-meta" id="revMeta"></div>
    <p class="rv-line" id="revLine"></p>
    <p class="rv-top" id="revTop"></p>
    <div class="rv-stamp" id="revStamp"></div>
    <div class="btns"><button class="btn line" id="again">다시 고르기</button><button class="btn" id="save">수집함에 저장</button></div>
  </div>
</section>

<!-- 내가 메달을 준 그림 — 카드(기기에서 생성) -->
<section class="scr" id="s4">
  <div class="topbar"><button class="icon-btn" id="back4" aria-label="뒤로"><i data-ic="back"></i></button><div class="tb-title">내가 메달을 준 그림</div><span></span></div>
  <div class="card-wrap">
    <div class="card" id="card">
      <div class="card-wall"><div class="frame mini card-frame" id="cardFrame"><div class="mat"><img alt="" id="cardImg"></div><div class="card-medal" id="cardMedal"></div></div><div class="card-pos" id="cardPos"></div></div>
      <div class="card-body">
        <b id="cardNo"></b>
        <h3 id="cardTitle"></h3>
        <p id="cardMeta"></p>
        <small id="cardShown"></small>
      </div>
    </div>
  </div>
  <div class="btns one"><button class="btn line" id="restart">처음으로</button></div>
</section>

<!-- 확인 시트 -->
<div class="sheet" id="confirm">
  <div class="grip"></div>
  <h3 id="cfTitle">이 그림에 올해의 메달을 줄까요?</h3>
  <div class="btns"><button class="btn line" id="cfBack" data-sheet-close>다시 보기</button><button class="btn" id="cfOk">메달 주기</button></div>
</div>

<!-- 살롱의 기준 -->
<div class="sheet" id="crit">
  <div class="grip"></div>
  <h3>살롱의 기준</h3>
  <ol class="crit-list">
    <li>위대한 주제 <small>신화, 종교, 역사</small></li>
    <li>정확한 인체</li>
    <li>명확한 구도</li>
    <li>완성된 묘사</li>
    <li>고상한 감정</li>
    <li>매끄러운 표면 <small>붓질이 보이면 안 됨</small></li>
    <li>캔버스가 안 보이는 완벽한 채색</li>
  </ol>
  <div class="btns one"><button class="btn" data-sheet-close>닫기</button></div>
</div>

<div id="safeProbe" aria-hidden="true"></div>
<script type="module" src="c0.js"></script>
</body>
</html>
