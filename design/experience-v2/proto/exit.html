<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#151413">
<title>출구 · 오늘의 관람객</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Freesentation/Freesentation.css">
<link rel="stylesheet" href="proto-base.css">
<link rel="stylesheet" href="css/crowd.css">
<link rel="stylesheet" href="exit.css">
</head>
<body class="page exit">

<div class="topbar">
  <a class="icon-btn" href="c5.html" aria-label="뒤로" id="backLink"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
  <div class="tb-title">출구 · 모아 보기</div>
  <span></span>
</div>

<main class="wrap screen">
  <!-- 진입 가벽 — 〈인상, 해돋이〉, 액자 없이 뒤에서 번지는 빛 -->
  <section class="sunrise" aria-label="〈인상, 해돋이〉">
    <div class="glow"></div>
    <img id="sunrise" src="../works/c2-havre-impression-marmottan.jpg" alt="클로드 모네 〈인상, 해돋이〉 1872 · 마르모탕 모네 미술관" draggable="false">
    <div class="sun-cap"><b>〈인상, 해돋이〉</b> 1872 · 마르모탕 모네</div>
  </section>

  <header class="role-hd rise" style="--i:1">
    <div class="eyebrow">당신은</div>
    <h1>모네의 방을 한 바퀴 돈<br>관람객입니다</h1>
    <p class="sub">같은 전시, 다른 받아들임. 네 곳에서 택한 당신의 입장을 오늘의 관람객 옆에 놓습니다.</p>
  </header>

  <!-- 나의 네 입장 · 오늘의 관람객 — 점(하나 = 열 사람)이 위에서 아래로 흐르며 줄마다 나와 같은 쪽만 남는다(js/crowd.js) -->
  <section class="mine crowd dark rise" style="--i:2" aria-label="나의 네 입장 · 오늘의 관람객">
    <div class="crowd-cap">Aujourd'hui</div>
    <div class="crowd-line">나의 네 입장 · 오늘의 관람객</div>
    <div class="flow" id="flow">
      <div class="flow-stage" id="flowStage"><canvas id="crowdCv" aria-hidden="true"></canvas></div>
      <div class="flow-rows" id="rows">
        <div class="flow-gate"><span>모네의 방을 나온 사람</span><b id="gateN"></b></div>
      </div>
      <div class="flow-end" id="same"></div>
    </div>
    <div class="crowd-stamp" id="crowdStamp"></div>
  </section>

  <section class="artifact rise" style="--i:3" aria-label="남은 것">
    <div class="art-cap">남은 것 하나 · C2 그해의 기차표</div>
    <div class="ticket-wrap"><img id="ticket" alt="" draggable="false"><div class="ticket-sub" id="ticketSub"></div></div>
  </section>

  <div class="actions rise" style="--i:4">
    <button class="btn white" id="share" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 19h14"/></svg>저장 · 공유</button>
    <button class="btn dark-line" id="restart" type="button">처음부터</button>
  </div>
  <p class="note foot-note">출구 벽의 질문 “왜 같은 풍경을 계속 그렸을까?”는 벽에 그대로 두고, 앱은 답하지 않습니다. 수치는 예시이며 들르지 않은 곳은 예시 값으로 채웠습니다.</p>
</main>

<!-- 공유 이미지 미리보기 — 기기에서 1080×1920 으로 그린다 -->
<div class="share-ov" id="shareOv" hidden>
  <div class="share-top"><span>공유 이미지 · 1080×1920</span><button class="icon-btn" id="shareClose" type="button" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="share-body"><img id="shareImg" alt="나의 네 입장 · 오늘의 관람객 공유 이미지"></div>
  <div class="share-btns"><button class="btn white" id="shareGo" type="button">사진첩에 저장 · 공유</button></div>
</div>

<script type="module" src="exit.js"></script>
</body>
</html>
