<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#161412">
<title>C3 · 밖의 빛으로 칠하기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Freesentation/Freesentation.css">
<link rel="stylesheet" href="../../../booth/css/base.css">
<link rel="stylesheet" href="c3.css">
</head>
<body class="c3">

<div class="topbar">
  <a class="icon-btn" href="../../experience-v2.html#c3" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
  <div class="tb-title">C3 · 화가의 아틀리에</div>
  <span></span>
</div>

<main class="room">
  <header class="role">
    <div class="eyebrow">당신은</div>
    <h1>튜브 물감을 들고<br>처음 밖으로 나온 화가입니다</h1>
    <p class="sub" id="roleSub">같은 장면을 밖의 빛으로 다시 칠해 보세요</p>
  </header>

  <section class="easel" aria-label="캔버스">
    <div class="frame" id="frame">
      <div class="canvas-wrap" id="stage">
        <img id="indoor" class="indoor" src="img/c3-indoor-tmp.jpg" alt="실내 캔버스 (임시)" draggable="false">
        <canvas id="reveal" class="reveal" aria-label="문질러 칠하기"></canvas>
        <div class="hint" id="hint"><span>손가락으로 문질러 칠하세요</span></div>
        <div class="label" id="label">실내 캔버스</div>
      </div>
    </div>
    <div class="tube-row">
      <div class="tube" id="tube" aria-hidden="true">
        <svg viewBox="0 0 120 40">
          <g class="tube-body">
            <path d="M34 9h66c4 0 6 2 6 6v10c0 4-2 6-6 6H34c-3 0-5-2-5-5V14c0-3 2-5 5-5z" fill="#E9E4D8"/>
            <path d="M100 9c4 0 6 2 6 6v10c0 4-2 6-6 6l-2-2 1-4-1-4 1-4-1-4z" fill="#CFC8B8"/>
            <rect x="46" y="14" width="34" height="12" rx="1.5" fill="#D9672F"/>
            <path d="M34 9v22" stroke="#B8B0A0" stroke-width="1"/>
            <path d="M40 9v22M88 9v22" stroke="rgba(0,0,0,.08)" stroke-width="1"/>
          </g>
          <g class="tube-cap"><rect x="18" y="13" width="12" height="14" rx="2" fill="#8E8778"/><rect x="21" y="13" width="2" height="14" fill="rgba(0,0,0,.18)"/><rect x="25" y="13" width="2" height="14" fill="rgba(0,0,0,.18)"/></g>
          <g class="tube-paint"><path d="M18 20c-5 0-9 3-9 8 0 4 3 7 7 7 5 0 8-3 8-7 0-5-2-8-6-8z" fill="#D9672F"/></g>
        </svg>
      </div>
      <p class="tube-cap-text" id="tubeText">튜브 물감 · 처음 밖으로</p>
    </div>
  </section>

  <section class="after" id="after" hidden>
    <blockquote class="diary">
      <p>“정오와 저녁의 햇빛은 같은 나무도<br>전혀 다른 색으로 만든다.”</p>
      <cite>화가의 일기장</cite>
    </blockquote>
    <div class="fact">
      <b>1841</b>
      <div><p>존 고프 랜드, 접는 금속 튜브 특허</p><p class="muted">그 박스가 지금 옆에 있다</p></div>
    </div>
    <div class="actions">
      <button class="btn line hold" id="hold" type="button">누르고 있으면 실내 캔버스</button>
      <button class="btn" id="save" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 19h14"/></svg>저장</button>
    </div>
  </section>

  <p class="placeholder-note">임시 · 제작 전 대체 이미지. 실내·야외 캔버스 2점은 아직 없어 모네 〈양귀비 들판〉 1873(오르세 · 퍼블릭 도메인) 한 장으로 실내 판을 가공해 대신했다.</p>
</main>

<script type="module" src="c3.js"></script>
</body>
</html>
