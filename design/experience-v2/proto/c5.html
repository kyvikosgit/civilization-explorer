<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0E0D0C">
<title>C5 · 시간 넘기기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Freesentation/Freesentation.css">
<link rel="stylesheet" href="proto-base.css">
<link rel="stylesheet" href="c5.css">
</head>
<body class="page c5">

<div class="topbar">
  <a class="icon-btn" href="index.html" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
  <div class="tb-title">C5 · 모네 전시관</div>
  <span></span>
</div>

<!-- 어두운 방 — 연작 벽. 그림 하나를 누르면 그 자리가 화면을 채운다 -->
<main class="wrap room">
  <header class="role-hd rise" style="--i:0">
    <div class="eyebrow">당신은</div>
    <h1>연작 벽 앞에 선<br>관람객입니다</h1>
    <p class="sub">벽의 그림 하나를 누르면, 같은 자리를 다른 때에 그린 그림으로 넘어갑니다. 질문은 없습니다.</p>
  </header>

  <section class="wall rise" style="--i:1" aria-label="연작 벽">
    <div class="wall-strip" id="strip"></div>
    <!-- 출구 벽의 문장 — 방이 한 번 묻고, 답하지 않는다 -->
    <p class="wall-line" id="wallLine" hidden>왜 같은 풍경을 계속 그렸을까?</p>
    <div class="floor"></div>
  </section>

  <div class="exit-link rise" style="--i:2"><a class="btn quiet" id="toExit" href="exit.html">출구에서 오늘의 관람객 보기 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></a></div>
</main>

<!-- 한 자리, 여러 때 — 전체 화면 -->
<div class="view" id="view" hidden>
  <div class="topbar dark">
    <button class="icon-btn" id="viewClose" type="button" aria-label="벽으로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="tb-title" id="viewTitle"></div>
    <span class="tb-right"><span class="view-count" id="viewCount"></span></span>
  </div>
  <div class="stage" id="stage">
    <img class="layer" id="layerA" alt="" draggable="false">
    <img class="layer" id="layerB" alt="" draggable="false">
    <div class="sweep" id="sweep" aria-hidden="true"></div>
    <div class="swipe-hint" id="swipeHint"><span>옆으로 밀어 다른 때로</span></div>
  </div>
  <div class="caption" id="caption" aria-live="polite">
    <div class="cap-when" id="capWhen"></div>
    <div class="cap-title" id="capTitle"></div>
    <div class="cap-meta" id="capMeta"></div>
  </div>
  <div class="rail" id="rail" role="tablist" aria-label="때"></div>
</div>

<script type="module" src="c5.js"></script>
</body>
</html>
