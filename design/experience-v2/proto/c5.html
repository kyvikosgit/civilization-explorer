<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0E0D0C">
<title>C5 · 인상, 해돋이</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Freesentation/Freesentation.css">
<link rel="stylesheet" href="proto-base.css">
<link rel="stylesheet" href="c5.css">
</head>
<body class="page c5">

<div class="topbar">
  <a class="icon-btn" href="index.html" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
  <div class="tb-title">C5 · 모네 전시관</div>
  <span></span>
</div>

<!-- 마지막 방 — 〈인상, 해돋이〉 한 점. 비추면 그림이 뜨고, 그림이 그날 아침의 장면으로 풀렸다가 다시 그림으로 돌아온다 -->
<main class="wrap room">
  <header class="role-hd rise" style="--i:0">
    <div class="eyebrow">당신은</div>
    <h1>〈인상, 해돋이〉 앞에 선<br>관람객입니다</h1>
    <p class="sub">1872년 르아브르, 모네가 묵던 호텔 창밖의 항구</p>
  </header>

  <!-- 무대 — 그림 비율 그대로의 한 자리. 비추기 → 그림 → 장면 → 그림이 모두 이 자리에서 일어난다 -->
  <section class="sun-wrap rise" style="--i:1" aria-label="인상, 해돋이">
    <div class="sun-stage" id="sunStage" data-state="scan">
      <video id="sunVid" muted playsinline preload="auto" disablepictureinpicture aria-hidden="true" tabindex="-1"></video>
      <img id="sunImg" src="img/c5/sunrise-painting.jpg" alt="클로드 모네, 〈인상, 해돋이〉, 1872" draggable="false">
      <canvas id="sunCv" aria-hidden="true"></canvas>
      <span class="sun-tmp" id="sunTmp" hidden>임시 영상</span>
      <button class="scan" id="scan" type="button" aria-label="〈인상, 해돋이〉를 비추기 (시연: 누르면 인식)">
        <span class="scan-view" aria-hidden="true"></span>
        <span class="scan-frame" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span class="scan-txt"><b>〈인상, 해돋이〉를 비춰 보세요</b><small>시연 · 누르면 인식</small></span>
      </button>
    </div>

    <!-- 그림 아래 한 자리 — 장면일 때는 때와 곳, 끝나면 한 줄과 단추 -->
    <div class="sun-below">
      <div class="sun-cap" id="sunCap" aria-live="polite">
        <b>1872년 11월 13일 아침, 르아브르</b>
        <small>날짜는 추정 · AI로 재현한 장면</small>
      </div>
      <div class="sun-end" id="sunEnd">
        <p class="sun-line">모네는 이 아침을 이렇게 남겼습니다.</p>
        <p class="sun-meta">〈인상, 해돋이〉 · 1872 · 마르모탕 모네 미술관, 파리</p>
        <div class="sun-acts">
          <button class="sun-btn" id="sunReplay" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg>다시 보기</button>
          <a class="sun-btn quiet" id="sunSave" href="img/c5/sunrise-painting.jpg" download="monet-impression-sunrise.jpg">이 그림 저장</a>
        </div>
      </div>
    </div>
  </section>

  <!-- 연작은 뒤로 — 조용한 링크 하나. 누르면 아래에 연작 벽이 열린다(기능은 그대로) -->
  <div class="series-link"><button class="btn quiet" id="toSeries" type="button" aria-expanded="false" aria-controls="wall">연작 보기 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button></div>

  <!-- 연작 벽. 벽에는 그림이 따로따로 걸려 있다. 한 줄을 누르면 그 연작이 한 점이 되어 화면을 채운다 -->
  <section class="wall" id="wall" aria-label="연작 벽" hidden>
    <div class="wall-strip" id="strip"></div>
    <!-- 출구 벽의 문장 — 방이 한 번 묻고, 답하지 않는다 -->
    <p class="wall-line" id="wallLine" hidden>왜 같은 풍경을 계속 그렸을까?</p>
    <div class="floor"></div>
  </section>

  <div class="exit-link"><a class="btn quiet" id="toExit" href="exit-e.html">출구에서 오늘의 관람객 보기 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></a></div>
</main>

<!-- 한 점이 된 연작 — 전체 화면. 열리면 해는 지금 시간에 가 있다. 해를 끌어 하루를 돌린다 -->
<div class="view" id="view" hidden>
  <div class="topbar dark">
    <button class="icon-btn" id="viewClose" type="button" aria-label="벽으로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="tb-title" id="viewTitle"></div>
    <span class="tb-right"><span class="view-count" id="viewCount"></span></span>
  </div>

  <!-- 지금 시간의 그림 — 폰의 시계를 하루 호 위에 올린 한 줄 -->
  <div class="now-line" id="nowLine" aria-live="polite"><b id="nowClock"></b><span id="nowWhat"></span></div>

  <!-- 하늘: 호 위의 해를 끌면 때가 바뀐다. 손을 떼면 해가 저절로 느리게 간다(하루 45초) -->
  <div class="sky" id="sky" aria-label="해를 끌어 때를 바꾸기">
    <svg id="arc" aria-hidden="true"></svg>
    <div class="sun" id="sun" role="slider" aria-label="때" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0" tabindex="0"></div>
  </div>

  <div class="stage" id="stage">
    <div class="frame" id="frame"><canvas id="cv" aria-label="연작 한 점"></canvas><div class="paused" id="paused" hidden>멈춤</div></div>
    <div class="caption" id="caption" aria-live="polite">
      <div class="cap-when" id="capWhen"></div>
      <div class="cap-title" id="capTitle"></div>
      <div class="cap-meta" id="capMeta"></div>
    </div>
  </div>

  <!-- 그림 사이를 건너는 방식 — 모핑(기본: 형태가 주우욱 이어지며 바뀐다, 대응점 메시 워프 + 디졸브)과 픽셀을 고르는 규칙 넷 -->
  <div class="styles" id="styles" role="radiogroup" aria-label="그림이 바뀌는 방식">
    <button type="button" role="radio" data-style="0" class="on" aria-checked="true">모핑</button>
    <button type="button" role="radio" data-style="1" aria-checked="false">붓자국</button>
    <button type="button" role="radio" data-style="2" aria-checked="false">빛 쓸림</button>
    <button type="button" role="radio" data-style="3" aria-checked="false">번짐</button>
    <button type="button" role="radio" data-style="4" aria-checked="false">겹칠</button>
  </div>

  <div class="actions" id="actions">
    <button class="keep" id="keep" type="button">이 시간을 남기기</button>
    <div class="kept" id="kept" hidden>
      <img id="keptImg" alt="" draggable="false">
      <div class="kept-txt"><b id="keptLine"></b><small id="keptMeta"></small><a id="keptDl" class="kept-dl" download="monet-c5.jpg" href="#">내려받기</a></div>
    </div>
  </div>
</div>

<script type="module" src="c5.js"></script>
</body>
</html>
