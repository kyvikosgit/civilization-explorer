<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Billet OUEST · mock · 어디까지 갈까</title>
<link rel="stylesheet" href="fonts.css">
<style>
/* 57×30 mm 에드몬슨 카드 → 20 px/mm = 1140×600 px.  글꼴: Old Standard TT(19세기 디돈 계열 본문·숫자, OFL) ·
   Playfair Display(디돈 팻페이스, 큰 숫자, OFL) · 한글 주석만 Freesentation.  서체 선택 근거는 보드 C2 참고.
   ?to=argenteuil|vernon|rouen|ifs|havre  ·  ?view=front|back|phone  ·  ?d=21&m=10 (관람일) */
:root{
  --card:#E8DCB8;            /* 담황색 카드(한 가지 색, 등급별 색 미확인) */
  --card-2:#DFD0A6;
  --ink:#2A2420;             /* 인쇄 잉크 */
  --ink-soft:#4A413A;
  --stamp:#3B3F8C;           /* 날인 잉크(보라·남색) */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#FFF}
body{font-family:'Old Standard TT',serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.stage{width:1140px;height:600px;position:relative;overflow:hidden}

/* 카드 */
.card{position:absolute;inset:0;background:
  radial-gradient(120% 90% at 30% 20%,rgba(255,255,255,.28),transparent 60%),
  repeating-linear-gradient(115deg,rgba(0,0,0,.025) 0 2px,transparent 2px 7px),
  linear-gradient(180deg,var(--card),var(--card-2));
  border-radius:10px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.10)}
.card::after{content:"";position:absolute;inset:0;border-radius:10px;pointer-events:none;
  background:
   radial-gradient(circle at 12% 78%,rgba(90,70,30,.10),transparent 18%),
   radial-gradient(circle at 86% 24%,rgba(90,70,30,.08),transparent 16%)}

/* 양 끝 세로 일련번호 (1898년 실물 방식) */
.serial{position:absolute;top:0;bottom:0;width:86px;display:flex;align-items:center;justify-content:center}
.serial span{font-weight:700;font-size:58px;letter-spacing:.14em;writing-mode:vertical-rl;color:var(--ink)}
.serial.l{left:0}.serial.l span{transform:rotate(180deg)}
.serial.r{right:0}

/* 인쇄 틀 */
.frame{position:absolute;left:92px;right:92px;top:30px;bottom:30px;border:3px solid var(--ink);outline:1.5px solid var(--ink);outline-offset:4px;
  display:grid;grid-template-rows:auto 1fr auto}
.route{border-bottom:3px solid var(--ink);padding:14px 20px 10px;text-align:center;line-height:1}
.route .from{font-size:60px;font-weight:700;letter-spacing:.06em}
.route .from small{font-size:34px;font-weight:700;letter-spacing:.02em}
.route .to{font-size:92px;font-weight:700;letter-spacing:.10em;margin-top:4px;font-family:'Playfair Display',serif;white-space:nowrap}
.route .to.long{font-size:78px;letter-spacing:.06em}
.route .via{font-size:26px;font-style:italic;letter-spacing:.04em;margin-top:2px;color:var(--ink-soft);min-height:26px}
.mid{display:grid;grid-template-columns:232px 1fr 230px}
.mid>div{padding:10px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1}
.mid .co{border-right:3px solid var(--ink)}
.mid .co b{font-size:50px;letter-spacing:.12em;font-weight:700}
.mid .co i{font-style:normal;font-size:22px;margin-top:10px;letter-spacing:.08em;color:var(--ink-soft)}
.mid .cls .n{font-family:'Playfair Display',serif;font-weight:900;font-size:150px;line-height:.9;letter-spacing:-.02em}
.mid .cls .n sup{font-size:48px;font-family:'Old Standard TT',serif;font-weight:700;vertical-align:top;position:relative;top:22px;letter-spacing:0}
.mid .cls .w{font-size:40px;font-weight:700;letter-spacing:.18em;margin-top:6px}
.mid .cls .pe{font-size:24px;letter-spacing:.14em;margin-top:8px;color:var(--ink-soft)}
.mid .px{border-left:3px solid var(--ink)}
.mid .px small{font-size:22px;letter-spacing:.2em}
.mid .px b{font-size:66px;line-height:1;margin-top:10px;font-weight:700;white-space:nowrap}
.mid .px b sup{font-size:30px;vertical-align:top;position:relative;top:6px}
.mid .px b.none{font-size:40px;color:var(--ink-soft);letter-spacing:.3em}
.foot{border-top:3px solid var(--ink);display:grid;grid-template-columns:auto 1fr;align-items:center;padding:8px 20px;line-height:1;min-height:70px}
.foot .aller{font-size:40px;font-weight:700;letter-spacing:.3em}
.foot .yr{font-size:30px;letter-spacing:.14em;color:var(--ink-soft);text-align:right;font-weight:700}

/* 날인(기기에서 합성): 날짜는 왼쪽 가장자리 세로 */
.stamp{position:absolute;color:var(--stamp);font-weight:700;letter-spacing:.08em;opacity:.86;
  mix-blend-mode:multiply;filter:url(#rough)}
.stamp.date{left:-74px;top:50%;width:300px;text-align:center;transform:translateY(-50%) rotate(-90deg);transform-origin:center;font-size:38px;white-space:nowrap}
.stamp.date::before,.stamp.date::after{content:"";display:inline-block;width:28px;height:3px;background:var(--stamp);vertical-align:middle;margin:0 14px}

/* 뒷면: 메모 없음. 회사명·구간·날짜·재현물 표기만 */
.back .frame{display:block;padding:40px 36px}
.back .k{font-size:24px;letter-spacing:.22em;color:var(--ink-soft);text-align:center}
.back .ttl{font-size:44px;font-weight:700;letter-spacing:.16em;text-align:center;margin-top:14px;font-family:'Playfair Display',serif}
.back .ttl small{display:block;font-size:26px;letter-spacing:.06em;font-weight:400;margin-top:18px;color:var(--ink-soft);font-family:'Old Standard TT',serif}
.back .rule{width:220px;height:3px;background:var(--ink);margin:40px auto 0}
.back .fine{position:absolute;left:36px;right:36px;bottom:16px;font-size:17px;letter-spacing:.04em;color:var(--ink-soft);display:flex;justify-content:space-between}
.back .fine b{font-family:Freesentation,sans-serif;font-weight:600}

/* 폰 화면 (390×844) */
.phone{width:390px;height:844px;background:#FFF;font-family:Freesentation,-apple-system,sans-serif;color:#111;padding:54px 16px 0;position:relative;overflow:hidden}
.phone .bar{display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:700;color:#6B6B68}
.phone .bar b{color:#111}
.phone h1{font-family:Paperlogy,Freesentation,sans-serif;font-weight:800;font-size:24px;margin-top:22px;line-height:1.25}
.phone .sub{font-size:13.5px;color:#6B6B68;margin-top:4px}
.phone .tk{margin-top:18px;width:358px;height:188.4px;border-radius:8px;overflow:hidden;box-shadow:0 10px 24px -14px rgba(0,0,0,.45)}
.phone .tk .stage{transform:scale(.31404);transform-origin:0 0}
.phone .cap{font-size:12px;color:#9A9A96;margin-top:8px;text-align:center}
.phone .hist{margin-top:22px;border-top:1px solid #111;padding-top:12px;font-size:14.5px;line-height:1.55;color:#3D3D3A}
.phone .hist b{color:#111}
.phone .btn{margin-top:auto;height:50px;border:2px solid #111;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;border-radius:2px}
.phone .btns{position:absolute;left:16px;right:16px;bottom:28px;display:grid;gap:8px}
.phone .btns .btn.fill{background:#111;color:#FFF}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2.2"/></filter></svg>

<template id="front">
<div class="stage front">
  <div class="card"></div>
  <div class="serial l"><span data-no></span></div>
  <div class="serial r"><span data-no></span></div>
  <div class="frame">
    <div class="route">
      <div class="from">PARIS <small>(S<sup style="font-size:.55em">t</sup>-LAZARE)</small></div>
      <div class="to" data-to></div>
      <div class="via" data-via></div>
    </div>
    <div class="mid">
      <div class="co"><b>OUEST</b><i>SÉRIE A</i></div>
      <div class="cls"><div class="n">2<sup>me</sup></div><div class="w">CLASSE</div><div class="pe">PLACE ENTIÈRE</div></div>
      <div class="px"><small>PRIX</small><b data-prix></b></div>
    </div>
    <div class="foot"><div class="aller">ALLER</div><div class="yr" data-yr></div></div>
  </div>
  <div class="stamp date" data-date></div>
</div>
</template>

<template id="back">
<div class="stage back">
  <div class="card"></div>
  <div class="serial l"><span data-no></span></div>
  <div class="serial r"><span data-no></span></div>
  <div class="frame">
    <div class="k">CHEMIN DE FER DE L'OUEST</div>
    <div class="ttl">PARIS – <span data-to-text></span><small data-longdate></small></div>
    <div class="rule"></div>
    <div class="fine"><span>N° <span data-no></span> · 2<sup>me</sup> classe · aller</span><b>MONET 100 · 재현물 · <span data-ko-date></span></b></div>
  </div>
</div>
</template>

<template id="phone">
<div class="phone">
  <div class="bar"><b>9:41</b><span>C2 · 매표창</span></div>
  <h1>나의 기차표</h1>
  <div class="sub" data-sub></div>
  <div class="tk" data-slot="front"></div>
  <div class="cap">표를 눌러 뒤집기</div>
  <div class="tk" data-slot="back"></div>
  <div class="hist" data-hist></div>
  <div class="btns"><div class="btn fill">모네는 거기서 무엇을 했나</div><div class="btn">수집함에 저장</div></div>
</div>
</template>

<script>
// 목적지 데이터. 연도 = 모네가 그곳에 머문 해(보드 C2 표). 운임은 그 해 ±3년 안의 안내서에 있는 2등 값만 찍는다. 없으면 빈 칸.
const DEST={
  argenteuil:{to:'ARGENTEUIL', via:'',                 year:1874, prix:null,   ko:'아르장퇴유', hist:'<b>아르장퇴유</b> 1871년 말부터 1878년 초까지 살았다. 배 위의 작업실, 요트 경주, 철교. 생라자르에서 25분(1875년 시간표).'},
  rouen:     {to:'ROUEN',      via:'rive droite',      year:1892, prix:null,   ko:'루앙', hist:'<b>루앙</b> 1892년 2월부터 두 해 봄, 대성당 맞은편 방에서 같은 정면을 시각마다 다시 그렸다. 서른 점 남짓. 파리에서 140 km, 급행 2시간 40분(1875년 시간표).'},
  havre:     {to:'LE HAVRE',   via:'par Rouen',        year:1872, prix:'21<sup>f</sup>05', ko:'르아브르', hist:'<b>르아브르</b> 모네가 자란 항구. 1872년 11월경 호텔 창문에서 〈인상, 해돋이〉를 그렸다. 급행 4시간 30분, 2등 21 fr. 05(1874년 안내서).'},
  vernon:    {to:'VERNON',     via:'',                 year:1883, prix:null,   ko:'베르농 · 지베르니', hist:'<b>베르농</b> 1883년 4월, 파리–루앙선 베르농역 너머 지베르니 마을의 집을 빌렸다. 파리에서 80 km(1867년 안내서).'},
  ifs:       {to:'LES IFS',    via:'par Beuzeville',   year:1883, prix:null,   ko:'레지프 · 에트르타', hist:'<b>레지프</b> 에트르타까지는 철도가 없어 역에서 마차로 15 km(1867년 안내서). 1883년 1~2월, 비수기의 절벽을 그렸다.'},
};
const q=new URLSearchParams(location.search);
const key=(q.get('to')||'havre').toLowerCase();
const D=DEST[key]||DEST.havre;
const view=q.get('view')||'front';
const day=parseInt(q.get('d')||'21',10), mon=parseInt(q.get('m')||'10',10);
const no=(q.get('no')||'04173');
const MF=['JANV','FÉV','MARS','AVR','MAI','JUIN','JUIL','AOÛT','SEPT','OCT','NOV','DÉC'];
const MFL=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const WD=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const WK=['일','월','화','수','목','금','토'];
const dt=new Date(D.year,mon-1,day);
const wd=dt.getDay();
const toText=D.to.replace(/<[^>]+>/g,'');
function make(id){return document.getElementById(id).content.firstElementChild.cloneNode(true)}
function fill(root){
  root.querySelectorAll('[data-no]').forEach(e=>e.textContent=no);
  const to=root.querySelector('[data-to]'); if(to){to.innerHTML=D.to; if(toText.length>9) to.classList.add('long');}
  const via=root.querySelector('[data-via]'); if(via) via.innerHTML=D.via||'';
  const px=root.querySelector('[data-prix]'); if(px){ if(D.prix){px.innerHTML=D.prix;} else {px.textContent='— —'; px.classList.add('none');} }
  const yr=root.querySelector('[data-yr]'); if(yr) yr.textContent=D.year;
  const ds=root.querySelector('[data-date]'); if(ds) ds.textContent=`${day} ${MF[mon-1]} ${D.year}`;
  const tt=root.querySelector('[data-to-text]'); if(tt) tt.textContent=toText;
  const ld=root.querySelector('[data-longdate]'); if(ld) ld.textContent=`${WD[wd]} ${day} ${MFL[mon-1]} ${D.year}`;
  const kd=root.querySelector('[data-ko-date]'); if(kd) kd.textContent=`${D.year}년 ${mon}월 ${day}일 ${WK[wd]}요일`;
  return root;
}
let root;
if(view==='phone'){
  root=make('phone');
  root.querySelector('[data-sub]').textContent=`${D.year}년 ${mon}월 ${day}일 ${WK[wd]}요일 · 생라자르역 → ${D.ko}`;
  root.querySelector('[data-hist]').innerHTML=D.hist;
  root.querySelector('[data-slot=front]').appendChild(fill(make('front')));
  root.querySelector('[data-slot=back]').appendChild(fill(make('back')));
}else{
  root=fill(make(view==='front'?'front':'back'));
}
document.body.appendChild(root);
</script>
</body>
</html>
