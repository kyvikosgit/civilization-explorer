<!doctype html>
<html lang="ko" class="B">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>B 지면 · 내 티켓</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="B.css">
</head>
<body>
<div class="phone">
  <div class="sb"></div>
  <header class="tb" data-title="내 티켓"></header>
  <main class="scroll">

    <!-- 예시 값: 예매번호는 앱 입력창 예시(NOL-24X7-0481), 일시는 개막일 첫 회차 -->
    <article class="tk">
      <div class="tk-img"><img src="img/kv_land.jpg" alt=""><img src="img/lockup.png" alt="MONET 100"></div>
      <div class="tk-qr">
        <img src="img/qr_example.svg" alt="입장 QR">
        <p class="tk-code">NOL-24X7-0481</p>
        <p class="tk-say">게이트 스태프에게 제시하세요</p>
      </div>
      <dl class="info">
        <div><dt>관람일</dt><dd class="num">26.12.05(토) · 10:00 회차</dd></div>
        <div><dt>권종</dt><dd>성인 1매 · NOL 예매</dd></div>
        <div><dt>장소</dt><dd>신세계본점 더 헤리티지 4F 뮤지엄</dd></div>
      </dl>
    </article>

    <section class="sec" style="padding-top:36px">
      <h2 class="sec-t">NOL 예매분 등록</h2>
      <p class="cell-s">NOL(놀티켓) 예매번호를 등록하면 QR 입장권으로 바뀝니다.</p>
      <div class="field">NOL 예매번호 (예: NOL-24X7-0481)</div>
      <a class="btn btn-white" href="#" style="margin-top:12px">등록하기</a>
      <p class="foot">티켓은 계정에 보관되어 어느 기기에서든 유지됩니다.</p>
    </section>

  </main>
  <nav class="tabbar" data-set="platform" data-on="ticket"></nav>
</div>
<script src="kit.js"></script>
</body>
</html>
