<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<base href="/design/experience-v3/">  <!-- it-ta.com/live 짧은 주소로 열어도 live.js 를 같은 곳에서 찾게 -->
<title>나다르 사진관 · 실시간 미리보기</title>
<link rel="icon" href="data:,">
<link rel="manifest" href="live.webmanifest">
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Freesentation/Freesentation.css">
<style>
/* 태블릿: 촬영기 폰 카메라가 보는 화면을 실시간으로(거울처럼 좌우 반전)
   관람객 모드(기본, it-ta.com/live): 만져도 아무 반응 없음 — 버튼 · 확대 · 길게 누르기 · 선택 전부 막음. 연결이 끊겼을 때만 상태 글자
   직원 패널(왼쪽 위 구석 3초 누르기 또는 ?staff=1): 상태 숫자 · 전체 화면 · [관람객 모드로](전체 화면 + 잠금). 줌은 촬영기 폰 화면에서 두 손가락으로
   화면: 찍히는 3:4 범위를 화면 가득(좌우 끝이 조금 잘림) · 화질 예전 설정(1280px) 고정 · 거울처럼 좌우 반전 고정 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;color:#F2EDE2;font-family:Freesentation,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
/* 뷰파인더 = 찍히는 범위 그대로(촬영기 줌 배율 · 3:4 가운데). 남는 곳은 검은 여백 */
.vf{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scaleX(var(--m,-1));overflow:hidden;background:#000;pointer-events:none}
.vf video{position:absolute;max-width:none}
.waitbox{position:fixed;inset:0;display:grid;place-items:center;text-align:center;line-height:1.6;pointer-events:none}
.waitbox[hidden]{display:none}
.waitbox>div{max-width:min(720px,90vw);display:flex;flex-direction:column;gap:14px}
#wstep{color:#F2EDE2;font-size:22px;font-weight:600;word-break:keep-all}
#wsub{font-size:14px;color:#9C958A;word-break:keep-all}
/* 직원 패널 */
.staff{position:fixed;left:0;right:0;bottom:0;padding:14px 18px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.78) 30%);display:flex;flex-direction:column;gap:10px;font-size:15px;touch-action:manipulation}
.staff[hidden]{display:none}
.staff .info{font-size:13px;color:#C9C2B5;line-height:1.5;word-break:keep-all}
.staff .info b{color:#E9C77A;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.staff button{font:600 15px Freesentation,sans-serif;color:#141210;background:#F2EDE2;border:0;border-radius:10px;padding:12px 16px;min-height:48px}
.staff button.dark{background:rgba(255,255,255,.14);color:#F2EDE2}
.sp{flex:1}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#888;margin-right:6px}
.dot.ok{background:#4CC27A}.dot.wait{background:#E9C77A}.dot.bad{background:#E5404F}
/* 11/20: 왼쪽 위 구석을 3초 누르면 직원 패널(주소를 바꾸지 않아도) — 누르는 동안 구석에 차오르는 고리 */
.hold{position:fixed;left:calc(14px + env(safe-area-inset-left));top:calc(14px + env(safe-area-inset-top));width:44px;height:44px;border-radius:50%;pointer-events:none;opacity:0;transition:opacity .2s;background:conic-gradient(#E9C77A calc(var(--p,0)*1turn),rgba(255,255,255,.18) 0);-webkit-mask:radial-gradient(circle,transparent 15px,#000 16px);mask:radial-gradient(circle,transparent 15px,#000 16px);z-index:20}
.hold.on{opacity:1}
</style>
</head>
<body>
<div class="vf" id="vf"><video id="v" playsinline muted autoplay></video></div>
<div class="waitbox" id="wait"><div><div id="wstep">촬영기를 기다리는 중</div><small id="wsub"></small></div></div>
<div class="hold" id="hold"></div>
<div class="staff" id="staff" hidden>
  <div class="info"><i class="dot wait" id="dot"></i><span id="st">연결 중</span> · <span id="res">-</span><br><span id="zinfo">촬영기 줌 정보 기다리는 중</span><br><span id="dbg"></span></div>
  <div class="row">
    <span class="sp"></span>
    <button type="button" class="dark" id="fs">전체 화면</button>
    <button type="button" id="lock">관람객 모드로</button>
  </div>
</div>
<script type="module">
import { liveViewer, PROFILES } from './live.js';
const $ = (s) => document.getElementById(s), video = $('v'), root = document.documentElement.style;
const q = new URLSearchParams(location.search);
const KEY = (() => { const k = q.get('k'); try { if (k) localStorage.setItem('m100-booth-k', k); return k || localStorage.getItem('m100-booth-k'); } catch { return k; } })();
const pref = (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
let STAFF = q.has('staff');

// 관람객 모드: 모든 손짓 막기(길게 누르기 메뉴 · 두 번 눌러 확대 · 두 손가락 확대 · 끌기)
const block = (e) => { if (!STAFF || !e.target.closest?.('.staff')) e.preventDefault(); };
['contextmenu', 'selectstart', 'dragstart', 'gesturestart', 'dblclick'].forEach((ev) => document.addEventListener(ev, block, { passive: false }));
document.addEventListener('touchmove', block, { passive: false });
document.addEventListener('touchstart', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

// 11/20: 화질은 예전 설정(1280px · 3Mbps) 고정 · 좌우 반전 고정(거울처럼) — 태블릿은 관람객이 사진에 어떻게 잡히는지 보는 용도라 버튼 없음
const mirror = true, profile = 'old';
let LV = null, zoom = 1, cropZ = 1;
// 찍히는 범위만 꼭 맞게 — 촬영기 shoot() 의 자르기와 같은 계산(받는 영상은 촬영기 원본과 같은 비율)
function fitFrame() {
  const iw = video.videoWidth, ih = video.videoHeight, vf = $('vf'); if (!iw) return;
  let cw = iw / cropZ, ch = ih / cropZ; if (cw / ch > 3 / 4) cw = ch * 3 / 4; else ch = cw * 4 / 3;
  const W = innerWidth, H = innerHeight; let fw = W, fh = W * 4 / 3; if (fh < H) { fh = H; fw = H * 3 / 4; }   // 11/20: 화면을 꽉 채운다(좌우 끝이 조금 잘려도 됨 — 위아래 검은 여백 없이)
  const s = fw / cw; vf.style.width = fw + 'px'; vf.style.height = fh + 'px';
  Object.assign(video.style, { width: iw * s + 'px', height: ih * s + 'px', left: (fw - iw * s) / 2 + 'px', top: (fh - ih * s) / 2 + 'px' });
}
addEventListener('resize', fitFrame); video.addEventListener('loadedmetadata', fitFrame); video.addEventListener('resize', fitFrame);
function apply() {
  root.setProperty('--m', mirror ? -1 : 1);
}
apply();
$('staff').hidden = !STAFF;
// 전체 화면 켜기/끄기 한 단추 — 지금 상태에 맞춰 글자도 바뀐다
const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
const fsLabel = () => { $('fs').textContent = isFs() ? '전체 화면 끄기' : '전체 화면'; };
$('fs').onclick = () => { (isFs() ? (document.exitFullscreen || document.webkitExitFullscreen)?.call(document) : document.documentElement.requestFullscreen?.())?.catch?.(() => {}); };
['fullscreenchange', 'webkitfullscreenchange'].forEach((ev) => document.addEventListener(ev, fsLabel)); fsLabel();
$('lock').onclick = () => { document.documentElement.requestFullscreen?.().catch(() => {}); STAFF = false; $('staff').hidden = true; };
// 왼쪽 위 구석(100px)을 3초 누르면 직원 패널 켜기/끄기 — 관람객이 스쳐 누르는 정도로는 안 열리게
let holdT = 0, holdA = 0;
const holdStop = () => { clearTimeout(holdT); cancelAnimationFrame(holdA); holdT = 0; $('hold').classList.remove('on'); $('hold').style.setProperty('--p', 0); };
document.addEventListener('pointerdown', (e) => {
  if (e.clientX >= 100 || e.clientY >= 100 || e.target.closest?.('.staff')) return;
  holdStop(); const t0 = performance.now();
  const step = () => { const p = (performance.now() - t0) / 3000; if (p > 0.15) $('hold').classList.add('on'); $('hold').style.setProperty('--p', Math.min(1, p)); holdA = requestAnimationFrame(step); };
  holdA = requestAnimationFrame(step);
  holdT = setTimeout(() => { holdStop(); STAFF = !STAFF; $('staff').hidden = !STAFF; navigator.vibrate?.(30); }, 3000);
});
['pointerup', 'pointercancel'].forEach((ev) => document.addEventListener(ev, holdStop));
const state = (s) => {
  $('dot').className = 'dot ' + (s === 'connected' ? 'ok' : s === 'lost' ? 'bad' : 'wait');
  $('st').textContent = s === 'connected' ? '실시간 연결됨' : s === 'lost' ? '끊김 · 다시 연결 중' : '연결 중';
  $('wait').hidden = s === 'connected';
};
liveViewer(KEY, {
  profile,
  onStats: (s) => { $('res').textContent = `${PROFILES[profile].label.split(' · ')[0]} 설정 · ${s.w}×${s.h} · ${s.fps}fps · ${s.mbps.toFixed(1)}Mbps · 지연 약 ${Math.round(s.delay)}ms`; },
  onStream: (st) => { video.srcObject = st; video.play().catch(() => {}); },
  onMeta: (m) => {
    if (!m) return;
    cropZ = m.z || 1; zoom = m.zoom || 1; fitFrame();
    $('zinfo').innerHTML = m.cap ? `촬영기 줌 <b>${(m.zoom || 1).toFixed(1)}배</b> · 카메라 줌 지원 ${(+m.cap.min).toFixed(1)}~${(+m.cap.max).toFixed(1)}배` + (cropZ > 1 ? ' (최대를 넘는 만큼 잘라서)' : '')
      : `촬영기 줌 <b>${(m.zoom || 1).toFixed(1)}배</b> · 카메라 줌 지원 안 함(화면을 잘라서)`;
  },
  onState: state,
  onDebug: (step, detail) => { $('wstep').textContent = step; $('wsub').textContent = detail; $('dbg').textContent = detail; },
}).then((v) => { LV = v; }).catch((e) => { $('wstep').textContent = '연결 실패 · 인터넷 확인'; console.warn(e); });
// 화면 꺼짐 막기
let lock = null; const awake = async () => { try { lock = await navigator.wakeLock?.request('screen'); } catch {} };
awake(); document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') awake(); });
</script>
</body>
</html>
