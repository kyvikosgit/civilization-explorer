<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<base href="/design/experience-v3/">  <!-- it-ta.com/live 짧은 주소로 열어도 live.js 를 같은 곳에서 찾게 -->
<title>나다르 사진관 · 실시간 미리보기</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Freesentation/Freesentation.css">
<style>
/* 태블릿: 촬영기 폰 카메라가 보는 화면을 실시간으로(거울처럼 좌우 반전이 기본). 화면 누르면 반전 켜고 끄기
   주소: nadar-live.html?room=c4&k=촬영기키 (촬영기와 같은 room · 같은 키) */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;color:#F2EDE2;font-family:Freesentation,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:var(--fit,cover);transform:scaleX(var(--m,-1)) scale(var(--z,1));transform-origin:50% 50%;background:#000}
.hud{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.72));font-size:17px;transition:opacity .6s}
.hud.off{opacity:0}
.hud b{color:#E9C77A;font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#888;margin-right:8px;vertical-align:1px}
.dot.ok{background:#4CC27A}.dot.wait{background:#E9C77A}.dot.bad{background:#E5404F}
.btns{display:flex;gap:8px}
.btns button{font:600 15px Freesentation,sans-serif;color:#141210;background:#F2EDE2;border:0;border-radius:10px;padding:12px 16px}
.waitbox{position:fixed;inset:0;display:grid;place-items:center;text-align:center;font-size:20px;line-height:1.6;color:#B9B2A4;pointer-events:none}
.waitbox[hidden]{display:none}
.waitbox>div{max-width:min(720px,90vw);display:flex;flex-direction:column;gap:14px}
#wstep{color:#F2EDE2;font-size:22px;font-weight:600;word-break:keep-all}
#wsub{font-size:14px;color:#9C958A;word-break:keep-all}
.dbg{display:block;font-size:12.5px;color:#B9B2A4;margin-top:4px}
</style>
</head>
<body>
<video id="v" playsinline muted autoplay></video>
<div class="waitbox" id="wait"><div><div id="wstep">촬영기를 기다리는 중</div><small id="wsub"></small></div></div>
<div class="hud" id="hud">
  <span><i class="dot wait" id="dot"></i><span id="st">연결 중</span> · 방 <b id="room"></b> · <span id="res">-</span><span class="dbg" id="dbg"></span></span>
  <span class="btns"><button type="button" id="mir">좌우 반전 켬</button><button type="button" id="fit">꽉 채움</button><button type="button" id="fs">전체 화면</button></span>
</div>
<script type="module">
import { liveViewer } from './live.js';
const $ = (s) => document.getElementById(s), video = $('v'), root = document.documentElement.style;
const q = new URLSearchParams(location.search);
const KEY = (() => { const k = q.get('k'); try { if (k) localStorage.setItem('m100-booth-k', k); return k || localStorage.getItem('m100-booth-k'); } catch { return k; } })();
$('room').textContent = q.get('room') || 'c4';
const pref = (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
let mirror = pref('m100-live-mirror', '1') === '1', cover = pref('m100-live-fit', 'cover') === 'cover';
function apply() {
  root.setProperty('--m', mirror ? -1 : 1); root.setProperty('--fit', cover ? 'cover' : 'contain');
  $('mir').textContent = mirror ? '좌우 반전 켬' : '좌우 반전 끔'; $('fit').textContent = cover ? '꽉 채움' : '전체 보기';
}
apply();
$('mir').onclick = () => { mirror = !mirror; save('m100-live-mirror', mirror ? '1' : '0'); apply(); };
$('fit').onclick = () => { cover = !cover; save('m100-live-fit', cover ? 'cover' : 'contain'); apply(); };
$('fs').onclick = () => document.documentElement.requestFullscreen?.().catch(() => {});
// 버튼 · 상태는 손을 대면 6초 보였다 사라짐
let hT = 0; const showHud = () => { $('hud').classList.remove('off'); clearTimeout(hT); hT = setTimeout(() => { if (video.srcObject) $('hud').classList.add('off'); }, 6000); };
document.addEventListener('pointerdown', showHud); showHud();
const state = (s) => {
  $('dot').className = 'dot ' + (s === 'connected' ? 'ok' : s === 'lost' ? 'bad' : 'wait');
  $('st').textContent = s === 'connected' ? '실시간 연결됨' : s === 'lost' ? '끊김 · 다시 연결 중' : '연결 중';
  $('wait').hidden = s === 'connected';
  if (s !== 'connected') showHud();
};
liveViewer(KEY, {
  onStream: (st) => { video.srcObject = st; video.play().catch(() => {}); },
  onMeta: (m) => { if (m && m.z) root.setProperty('--z', m.z); },
  onState: state,
  onDebug: (step, detail) => { $('wstep').textContent = step; $('wsub').textContent = detail; $('dbg').textContent = detail; },
}).catch((e) => { $('st').textContent = '연결 실패 · 인터넷 확인'; $('dot').className = 'dot bad'; console.warn(e); });
// 받는 해상도 · 초당 장면 수 표시
let last = { t: 0, f: 0 };
setInterval(() => {
  if (!video.videoWidth) return;
  const q2 = video.getVideoPlaybackQuality?.(), f = q2 ? q2.totalVideoFrames : 0, t = performance.now();
  const fps = last.t ? Math.round((f - last.f) / ((t - last.t) / 1000)) : 0; last = { t, f };
  $('res').textContent = `${video.videoWidth}×${video.videoHeight}` + (fps ? ` · ${fps}fps` : '');
}, 1000);
// 화면 꺼짐 막기
let lock = null; const awake = async () => { try { lock = await navigator.wakeLock?.request('screen'); } catch {} };
awake(); document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') awake(); });
</script>
</body>
</html>
