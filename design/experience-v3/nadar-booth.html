<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>나다르 사진관 · 촬영기</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Freesentation/Freesentation.css">
<style>
/* 옛 카메라 하우징 안의 폰. 관람객은 이 화면을 보지 않는다 — 설치 · 점검하는 사람용. 버튼(블루투스 키) 또는 화면을 누르면 촬영 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;color:#F2EDE2;font-family:Freesentation,sans-serif;overflow:hidden}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
.hud{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.7));font-size:14px;display:flex;justify-content:space-between;gap:12px}
.hud b{color:#E9C77A}
.count{position:fixed;inset:0;display:grid;place-items:center;font-size:30vmin;font-weight:800;color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.6);pointer-events:none}
.shot{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
.shot.go{animation:sh .5s ease-out}
@keyframes sh{0%{opacity:.95}100%{opacity:0}}
</style>
</head>
<body>
<video id="v" playsinline muted autoplay></video>
<div class="count" id="count"></div>
<div class="shot" id="shot"></div>
<div class="hud"><span id="st">카메라를 켜는 중</span><span>방 <b id="room"></b> · 화면이나 버튼(Space · Enter)으로 촬영</span></div>
<script type="module">
// 촬영 → 액자에 3·2·1 → 찍고 → 그 시대 사진관 사진으로(지금은 기기 안 처리 booth/js/nadar.js — AI 변환이 붙으면 여기서 서버로) → 액자로
import { joinRoom, room } from './link.js';
import * as N from '../../booth/js/nadar.js';
const $ = (s) => document.getElementById(s), video = $('v');
$('room').textContent = room();
const link = joinRoom({});
link.ready.then(() => { $('st').textContent = '대기 중 · 액자와 연결됨'; }).catch(() => { $('st').textContent = '액자와 연결되지 않음 · 인터넷 확인'; });
try {
  video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1440 } }, audio: false });
  await video.play();
} catch (e) { $('st').textContent = '카메라를 켜지 못함 · 권한 확인'; }
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
let busy = false;
async function shoot() {
  if (busy || video.readyState < 2) return; busy = true;
  for (const n of [3, 2, 1]) { $('count').textContent = n; link.send('count', { n }); await sleep(1000); }
  $('count').textContent = ''; link.send('count', { n: 0 });
  $('shot').classList.remove('go'); void $('shot').offsetWidth; $('shot').classList.add('go');
  const c = document.createElement('canvas'); c.width = video.videoWidth; c.height = video.videoHeight; c.getContext('2d').drawImage(video, 0, 0);
  $('st').textContent = '사진 만드는 중';
  let card;
  try { const comp = N.cropTo34(c); try { card = N.renderPhoto19(comp, null); } catch { card = N.quickPhoto(comp); } } catch { card = c; }
  const o = document.createElement('canvas'), w = 600; o.width = w; o.height = Math.round(card.height * w / card.width); o.getContext('2d').drawImage(card, 0, 0, o.width, o.height);
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  try { const r = await link.send('photo', { id, img: o.toDataURL('image/jpeg', 0.8) }); $('st').textContent = r === 'ok' ? `액자로 보냄 · ${id}` : '액자로 보내지 못함'; }
  catch { $('st').textContent = '액자로 보내지 못함'; }
  busy = false;
}
document.addEventListener('pointerdown', shoot);
document.addEventListener('keydown', (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); shoot(); } });
</script>
</body>
</html>
