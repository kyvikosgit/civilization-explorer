<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>나다르 사진관 · 촬영기</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Freesentation/Freesentation.css">
<style>
/* 옛 카메라 하우징 안의 폰(퀀텀4, 화면이 뒤 = 주름상자 쪽). 화면은 볼록렌즈로 뒤 틀 반투명 아크릴에 비친다(뷰파인더) — 그래서 평소엔 미리보기만, 글자 · 숫자 없음.
   촬영: 받침 상자 3키 패드(USB, 엔터) 또는 디버그 판의 [촬영] — 11/20 화면을 눌러서는 찍히지 않음(설정하다 잘못 찍히지 않게). 상태 글자는 켤 때 8초 · 문제가 있을 때만 보이고, 주소에 ?debug=1 이면 계속 보임 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;color:#F2EDE2;font-family:Freesentation,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* 화면 = 찍히는 범위 그대로(줌 배율 · 3:4). 남는 곳은 검은 여백 */
.vf{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;background:#000}
.vf video{position:absolute;max-width:none}
.zl{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:44px;font-weight:700;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.7);pointer-events:none;opacity:0;transition:opacity .4s;text-align:center;line-height:1.3}
.zl small{display:block;font-size:16px;font-weight:600}
.zl.on{opacity:1}
.hud{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.7));font-size:14px;display:flex;justify-content:space-between;gap:12px;transition:opacity .6s}
.hud.off{opacity:0}
.hud b{color:#E9C77A}
.lv{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:rgba(0,0,0,.62);font-size:13px;line-height:1.5;color:#F2EDE2;transition:opacity .6s;word-break:keep-all}
.lv.off{opacity:0}.lv b{color:#E9C77A}.lv.ok b{color:#6FD39A}
.shot{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
.shot.go{animation:sh .5s ease-out}
@keyframes sh{0%{opacity:.95}100%{opacity:0}}
/* 11/20 직원용: 왼쪽 위 구석을 3초 누르면 디버그 판(정보 + 버튼). 누르는 동안 구석에 차오르는 고리 */
.hold{position:fixed;left:calc(14px + env(safe-area-inset-left));top:calc(14px + env(safe-area-inset-top));width:44px;height:44px;border-radius:50%;pointer-events:none;opacity:0;transition:opacity .2s;background:conic-gradient(#E9C77A calc(var(--p,0)*1turn),rgba(255,255,255,.18) 0);-webkit-mask:radial-gradient(circle,transparent 15px,#000 16px);mask:radial-gradient(circle,transparent 15px,#000 16px);z-index:20}
.hold.on{opacity:1}
.dbgp{position:fixed;left:12px;right:12px;bottom:calc(64px + env(safe-area-inset-bottom));background:rgba(10,12,11,.88);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.55;z-index:15;display:flex;flex-direction:column;gap:10px}
.dbgp[hidden]{display:none}
.dbgp .info b{color:#E9C77A;font-weight:600}
.dbgp .row{display:flex;gap:8px;flex-wrap:wrap}
.dbgp button{font:600 14px Freesentation,sans-serif;background:rgba(255,255,255,.14);color:#F2EDE2;border:0;border-radius:10px;padding:10px 12px;min-height:44px}
.dbgp button.on{background:#F2EDE2;color:#141210}
</style>
</head>
<body>
<div class="vf" id="vf"><video id="v" playsinline muted autoplay></video></div>
<div class="zl" id="zl"></div>
<div class="lv" id="lv"><b>미리보기</b> 준비 중</div>
<div class="shot" id="shot"></div>
<div class="hold" id="hold"></div>
<div class="dbgp" id="dbgp" hidden><div class="info" id="dbgi"></div><div class="row"><button type="button" class="on" id="dShot">촬영</button><button type="button" id="dZ1">줌 1배로</button><button type="button" id="dCam">카메라 다시 켜기</button><button type="button" id="dRe">새로고침</button><button type="button" id="dX">닫기</button></div></div>
<div class="hud" id="hud"><span id="st">카메라를 켜는 중</span><span>줌 <b id="zm"></b> · 버튼(엔터)으로 촬영</span></div>
<script type="module">
// 촬영 → 액자에 3·2·1 → 찍고 → 액자에 '현상 중' → 서버(Supabase 함수 nadar-photo · Seedream 5.5, 예비 5.0 Flash · 25초 안)가 1870년대 나다르 사진관 사진으로 → 액자로
//   키: 이 기기 주소 ?k=촬영기키 (한 번 열면 이 기기에 기억). 키가 없거나 변환이 안 되면 기기 안 처리(booth/js/nadar.js) 사진을 보낸다
//   OpenRouter 키는 서버에만 — 이 페이지에는 없다
import { joinRoom, room } from './link.js';
import * as N from '../../booth/js/nadar.js';
const $ = (s) => document.getElementById(s), video = $('v');
const KEY = (() => { const q = new URLSearchParams(location.search).get('k'); try { if (q) localStorage.setItem('m100-booth-k', q); return q || localStorage.getItem('m100-booth-k'); } catch { return q; } })();
const link = joinRoom({});
link.ready.then(() => { if (KEY_OK()) status('대기 중 · 액자와 연결됨'); else status('액자와 연결됨 · AI 키 없음(주소에 ?k= 필요 — 지금은 기기 안 처리)', true); }).catch(() => { status('액자와 연결되지 않음 · 인터넷 확인', true); });
// 상태 글자: 뷰파인더에 비치므로 켤 때 8초 · 문제가 있을 때만(?debug=1 이면 계속)
let DEBUG = new URLSearchParams(location.search).has('debug');   // 주소 ?debug=1 또는 왼쪽 위 구석 3초 누르기
let hudT = 0;
function status(t, keep) { $('st').textContent = t; $('hud').classList.remove('off'); clearTimeout(hudT); if (!keep && !DEBUG) hudT = setTimeout(() => $('hud').classList.add('off'), 8000); }
// 줌: 광각 렌즈(상덕 0.45X) 귀퉁이 검은 테를 잘라 내는 배율. 주소 ?zoom=2 (한 번 열면 이 기기에 기억). 카메라가 줌을 지원하면 카메라에서, 아니면 가운데를 잘라서
let ZOOM = (() => { const q = parseFloat(new URLSearchParams(location.search).get('zoom')); try { if (q > 0) localStorage.setItem('m100-booth-zoom', String(q)); return q > 0 ? q : parseFloat(localStorage.getItem('m100-booth-zoom')) || 1; } catch { return q > 0 ? q : 1; } })();
let cropZ = 1;   // 카메라 줌이 안 되면(또는 카메라 최대를 넘으면) 사진에서 잘라 낼 배율
let camZoom = null;   // 카메라가 알려 준 줌 범위 {min,max,step} — 없으면 잘라서만
let live = null;   // 태블릿 실시간 미리보기 연결(live.js)
// 줌 걸기: 카메라가 줌을 지원하면 카메라에서(최대를 넘는 만큼만 잘라서), 아니면 가운데를 잘라서. 사진도 같은 배율
async function applyZoom() {
  const tr = video.srcObject?.getVideoTracks()[0]; if (!tr) return;
  const cap = tr.getCapabilities?.() || {}; camZoom = cap.zoom && cap.zoom.max > cap.zoom.min ? { min: cap.zoom.min, max: cap.zoom.max, step: cap.zoom.step || 0.1 } : null;
  cropZ = ZOOM;
  if (camZoom) {
    const z = Math.min(Math.max(ZOOM, camZoom.min), camZoom.max);
    try { await tr.applyConstraints({ advanced: [{ zoom: z }] }); cropZ = Math.max(1, ZOOM / z); } catch {}
  }
  fitFrame();
  $('zm').textContent = `${ZOOM.toFixed(1)}배`;
  try { live?.meta(); } catch {}
}
// 화면에 찍히는 범위(줌 · 3:4 가운데)만 꼭 맞게 — shoot() 의 자르기와 같은 계산
function fitFrame() {
  const iw = video.videoWidth, ih = video.videoHeight, vf = $('vf'); if (!iw) return;
  let cw = iw / cropZ, ch = ih / cropZ; if (cw / ch > 3 / 4) cw = ch * 3 / 4; else ch = cw * 4 / 3;
  const W = innerWidth, H = innerHeight; let fw = W, fh = W * 4 / 3; if (fh > H) { fh = H; fw = H * 3 / 4; }
  const s = fw / cw; vf.style.width = fw + 'px'; vf.style.height = fh + 'px';
  Object.assign(video.style, { width: iw * s + 'px', height: ih * s + 'px', left: (fw - iw * s) / 2 + 'px', top: (fh - ih * s) / 2 + 'px' });
}
addEventListener('resize', fitFrame); video.addEventListener('loadedmetadata', fitFrame); video.addEventListener('resize', fitFrame);
// 줌 바꾸기 — 이 기기에 기억(폰 화면 두 손가락 벌리기 · 오므리기)
async function setZoom(z) {
  ZOOM = Math.round(Math.min(Math.max(+z || 1, 1), 10) * 10) / 10;
  try { localStorage.setItem('m100-booth-zoom', String(ZOOM)); } catch {}
  await applyZoom();
}
async function startCam() {
  try {
    video.srcObject?.getTracks().forEach((t) => t.stop());
    const st = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 4032 }, height: { ideal: 3024 }, aspectRatio: { ideal: 4 / 3 } }, audio: false });   // 누르는 순간 이 영상 화면을 그대로 씀 — 가능한 최대 해상도
    video.srcObject = st; await video.play();
    const tr = st.getVideoTracks()[0];
    tr.addEventListener('ended', () => { status('카메라가 꺼짐 · 다시 켜는 중', true); setTimeout(startCam, 1500); });
    try { live?.restream(); } catch {}
    await applyZoom();
    return true;
  } catch (e) { status('카메라를 켜지 못함 · 권한 확인', true); setTimeout(startCam, 4000); return false; }
}
await startCam();
// 태블릿 실시간 미리보기(nadar-live.html) — 영상은 기기끼리 직접, 서버는 연결 신호만
// 위쪽 줄: 태블릿 연결 상황(연결되면 10초 뒤 숨김, ?debug=1 이면 계속)
let lvT = 0;
const lvSay = (txt, ok) => {
  const el = $('lv'); el.innerHTML = '<b>태블릿</b> · ' + txt.replace(/</g, '&lt;'); el.classList.toggle('ok', !!ok);
  if (ok && !DEBUG) { if (!lvT) lvT = setTimeout(() => el.classList.add('off'), 10000); } else { clearTimeout(lvT); lvT = 0; el.classList.remove('off'); }
};
import('./live.js').then((m) => m.liveSender(() => video.srcObject, KEY, () => ({ z: cropZ, zoom: ZOOM, cap: camZoom }), lvSay)).then((l) => { live = l; }).catch((e) => { console.warn('[live]', e); lvSay('오류: ' + e.message, false); });
// 화면 꺼짐 막기 — 화면이 다시 보이면 다시 잡는다(카메라도 다시)
let lock = null;
async function keepAwake() { try { lock = await navigator.wakeLock?.request('screen'); } catch {} }
keepAwake();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { keepAwake(); if (!video.srcObject?.active) startCam(); } });
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
let lastModel = '';
const AI_LIMIT = 28000;   // 서버가 25초 안에 AI 사진 저장 · 액자 전달까지 끝냄 — 넘으면 기기 사진   // 버튼 → 액자 사진까지 30초 안(3초 노출 + AI 26초 + 보내기)
const AI = 'https://bttjtkhfyzapcsqocick.supabase.co/functions/v1/nadar-photo';
if (!KEY) status('AI 키 없음 · 주소에 ?k= 필요(지금은 기기 안 처리)', true);
function KEY_OK() { return !!KEY; }
const jpeg = (cv, w, q) => { const o = document.createElement('canvas'); o.width = w; o.height = Math.round(cv.height * w / cv.width); o.getContext('2d').drawImage(cv, 0, 0, o.width, o.height); return o.toDataURL('image/jpeg', q); };
// 서버 변환 — 70초 안에 안 오면 포기
// 서버로 한 번 올리면 끝 — 서버가 AI 사진을 저장소에 올리고 액자에 바로 띄운다(폰은 사진을 다시 받지 않음)
async function aiPhoto(comp, id) {
  if (!KEY) throw new Error('no key');
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), AI_LIMIT);
  try {
    const r = await fetch(AI, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key: KEY, room: room(), id, img: jpeg(comp, Math.min(1200, comp.width), 0.9) }), signal: ctl.signal });
    const d = await r.json(); if (!r.ok || !d.url) throw new Error(d.error || r.status);
    lastModel = (d.model || '') + (d.ms ? ` ${Math.round(d.ms / 1000)}초` : '');   // 어느 모델이 왔는지(5.5 / 예비 Flash)
    return d;
  } finally { clearTimeout(t); }
}
// AI 가 안 되면 기기 사진을 서버에 올려 같은 길로 액자에(그것도 안 되면 예전처럼 폰이 직접)
async function localPhoto(card, id) {
  try {
    const r = await fetch(AI, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key: KEY, room: room(), id, local: true, img: jpeg(card, card.width, 0.9) }) });
    const d = await r.json(); if (r.ok && d.url) return 'ok';
  } catch {}
  return link.sendBig('photo', { id, img: jpeg(card, Math.min(card.width, 1000), 0.9) }, 'img');
}
// 누르는 순간의 카메라 영상 화면(지연 없음). 원본 사진 촬영(takePhoto)은 초점 · 노출을 다시 잡느라 0.5–1초 늦어서 쓰지 않음
function grab() { const c = document.createElement('canvas'); c.width = video.videoWidth; c.height = video.videoHeight; c.getContext('2d').drawImage(video, 0, 0); return c; }
let busy = false;
async function shoot() {
  if (busy || video.readyState < 2) return; busy = true;
  // 11/13: 누르는 순간 바로 찍음(3초 노출 연출 없앰) — 찍고 나서 폰 번쩍 · 액자 마그네슘 섬광
  const src = grab();
  link.send('count', { n: 0 });
  $('shot').classList.remove('go'); void $('shot').offsetWidth; $('shot').classList.add('go');
  // 사람 위치로는 자르지 않는다(폰을 세우면 화면이 3:4 — 구도는 AI 가 허리 위로 다시 잡음)
  //   자르는 건 광각 렌즈 귀퉁이(가운데 기준 · 카메라 줌이 안 될 때만)와, 원본이 3:4 가 아닐 때 가운데 맞춤뿐
  const iw = src.width, ih = src.height, zw = iw / cropZ, zh = ih / cropZ;
  let cw = zw, chh = zh; if (cw / chh > 3 / 4) cw = chh * 3 / 4; else chh = cw * 4 / 3;
  const c = document.createElement('canvas'); c.width = Math.round(cw); c.height = Math.round(chh);
  c.getContext('2d').drawImage(src, (iw - cw) / 2, (ih - chh) / 2, cw, chh, 0, 0, c.width, c.height);
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  const comp = c;
  if (DEBUG) console.log('[shot]', iw + '×' + ih, '→', c.width + '×' + c.height);
  // 진행 신호: 1초마다 액자로(단계 · 경과 초). 신호가 끊기면 액자가 '응답 없음'을 띄운다
  const t0 = performance.now(); let stage = KEY ? 'ai' : 'local';
  const sec = () => Math.round((performance.now() - t0) / 1000);
  const beat = () => { link.send('prog', { id, stage, t: sec() }).catch(() => {}); if (DEBUG) status(`사진 현상 중 · ${stage} · ${sec()}초`, true); };
  beat(); const hb = setInterval(beat, 1000);
  let how = 'AI', res = 'ok';
  try { await aiPhoto(comp, id); }
  catch (e) {
    console.warn('[ai]', e); how = '기기'; stage = 'local'; beat();
    let w = comp, card; try { w = N.cropTo34(comp); } catch {}
    try { card = N.renderPhoto19(w, null); } catch { try { card = N.quickPhoto(w); } catch { card = w; } }
    try { res = KEY ? await localPhoto(card, id) : await link.sendBig('photo', { id, img: jpeg(card, Math.min(card.width, 1000), 0.9) }, 'img'); } catch { res = 'error'; }
  }
  console.log('[time]', how, lastModel, sec() + '초', id);
  if (res === 'ok') { if (DEBUG || how !== 'AI') status(`액자로 보냄(${how}${how === 'AI' ? ' ' + lastModel : ''}) · ${sec()}초 · ${id}`); } else status('액자로 보내지 못함 · 인터넷 확인');
  clearInterval(hb); try { localStorage.setItem('m100-booth-last', JSON.stringify({ id, how, sec: sec(), at: new Date().toISOString() })); } catch {}
  busy = false;
}
// 화면 손짓: 두 손가락 벌리기 · 오므리기 = 줌(1~10배, 이 기기에 기억). 11/20: 한 손가락 누름으로는 찍지 않음 — 촬영은 3키 패드(엔터)나 디버그 판 [촬영]만
const pts = new Map(); let pinch = null, zBusy = false, zWant = 0, zlT = 0;
const zLabel = () => { const el = $('zl'); el.innerHTML = ZOOM.toFixed(1) + '배<small>' + (camZoom ? (cropZ > 1 ? '카메라 최대 + 잘라서' : '카메라 줌') : '화면을 잘라서') + '</small>'; el.classList.add('on'); clearTimeout(zlT); zlT = setTimeout(() => el.classList.remove('off', 'on'), 1500); };
async function zoomTo(z) { zWant = z; if (zBusy) return; zBusy = true; while (zWant) { const w = zWant; zWant = 0; await setZoom(w); zLabel(); } zBusy = false; }
const dist = () => { const [a, b] = [...pts.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
// 왼쪽 위 구석(100px)을 3초 누르면 디버그 판 켜기/끄기 — 구석은 촬영하지 않는다(관람객은 3키 패드로 찍음)
const CORNER = (e) => e.clientX < 100 && e.clientY < 100;
let holdT = 0, holdA = 0;
const holdStop = () => { clearTimeout(holdT); cancelAnimationFrame(holdA); holdT = 0; $('hold').classList.remove('on'); $('hold').style.setProperty('--p', 0); };
function holdStart() {
  holdStop(); const t0 = performance.now();
  const step = () => { const p = (performance.now() - t0) / 3000; if (p > 0.15) $('hold').classList.add('on'); $('hold').style.setProperty('--p', Math.min(1, p)); holdA = requestAnimationFrame(step); };
  holdA = requestAnimationFrame(step);
  holdT = setTimeout(() => { holdStop(); setDebug(!DEBUG); navigator.vibrate?.(30); }, 3000);
}
function dbgInfo() {
  if (!DEBUG) return;
  let last = ''; try { const l = JSON.parse(localStorage.getItem('m100-booth-last') || 'null'); if (l) last = `${new Date(l.at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })} · ${l.how === 'AI' ? 'AI 사진' : '기기 사진(AI 실패)'} · ${l.sec}초 걸림`; } catch {}
  const n = live?.count?.() || 0;
  $('dbgi').innerHTML = [`태블릿 <b>${n ? n + '대 연결됨' : '연결 안 됨'}</b> · 연결 짝 <b>${live?.tag || '-'}</b>(태블릿 관리자 화면의 네 글자와 같아야 함)`,
    KEY ? 'AI 사진 변환 준비됨' : '<b>AI 사진 변환 안 됨</b> — 처음 받은 주소(QR)로 다시 열어 주세요',
    `줌 <b>${ZOOM.toFixed(1)}배</b>` + (cropZ > 1 ? ' · 화면을 잘라서 키우는 중(많이 키우면 사진이 흐려짐)' : ''),
    `마지막 촬영 ${last || '-'}`].join('<br>');
}
setInterval(dbgInfo, 1000);
function setDebug(on) {
  DEBUG = on; $('dbgp').hidden = !on;
  if (on) { clearTimeout(hudT); clearTimeout(lvT); lvT = 0; $('hud').classList.remove('off'); $('lv').classList.remove('off'); dbgInfo(); }
  else { $('hud').classList.add('off'); if ($('lv').classList.contains('ok')) $('lv').classList.add('off'); }
}
$('dShot').onclick = () => shoot();
$('dZ1').onclick = async () => { await setZoom(1); zLabel(); dbgInfo(); };
$('dCam').onclick = () => { startCam(); };
$('dRe').onclick = () => location.reload();
$('dX').onclick = () => setDebug(false);
if (DEBUG) setDebug(true);
document.addEventListener('pointerdown', (e) => {
  if (e.target.closest?.('.dbgp')) return;   // 디버그 판 단추 = 촬영 아님
  if (CORNER(e)) { holdStart(); return; }
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pts.size === 2) pinch = { d0: dist(), z0: ZOOM };
});
document.addEventListener('pointermove', (e) => {
  if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pts.size >= 2 && pinch.d0 > 0) zoomTo(Math.round(Math.min(Math.max(pinch.z0 * dist() / pinch.d0, 1), 10) * 10) / 10);
});
const lift = (e) => { holdStop(); pts.delete(e.pointerId); if (!pts.size) pinch = null; else if (pinch && pts.size < 2) pinch = { ...pinch, d0: 0 }; };
document.addEventListener('pointerup', lift); document.addEventListener('pointercancel', lift);
document.addEventListener('keydown', (e) => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); shoot(); } });   // 3키 패드는 엔터 — 누르고 있어도 한 번만
document.addEventListener('pointerdown', () => { document.documentElement.requestFullscreen?.().catch(() => {}); keepAwake(); }, { once: true });
</script>
