<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#16110c">
<title>나다르 사진관 · 액자 화면</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Freesentation/Freesentation.css">
<style>
/* 벽의 액자 안에 다는 화면(아이패드 · TV). 평소엔 벽의 다른 사진들처럼 나다르 사진관의 모네 초상, 관람객이 보내면 그 사진으로 천천히 바뀐다 */
:root{color-scheme:dark}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#16110c;overflow:hidden;cursor:none}
.stage{position:fixed;inset:0;display:grid;place-items:center;padding:3vmin}
.stage img{position:absolute;max-width:94vw;max-height:94vh;object-fit:contain;opacity:0;transition:opacity 1.6s ease;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.stage img.on{opacity:1}
.hint{position:fixed;left:0;right:0;bottom:2vh;text-align:center;font-family:Freesentation,sans-serif;font-size:13px;color:rgba(242,237,226,.45);transition:opacity .6s}
.hint.off{opacity:0}
.dot{position:fixed;right:10px;bottom:10px;width:8px;height:8px;border-radius:50%;background:#C8553D}
.count{position:fixed;inset:0;display:grid;place-items:center;font-family:Freesentation,sans-serif;font-size:34vmin;font-weight:800;color:#F2EDE2;text-shadow:0 6px 40px rgba(0,0,0,.6);opacity:0;transition:opacity .2s;pointer-events:none}
.count.on{opacity:1}
.withqr .stage img{max-height:86vh;transform:translateY(-2vh);transition:opacity 1.6s ease,transform .8s ease}
.qr{position:fixed;right:2.4vmin;bottom:2.4vmin;display:flex;align-items:center;gap:12px;padding:12px 14px 12px 12px;border-radius:12px;background:#F7F0DF;color:#2A2119;font-family:Freesentation,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.45);opacity:0;transform:translateY(8px);transition:opacity .6s,transform .6s}
.qr.on{opacity:1;transform:none}
.qr canvas{width:12vmin;height:12vmin;max-width:110px;max-height:110px;min-width:84px;min-height:84px;image-rendering:pixelated}
.qr b{display:block;font-size:max(12px,1.5vmin);line-height:1.35}
.qr small{display:block;margin-top:3px;font-size:max(10px,1.15vmin);opacity:.7}
.dot.on{background:#3E8A6B;opacity:0;transition:opacity .6s}   /* 연결되면 숨긴다 — 빨간 점은 끊겼을 때만 */
/* 현상 중 — 찍은 뒤 사진이 올 때까지(Seedream 5 약 45초). 액자 속 사진이 암실처럼 어두워지고 가운데 문구 */
.dev{position:fixed;inset:0;display:grid;place-items:center;background:rgba(14,10,7,.72);opacity:0;transition:opacity .8s;pointer-events:none;font-family:Freesentation,sans-serif;color:#F2EDE2;text-align:center}
.dev.on{opacity:1}
.dev b{display:block;font-size:max(18px,3.4vmin);font-weight:700;letter-spacing:.02em}
.dev small{display:block;margin-top:1.2vmin;font-size:max(12px,2vmin);opacity:.6}
.dev i{display:block;width:12vmin;height:2px;margin:3vmin auto 0;background:linear-gradient(90deg,transparent,#E9C77A,transparent);background-size:200% 100%;animation:dv 1.6s linear infinite}
@keyframes dv{from{background-position:100% 0}to{background-position:-100% 0}}
</style>
</head>
<body>
<div class="stage"><img id="a" alt=""><img id="b" alt=""></div>
<p class="hint" id="hint">화면을 한 번 누르면 전체 화면으로 바뀝니다</p>
<i class="dot" id="dot" title="연결 상태"></i>
<div class="count" id="count"></div>
<div class="dev" id="dev"><div><b>사진을 현상하고 있습니다</b><small>나다르 사진관의 유리판에서 인화지로</small><i></i></div></div>
<div class="qr" id="qr"><canvas id="qrc"></canvas><span><b>앱으로 QR을 찍어<br>사진을 받으세요</b><small>폰 카메라로 찍어도 받을 수 있습니다</small></span></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script type="module">
import { joinRoom } from './link.js';
setTimeout(() => document.getElementById('hint').classList.add('off'), 6000);   // 설치할 때만 보이면 된다
const IDLE = 'img/nadar_monet.jpg';          // 아틀리에 나다르가 찍은 모네 초상(프랑스 국립도서관) — 평소의 액자
const HOLD = 10000;                          // 11/03 미팅: 관람객 사진은 약 10초 걸어 두고 평소로 — 그동안 QR 로 받는다(받는 건 최근 12장까지 그 뒤에도 됨)
const KEEP = new Map();                      // 최근 사진 — QR 로 찾아오면 여기서 보낸다(서버에 저장하지 않음)
const roomName = new URLSearchParams(location.search).get('room') || 'c4';
function drawQR(id) {
  const url = new URL(`photo.html?room=${encodeURIComponent(roomName)}&id=${id}`, location.href).href;
  const q = qrcode(0, 'M'); q.addData(url); q.make();
  const n = q.getModuleCount(), cv = document.getElementById('qrc'), k = 6, pad = 2; cv.width = cv.height = (n + pad * 2) * k;
  const g = cv.getContext('2d'); g.fillStyle = '#F7F0DF'; g.fillRect(0, 0, cv.width, cv.height); g.fillStyle = '#2A2119';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) g.fillRect((c + pad) * k, (r + pad) * k, k, k);
}
const imgs = [document.getElementById('a'), document.getElementById('b')];
let front = 0, back = 0, devT = 0;
function showSrc(src) {
  const next = imgs[1 - front];
  next.onload = () => { next.classList.add('on'); imgs[front].classList.remove('on'); front = 1 - front; };
  next.src = src;
}
showSrc(IDLE);
const link = joinRoom({
  photo: (p) => {
    if (!p?.img) return;
    clearTimeout(devT); document.getElementById('dev').classList.remove('on');
    showSrc(p.img);
    KEEP.set(p.id, p.img); if (KEEP.size > 12) KEEP.delete(KEEP.keys().next().value);
    drawQR(p.id); document.getElementById('qr').classList.add('on'); document.body.classList.add('withqr');
    link.send('ack', { id: p.id });
    clearTimeout(back); back = setTimeout(() => { showSrc(IDLE); document.getElementById('qr').classList.remove('on'); document.body.classList.remove('withqr'); }, HOLD);
  },
  dev: () => { document.getElementById('dev').classList.add('on'); clearTimeout(devT); devT = setTimeout(() => document.getElementById('dev').classList.remove('on'), 90000); },
  count: (p) => { const c = document.getElementById('count'); c.textContent = p?.n || ''; c.classList.toggle('on', !!p?.n); },
  get: (p) => { const img = KEEP.get(p?.id); if (img) link.send('img', { id: p.id, img }); else link.send('img', { id: p?.id, missing: true }); },
});
link.ready.then(() => document.getElementById('dot').classList.add('on')).catch(() => {});
document.body.addEventListener('click', async () => {
  try { await document.documentElement.requestFullscreen?.(); } catch {}
  try { await navigator.wakeLock?.request('screen'); } catch {}
  document.getElementById('hint').classList.add('off');
});
</script>
</body>
</html>
