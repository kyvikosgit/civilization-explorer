<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>나다르 사진관 · 액자 화면</title>
<base href="/design/experience-v3/">
<link rel="icon" href="data:,">
<style>
/* 11/20: 세워 단 TV(화면 회전 메뉴 없음)용 — 가로로 나오는 화면 안에 세로 액자 화면(frame.html)을 90° 돌려 꽉 채운다.
   frame.html 은 iframe 안에서 세로 화면(예: 1080×1920)으로 그대로 그려지므로 글자 · 사진 크기가 세로 기준으로 맞는다 */
html,body{margin:0;height:100%;background:#16110c;overflow:hidden}   /* 커서는 안쪽(frame.html)이 3초 멈추면 숨김 */
iframe{position:fixed;left:50%;top:50%;width:100vh;height:100vw;border:0;transform:translate(-50%,-50%) rotate(var(--r,90deg));background:#16110c}
</style>
</head>
<body>
<iframe id="f" allow="fullscreen; screen-wake-lock"></iframe>
<script>
const q = new URLSearchParams(location.search);
const r = q.get('r') === '270' ? 270 : 90;   // 90 = 시계 방향, 270 = 반시계 방향(TV를 반대로 세웠을 때)
document.documentElement.style.setProperty('--r', r + 'deg');
q.delete('r'); q.set('in', '1');
document.getElementById('f').src = 'frame.html?' + q.toString();
// 전체 화면 · 화면 꺼짐 방지: 안쪽 화면을 누르면 바깥(이 페이지)이 처리 — 안쪽만 전체 화면이 되면 회전이 풀린다
addEventListener('message', async (e) => {
  if (e.origin !== location.origin || e.data !== 'm100-frame-fs') return;
  try { await document.documentElement.requestFullscreen?.(); } catch {}
  try { await navigator.wakeLock?.request('screen'); } catch {}
});
</script>
</body>
</html>
