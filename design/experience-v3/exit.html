<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<title>출구 · 기념품 받기</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Freesentation/Freesentation.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy.css">
<link rel="stylesheet" href="v3.css">
<style>
/* 11/18 출구 — 미션 완료 화면(done.js)과 같은 판: 흰 바탕 · 가운데 · 금장식 머리 · 나의 수집품 칸 · 금장식 맺음줄 */
body{max-width:none}
.v3-done.exit{position:static;min-height:100dvh;opacity:1}
.v3-done.exit .d-scroll{overflow:visible;padding-bottom:calc(36px + env(safe-area-inset-bottom))}
.v3-done.exit .d-lead{margin:12px auto 0;max-width:320px;text-align:center;font-size:15px;line-height:1.6;color:var(--d-sub)}
.v3-done.exit .d-col{margin-top:22px}
.v3-done.exit .d-colt{font-size:15px}
.v3-done.exit .d-slots span{width:52px;height:52px}
.v3-done.exit .d-slots span.contain img{object-fit:contain;padding:4px}
.v3-done.exit .goods{margin:18px 0 0;padding:20px 18px;border:1px solid var(--d-line);border-radius:14px;background:var(--d-panel);text-align:center}
.v3-done.exit .goods .big{font-family:Paperlogy,Freesentation,sans-serif;font-weight:800;font-size:28px;color:var(--d-pt)}
.v3-done.exit .goods p{margin-top:6px;color:var(--d-sub);font-size:15px}
.v3-done.exit .goods.got .big{color:#3E8A6B}
.v3-done.exit .goods .btn{margin-top:14px;height:52px;border-radius:12px;background:var(--d-ink);color:#fff;font-weight:800;font-size:16px}
.v3-done.exit .missing{margin:18px 0 0;padding:0;font-size:15px}
.v3-done.exit .missing li{list-style:none;padding:12px 2px;border-bottom:1px solid var(--d-line);display:flex;justify-content:space-between;gap:12px}
.v3-done.exit .missing li span{color:var(--d-sub);font-size:14px;text-align:right}
.v3-done.exit .missing li.ok span{color:#3E8A6B}
.v3-done.exit .d-note{opacity:1;transform:none;margin-top:30px}
</style>
</head>
<body>
<main class="v3-done exit on read" id="page"></main>
<script type="module">
// 앱 웹 버전(iframe) 안이면 앱의 완주 엠블럼 화면으로(11/06 출구 · 엠블럼 합침)
if (window.parent !== window && !window.ReactNativeWebView) { try { window.parent.postMessage({ m100: 'emblem' }, '*'); } catch {} }
// 출구 — 다섯 가지를 모두 모았으면 직원에게 이 화면을 보여 준다. 직원이 단추를 길게 누르면 '수령 완료'(이 폰에서 한 번만)
import { COLLECT_IDS, findTask, COMPLETE_MESSAGE } from './data.js';
import { store } from './store.js';
import { style } from './done.js';
style();
const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const page = document.getElementById('page');
const fmt = (t) => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
const BACK = '<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>';
function render() {
  const got = COLLECT_IDS.filter((id) => store.saved(id)), all = got.length === COLLECT_IDS.length, red = store.redeemed();
  let h = `<div class="d-bar"><a href="index.html" aria-label="체험 목록으로">${BACK}</a><div class="d-loc">출구</div><span></span></div><div class="d-scroll"><div class="d-in">`;
  h += `<p class="d-cap">기념품 받기</p>`;
  if (all) {
    h += red
      ? `<div class="goods got"><div class="big">수령 완료</div><p>${fmt(red)} · 이 폰으로는 한 번만 받을 수 있습니다</p></div>`
      : `<div class="goods"><div class="big">${COLLECT_IDS.length} / ${COLLECT_IDS.length}</div><p>직원에게 이 화면을 보여 주세요</p>
          <button class="btn hold" id="hold"><i></i><span>직원 확인 · 길게 누르기</span></button></div>`;
  } else {
    h += `<p class="d-lead">다섯 가지를 모두 모으면 출구에서 기념품을 드립니다.</p>`;
  }
  // 나의 수집품 — 결과 화면 · 목록과 같은 칸
  h += `<div class="d-col"><p class="d-colt">나의 수집품 <b>${got.length}</b> / ${COLLECT_IDS.length}</p><div class="d-slots">${COLLECT_IDS.map((id) => { const it = findTask(id).task.item; const on = store.saved(id);
    return `<span class="${on ? 'on' : ''}${it.contain ? ' contain' : ''}">${on ? `<img src="${esc(it.img)}" alt="">` : ''}</span>`; }).join('')}</div></div>`;
  h += `<ul class="missing">${COLLECT_IDS.map((id) => { const { zone, task } = findTask(id); const ok = store.saved(id);
    return `<li class="${ok ? 'ok' : ''}">${esc(task.item.name)}<span>${ok ? '모음' : esc(zone.loc.replace('4F · ', ''))}</span></li>`; }).join('')}</ul>`;
  if (all) h += `<p class="d-note">${esc(COMPLETE_MESSAGE)}</p>`;
  h += `</div></div>`;
  page.innerHTML = h;
  const b = document.getElementById('hold');
  if (b) {
    let t = 0;
    const down = (e) => { e.preventDefault(); b.classList.add('ing'); t = setTimeout(() => { store.redeem(); navigator.vibrate?.([20, 40, 20]); render(); }, 1600); };
    const up = () => { clearTimeout(t); b.classList.remove('ing'); };
    b.addEventListener('pointerdown', down); ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => b.addEventListener(ev, up));
    b.addEventListener('contextmenu', (e) => e.preventDefault());
  }
}
render();
</script>
</body>
</html>
