<script>
(function () {
  var q = new URLSearchParams(location.search), ag = [];
  try { ag = JSON.parse(sessionStorage.getItem('m100again') || '[]'); } catch (e) {}
  if (q.get('again')) ag = ag.concat(q.get('again').split(','));
  window.__noXR = q.get('done') === '1' && ag.indexOf('flyer') < 0;
  // 11/28 정답 그림을 골라 떠오른 채로 새로 열림(lift=1) — 첫 화면부터 흰 바탕 + 가운데 그 그림(엔진을 끄려고 새로 연 페이지에서 끊김 없이 이어 감, done.js liftRect 와 같은 자리)
  window.__lift = q.get('lift') === '1' && q.get('done') === '1';
  if (window.__lift) document.write('<style>html,body{background:#fff!important}.start,.top,.hint{display:none!important}</style><div id="lift0" style="position:fixed;inset:0;z-index:9400;background:#fff"><img src="../img/lift_flyer.webp" alt="" style="position:absolute;object-fit:contain;filter:drop-shadow(0 14px 22px rgba(40,28,16,.28));' + (function () { var W = innerWidth, H = innerHeight, a = 538 / 667, w = Math.min(W * 0.72, 330), h = w / a; if (h > H * 0.42) { h = H * 0.42; w = h * a; } return 'left:' + (W - w) / 2 + 'px;top:' + (H * 0.42 - h / 2) + 'px;width:' + w + 'px;height:' + h + 'px'; })() + '"></div>');
  if (!window.__noXR) document.write('<script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1.0.0/dist/xrextras.js" crossorigin="anonymous"><\/script><script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1.0.0/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"><\/script>');
})();
</script>

카메라로 비춰 보세요</span></div>

<script type="module">
import { ZONES } from '../data.js';
import { store } from '../store.js';
import { collect, showComplete, liftToCard } from '../done.js';

const $ = (id) => document.getElementById(id);
const T = (s) => (window.M100_T ? window.M100_T(s) : s);
const task = ZONES.find((z) => z.id === 'society').tasks.find((t) => t.id === 'flyer');
const TG = task.targets;                                     // f1 하나(현장 실물 전단지)
const WIN = 0;
const CHORD = (2 * 300 * Math.sin(300 / 600)) / 300;   // 현/호 = 2R·sin(θ/2)/(Rθ), R = 300mm, 호 300mm → 0.959
const DBG = new URLSearchParams(location.search).has('debug') ? {} : null;
const WIN_W = { title: '환영: 14세기의 전설', artist: '뤽 올리비에 메르송', year: '1872' };   // salon.js WORKS 와 같은 값(완료 화면 제목)
// 인식한 3:4(가운데) → 그림 전체. 세로 그림 = 위아래로 1400/1319, 가로(03) = 돌린 타깃이라 긴 변으로
const SIZE = [[999, 1240]], CROP = 1240;   // 전단지 전체 999×1240 · 인식 3:4 = 930×1240(높이 전체)
const ROTATED = [false];

function finish() {
  const t = task;
  const [name, , ...rest] = String(t.successBody || '').split('\n');   // society-ar.js showEnd 와 같은 완료 화면
  return showComplete('society', { item: t.item, title: name, body: rest.join('\n'), note: t.note });
  $('top').style.display = 'none'; $('hint').hidden = true;
}
// 이미 맞힌 체험(앱 수집 목록 · 이 폰 기록) = 카메라 없이 바로 완료 화면
if (window.__lift) {   // 11/28 골라서 떠오른 그림이 가운데에 떠 있는 채로 열림 → 완료 화면 카드 속으로
  $('start').style.display = 'none'; $('top').style.display = 'none';
  const l0 = $('lift0');
  liftToCard('flyer', { lifted: true, complete: () => { l0?.remove(); return finish(); } });
  history.replaceState(null, '', location.pathname + '?' + (() => { const q = new URLSearchParams(location.search); q.delete('lift'); return q.toString(); })());
} else if (store.saved(task.id)) { $('start').style.display = 'none'; finish(); }
else boot();

// 닫기: 앱은 체험 화면을 닫고, 웹은 뒤로
$('back').addEventListener('click', () => {
  if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'close' }));
  else if (history.length > 1) history.back(); else location.href = '../society.html';
});

// ── 정답 오라 — salon.js AURA 셰이더 그대로(액자 둘레를 따라 일렁이며 흐르는 금빛). 단위도 같게: 그림 긴 변 = 1, 액자 테 M = 0.07
// 11/28 원통형(모리스 칼럼 지름 600mm · 전단지 가로 300mm): 엔진이 알려 주는 원통 조각(반지름 · 높이 · 호) 위에 같은 오라를 휘어서 — 기둥 곡면 밖으로 넘치지 않게
function cylAura(d) {
  const r = d.radiusTop || d.geometry?.radiusTop, h = d.height || d.geometry?.height, al = (d.arcLengthRadians ?? d.geometry?.arcLengthRadians) * 999 / 930, a0 = -al / 2;   // 인식은 가운데 3:4(가로 930/999) — 오라는 전단지 전체 폭에   // XRExtras 공식: 정면(+z) 가운데로 대칭(엔진 arcStartRadians 는 안 씀)
  if (!(r > 0 && h > 0 && al > 0)) return null;
  const P = h * 0.3, pa = P / r;   // 번짐 폭(세로 12%) — 호 방향은 각도로
  const geo = new THREE.CylinderGeometry(r, r, h + 2 * P, 48, 1, true, a0 - pa, al + 2 * pa);
  const m = auraMesh(1, 1); m.geometry.dispose(); m.geometry = geo; m.material.side = THREE.DoubleSide;
  const U = m.material.uniforms; U.hs.value.set(r * al / 2 / h, 0.5); U.size.value.set(r * (al + 2 * pa) / h, (h + 2 * P) / h);   // 세로 = 1 로 맞춘 단위(평면 오라와 같은 번짐 폭)
  return m;
}
let cyl = null;
function auraMesh(pw, ph) {
  /* 종이 전단지 = 액자 테 없이 · 가까이서 보므로 번짐 폭을 좁게 */ const M = 0.015, P = 0.18, ow = pw + 2 * M, oh = ph + 2 * M, w = ow + 2 * P, h = oh + 2 * P;
  const mat = new THREE.ShaderMaterial({
    uniforms: { t: { value: 0 }, op: { value: 0 }, hs: { value: new THREE.Vector2(ow / 2, oh / 2) }, size: { value: new THREE.Vector2(w, h) } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: `uniform float t, op; uniform vec2 hs, size; varying vec2 vUv;
      float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float noise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y); }
      float fbm(vec2 p){ float v = 0.0, a = 0.5; for (int k = 0; k < 3; k++) { v += a * noise(p); p *= 2.0; a *= 0.5; } return v; }
      void main(){
        vec2 p = (vUv - 0.5) * size;
        float r = 0.06; vec2 q = abs(p) - hs + r; float d = length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
        if (d < -0.02) discard;
        float ang = atan(p.y, p.x);
        float n = fbm(vec2(ang * 2.2 + t * 0.35, d * 5.0 - t * 0.9));
        float n2 = fbm(vec2(-ang * 3.1 + t * 0.22, d * 9.0 - t * 1.4));
        float core = exp(-max(d, 0.0) * 12.0);
        float haze = exp(-max(d, 0.0) * 4.5) * (0.35 + 0.65 * smoothstep(0.3, 0.85, n * 0.7 + n2 * 0.5)) * (1.0 - smoothstep(0.22, 0.3, d));
        float a = clamp(core * 0.95 + haze * 0.7, 0.0, 1.0) * op * 0.8;   /* 11/28 가까이서 보는 전단지라 살롱의 절반 밝기 */
        vec3 col = mix(vec3(1.0, 0.86, 0.55), vec3(1.0, 0.98, 0.9), core);
        gl_FragColor = vec4(col * a, a);
      }`,
    transparent: true, depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending, toneMapped: false,
  });
  return new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
}

const YEAR = ['1873', '1872', '1872', '1873', '1873'];   // salon.js WORKS 와 같은 값
let aura = null, auraG = null, winT = 0, ended = false, lastWrong = -1, wrongAt = 0, liftT = 0, xs = null, PW = 1, PH = 1, winSeen = 0, auraK = 0, probe = null, probeG = null, probeT = 0, probeI = -1, probeSeen = 0;
