<!-- 11/27 살롱 체험 = 다시 현장 스캔(사용자 지시): 벽의 후보작 다섯 점 중 1등급 메달 그림을 찾아 비춘다 — 8th Wall 이미지 타깃(시민사회 벽 AR 과 같은 엔진 · 설정)
     정답(〈환영〉) = 그림 둘레에 살롱 3D 화면과 같은 오라 셰이더(salon.js AURA)가 AR 로 일렁임 → 2.6초 뒤 엔진 · 카메라 끄고 수집 완료 화면(done.js)
     오답 = 그 그림의 심사평(data.js feedback) — [다시 비추기]
     타깃 = tools/xr8/make_salon_targets.mjs → ./image-targets-salon/s1..s5.json(전개도 A1 재단본, 왼쪽부터 01–05)
     공간 고정(SLAM) 끔 — 동작 센서 허락 창 없이 바로 카메라. 8th Wall 로딩 화면 · 로고 없이 우리 안내만 -->

<!-- 8th Wall 엔진은 스캔할 때만 — 완료 화면(done=1, 다시 체험 표시 없음)은 엔진 없이(엔진이 돈 화면 위 완료 화면은 위 막대가 틀어짐, 폰)
     11/27: 엔진을 나중에 끼워 넣던 방식에서 '네트워크를 확인해 주세요'가 뜸(폰) → 처음 시험해서 되던 방식(문서에 바로 쓰기)으로 되돌림 -->
<script>
(function () {
  var q = new URLSearchParams(location.search), ag = [];
  try { ag = JSON.parse(sessionStorage.getItem('m100again') || '[]'); } catch (e) {}
  if (q.get('again')) ag = ag.concat(q.get('again').split(','));
  window.__noXR = q.get('done') === '1' && ag.indexOf('salon') < 0;
  // 11/28 정답 그림을 골라 떠오른 채로 새로 열림(lift=1) — 첫 화면부터 흰 바탕 + 가운데 그 그림(엔진을 끄려고 새로 연 페이지에서 끊김 없이 이어 감, done.js liftRect 와 같은 자리)
  window.__lift = q.get('lift') === '1' && q.get('done') === '1';
  if (window.__lift) document.write('<style>html,body{background:#fff!important}.start,.top,.hint{display:none!important}</style><div id="lift0" style="position:fixed;inset:0;z-index:9400;background:#fff"><img src="../img/lift_salon.webp" alt="" style="position:absolute;object-fit:contain;filter:drop-shadow(0 14px 22px rgba(40,28,16,.28));' + (function () { var W = innerWidth, H = innerHeight, a = 633 / 538, w = Math.min(W * 0.72, 330), h = w / a; if (h > H * 0.42) { h = H * 0.42; w = h * a; } return 'left:' + (W - w) / 2 + 'px;top:' + (H * 0.42 - h / 2) + 'px;width:' + w + 'px;height:' + h + 'px'; })() + '"></div>');
  if (!window.__noXR) document.write('<script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1.0.0/dist/xrextras.js" crossorigin="anonymous"><\/script><script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1.0.0/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"><\/script>');
})();
</script>

<canvas id="c"></canvas>
<div class="top" id="top"><button type="button" id="back" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><b>아카데미 살롱</b><span></span></div>

<script type="module">
import { ZONES } from '../data.js';
import { store } from '../store.js';
import { collect, showComplete, liftToCard } from '../done.js';

const $ = (id) => document.getElementById(id);
const T = (s) => (window.M100_T ? window.M100_T(s) : s);
const task = ZONES.find((z) => z.id === 'salon').tasks[0];
const TG = task.targets;                                     // 왼쪽부터 01–05 = s1..s5
const WIN = TG.findIndex((t) => t.correct);                  // 〈환영〉
const WIN_W = { title: '환영: 14세기의 전설', artist: '뤽 올리비에 메르송', year: '1872' };   // salon.js WORKS 와 같은 값(완료 화면 제목)
// 인식한 3:4(가운데) → 그림 전체. 세로 그림 = 위아래로 1400/1319, 가로(03) = 돌린 타깃이라 긴 변으로
const SIZE = [[989, 1400], [989, 1400], [1400, 989], [989, 1400], [989, 1400]], CROP = 1319;
const ROTATED = [false, false, true, false, false];

function finish() {
  const t = task;
  return showComplete('salon', { item: t.item, title: `〈${WIN_W.title}〉 · ${WIN_W.artist}, ${WIN_W.year}`, body: `${t.successBody || ''}\n\n${t.successVerdict || ''}`.trim(), note: t.after });
  $('top').style.display = 'none'; $('hint').hidden = true;
}
// 이미 맞힌 체험(앱 수집 목록 · 이 폰 기록) = 카메라 없이 바로 완료 화면
if (window.__lift) {   // 11/28 골라서 떠오른 그림이 가운데에 떠 있는 채로 열림 → 완료 화면 카드 속으로
  $('start').style.display = 'none'; $('top').style.display = 'none';
  const l0 = $('lift0');
  liftToCard('salon', { lifted: true, complete: () => { l0?.remove(); return finish(); } });
  history.replaceState(null, '', location.pathname + '?' + (() => { const q = new URLSearchParams(location.search); q.delete('lift'); return q.toString(); })());
} else if (store.saved(task.id)) { $('start').style.display = 'none'; finish(); }
else boot();

// 닫기: 앱은 체험 화면을 닫고, 웹은 뒤로
$('back').addEventListener('click', () => {
  if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'close' }));
  else if (history.length > 1) history.back(); else location.href = '../salon.html';
});

// ── 정답 오라 — salon.js AURA 셰이더 그대로(액자 둘레를 따라 일렁이며 흐르는 금빛). 단위도 같게: 그림 긴 변 = 1, 액자 테 M = 0.07
function auraMesh(pw, ph) {
  const M = 0.07, P = 0.7, ow = pw + 2 * M, oh = ph + 2 * M, w = ow + 2 * P, h = oh + 2 * P;
  const mat = new THREE.ShaderMaterial({
    uniforms: { t: { value: 0 }, op: { value: 0 }, hs: { value: new THREE.Vector2(ow / 2, oh / 2) }, size: { value: new THREE.Vector2(w, h) } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: `uniform float t, op; uniform vec2 hs, size; varying vec2 vUv;
      float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float noise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y); }
      float fbm(vec2 p){ float v = 0.0, a = 0.5; for (int k = 0; k < 3; k++) { v += a * noise(p); p *= 2.0; a *= 0.5; } return v; }
      void main(){
        vec2 p = (vUv - 0.5) * size;
        float r = 0.06; vec2 q = abs(p) - hs + r; float d = length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
        if (d < -0.02) discard;
        float ang = atan(p.y, p.x);
        float n = fbm(vec2(ang * 2.2 + t * 0.35, d * 5.0 - t * 0.9));
        float n2 = fbm(vec2(-ang * 3.1 + t * 0.22, d * 9.0 - t * 1.4));
        float core = exp(-max(d, 0.0) * 7.5);
        float haze = exp(-max(d, 0.0) * 2.7) * (0.35 + 0.65 * smoothstep(0.3, 0.85, n * 0.7 + n2 * 0.5)) * (1.0 - smoothstep(0.52, 0.69, d));
        float a = clamp(core * 0.95 + haze * 0.7, 0.0, 1.0) * op;
        vec3 col = mix(vec3(1.0, 0.86, 0.55), vec3(1.0, 0.98, 0.9), core);
        gl_FragColor = vec4(col * a, a);
      }`,
    transparent: true, depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending, toneMapped: false,
  });
  return new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
}

const YEAR = ['1873', '1872', '1872', '1873', '1873'];   // salon.js WORKS 와 같은 값
let aura = null, auraG = null, winT = 0, ended = false, lastWrong = -1, wrongAt = 0, liftT = 0, xs = null, PW = 1, PH = 1, winSeen = 0, auraK = 0, probe = null, probeG = null, probeT = 0, probeI = -1, probeSeen = 0;
const WON = '1등급 메달 · 올해의 당선작';
function salonModule() {
  return {
    name: 'm100salon',
    onStart() {
      xs = XR8.Threejs.xrScene();
      xs.camera.position.set(0, 3, 0);
      XR8.XrController.updateCameraProjectionMatrix({ origin: xs.camera.position, facing: xs.camera.quaternion });
      auraG = new THREE.Group(); auraG.visible = false; xs.scene.add(auraG);
      const [w, h] = SIZE[WIN], a = w / h;
      PW = a >= 1 ? 1 : a; PH = a >= 1 ? 1 / a : 1;
      aura = auraMesh(PW, PH); aura.renderOrder = 5; auraG.add(aura);
      // 11/28 오답도 '비췄다'는 반응 — 그 그림 테두리가 하얗게 한 번 빛나고 빛 한 줄이 위에서 아래로 훑고 지나감(금빛 오라와 다르게)
      probeG = new THREE.Group(); probeG.visible = false; xs.scene.add(probeG);
      probe = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.ShaderMaterial({
        uniforms: { p: { value: 0 }, op: { value: 0 }, r: { value: 1 } },
        vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
        fragmentShader: `uniform float p, op, r; varying vec2 vUv;
          void main(){
            vec2 d = min(vUv, 1.0 - vUv) * vec2(1.0, r); float e = min(d.x, d.y);
            float edge = exp(-e * 90.0) * 0.9;
            float band = exp(-pow((vUv.y - (1.05 - p * 1.1)) * 14.0, 2.0)) * 0.55;
            float a = clamp(edge + band, 0.0, 1.0) * op;
            gl_FragColor = vec4(vec3(1.0, 0.98, 0.94) * a, a);
          }`,
        transparent: true, depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending, toneMapped: false }));
      probe.renderOrder = 4; probeG.add(probe);
    },
    onUpdate() {
      if (!aura) return;
      const now = performance.now();
      aura.material.uniforms.t.value = now / 1000;
      // 11/28 정답 그림이 화면에서 벗어나면(0.35초 넘게 안 잡힘) 오라도 걷힘 — 잔상이 남던 것. 다시 잡으면 다시 피어남
      const vis = winT && !liftT && now - winSeen < 350;
      auraK += ((vis ? 1 : 0) - auraK) * (vis ? 0.09 : 0.2);
      if (liftT) auraK *= 0.8;
      aura.material.uniforms.op.value = auraK * auraK * (3 - 2 * auraK);
      if (!vis && auraK < 0.02) auraG.visible = false;
      if (winT && !liftT && now - wrongAt > 2800) {   // 정답 그림이 보이는 동안 = 정답 카드 + [선택], 벗어나면 둘 다 걷고 기본 안내
        const on = !!vis; $('pick').classList.toggle('on', on && now - winT > 600);
        if (on && cardMode !== 'win') showCard(WIN, 'win'); else if (!on && cardMode === 'win') { hideCard(); $('hint').hidden = false; }
      }
      if (probe) {
        const pp = probeT ? (now - probeT) / 1000 : 9;
        const pv = now - probeSeen < 350;
        probe.material.uniforms.p.value = Math.min(1, pp / 0.8);
        probe.material.uniforms.op.value = pp < 1.4 && pv ? (pp < 0.15 ? pp / 0.15 : pp > 1.0 ? 1 - (pp - 1.0) / 0.4 : 1) : 0;
        probeG.visible = pp < 1.4 && pv;
      }
    },
    listeners: [
      { event: 'reality.imagefound', process: onImage },
      { event: 'reality.imageupdated', process: onImage },
    ],
  };
}
function onImage(e) {
  if (ended || liftT) return;
  const d = e.detail, i = +String(d.name).slice(1) - 1; if (!(i >= 0 && i < 5)) return;
  if (i === WIN) {
    // 그림 전체 크기(긴 변) = 인식한 3:4 의 긴 변 × 1400/1319
    const L = Math.max(d.scaledWidth, d.scaledHeight) * (ROTATED[i] ? SIZE[i][0] / CROP : SIZE[i][1] / CROP);
    auraG.position.copy(d.position); auraG.quaternion.copy(d.rotation);
    const s = d.scale * L; auraG.scale.set(s, s, s); auraG.visible = true; winSeen = performance.now();
    if (!winT) win();
  } else {
    if (i === probeI) { placeProbe(d, i); probeSeen = performance.now(); }
    // 11/28 정답을 한 번 비춘 뒤에도(정답 그림이 화면에 없으면) 오답에 반응 — 전에는 정답 뒤로 오답이 다시 안 잡혔음
    const winVis = winT && performance.now() - winSeen < 350;
    if (!liftT && !winVis && (i !== lastWrong || performance.now() - wrongAt > 4000)) { placeProbe(d, i); probeSeen = performance.now(); wrong(i); }
  }
}
function placeProbe(d, i) {   // 그 오답 그림 전체 크기 · 자리에 훑는 빛 판
  if (!probeG) return;
  const L = Math.max(d.scaledWidth, d.scaledHeight) * (ROTATED[i] ? SIZE[i][0] / CROP : SIZE[i][1] / CROP);
  const [w, h] = SIZE[i], a = w / h, pw = a >= 1 ? 1 : a, ph = a >= 1 ? 1 / a : 1;
  probeG.position.copy(d.position); probeG.quaternion.copy(d.rotation);
  const sc = d.scale * L; probeG.scale.set(sc, sc, sc); probe.scale.set(pw, ph, 1); probe.material.uniforms.r.value = ph / pw;
}
// 점검용(화면에 안 보임): 인식 없이 흐름만 — window.__salonSim(2) = 정답, 0 = 오답
window.__salonSim = (i) => { if (i === WIN) { if (!winT) win(); setTimeout(() => $('pick').classList.add('on'), 650); } else wrong(i); };
// 11/28 비춘 그림 설명 카드(아래): 오답 = 작은 그림 · 제목 · 작가와 연도 + '다른 작품을 비춰 보세요'(2.8초 뒤 기본 안내로) · 정답 = 같은 카드 + '1873년 살롱 1등급 메달' + [선택]
const HINT0 = $('hint').querySelector('span').innerHTML;
let cardMode = '', cardT = 0;
function showCard(i, mode) {
  const t = TG[i], c = $('card');
  $('cardImg').src = '../' + t.img; $('cardT').textContent = T(t.title); $('cardS').textContent = T(`${t.sub} · ${YEAR[i]}`);
  $('cardV').textContent = T(mode === 'win' ? '1873년 살롱 1등급 메달' : '다른 작품을 비춰 보세요');   // 11/28 사용자: 판정 문구 · 체크 표시 없이 — 오답은 다음에 할 일만
  c.classList.toggle('win', mode === 'win'); c.classList.toggle('up', mode === 'win'); c.classList.add('on'); cardMode = mode;
  $('hint').hidden = true;
}
function hideCard() { $('card').classList.remove('on'); cardMode = ''; }
function wrong(i) {
  lastWrong = i; wrongAt = performance.now(); probeI = i; probeT = performance.now();
  navigator.vibrate?.(12);
  $('pick').classList.remove('on');
  showCard(i, 'no');
  clearTimeout(cardT); cardT = setTimeout(() => { if (cardMode === 'no') { hideCard(); const sp = $('hint').querySelector('span'); sp.textContent = T('다른 작품을 비춰 보세요'); $('hint').hidden = false; setTimeout(() => { if (!cardMode) sp.innerHTML = HINT0; }, 3000); } }, 2800);
}
// 정답 = 오라 + 정답 카드 + [선택] — 누르면 그림이 그 자리에서 떠올라 수집품 카드로(done.js liftToCard)
function win() {
  winT = performance.now(); winSeen = winT; wrongAt = 0; clearTimeout(cardT);
  showCard(WIN, 'win');
  navigator.vibrate?.([18, 50, 24]);
}
const V = new THREE.Vector3();
function paintRect() {   // 정답 그림(액자 안 그림)의 화면 자리 — 오라 판 네 모서리를 화면에 투영
  if (!auraG?.visible || !xs) return null;
  auraG.updateMatrixWorld(true);
  const pts = [[-1, 1], [1, 1], [1, -1], [-1, -1]].map(([x, y]) => { V.set(x * PW / 2, y * PH / 2, 0).applyMatrix4(auraG.matrixWorld).project(xs.camera); return [(V.x + 1) / 2 * innerWidth, (1 - V.y) / 2 * innerHeight]; });
  const X = pts.map((p) => p[0]), Y = pts.map((p) => p[1]);
  const r = { l: Math.min(...X), t: Math.min(...Y), r: Math.max(...X), b: Math.max(...Y) };
  return r.r - r.l > 30 && r.b - r.t > 30 && r.r > 0 && r.l < innerWidth ? r : null;
}
$('pickGo').addEventListener('click', async () => {
  if (liftT) return; liftT = performance.now();
  $('pick').classList.remove('on'); hideCard(); $('top').style.opacity = '0';
  store.solve(task.id); collect(task.id);
  // 떠올라 가운데까지는 이 화면에서, 카드로 들어가는 건 엔진 없이 새로 연 화면에서(엔진이 돈 화면 위 완료 화면은 위 막대가 틀어짐)
  await liftToCard('salon', { from: '../img/salon_0' + (WIN + 1) + '.jpg', rect: paintRect(), complete: null, hold: true });
  ended = true;
  try { XR8.stop(); } catch {}
  const q = new URLSearchParams(location.search); q.delete('again');
  const got = (q.get('got') || '').split(',').filter(Boolean); if (!got.includes(task.id)) got.push(task.id);
  q.set('got', got.join(',')); q.set('done', '1'); q.set('lift', '1');
  location.replace(location.pathname + '?' + q.toString());
});

function statusModule() {
  const ready = () => { $('start').style.display = 'none'; $('hint').hidden = false; };
  return { name: 'm100status', onStart: ready, onCameraStatusChange(e) {
    if (e.status === 'hasStream' || e.status === 'hasVideo') ready();
    else if (e.status === 'failed') { $('start').style.display = ''; $('start').classList.add('fail'); $('go').hidden = false; $('lead').hidden = true; $('err').textContent = T('카메라를 켜지 못했습니다. 카메라 사용을 허용해 주세요.'); }
  } };
}
function boot() {
  // 실패 이유를 나눠서(작은 글로 코드도) — 11/27 '네트워크를 확인해 주세요'만 떠서 원인을 알 수 없던 것
  const fail = (msg, why) => { $('start').classList.add('fail'); $('lead').hidden = true; $('go').hidden = false; $('err').textContent = T(msg) + (why ? `  (${why})` : ''); };
  const run = async () => {
    let data;
    try { data = await Promise.all([1, 2, 3, 4, 5].map((n) => fetch(`image-targets-salon/s${n}.json`, { cache: 'no-store' }).then((r) => { if (!r.ok) throw new Error('t' + r.status); return r.json(); }))); }
    catch (e) { fail('네트워크를 확인해 주세요', 'targets ' + (e?.message || '')); return; }
    // 11/27 그림 인식(XrController)은 엔진의 'slam' 묶음에 들어 있음 — 미리 받게 해 두지 않으면 XrController 가 비어 있어 카메라가 안 켜짐(폰 캡처: XR8.XrController null)
    try { if (!XR8.XrController && XR8.loadChunk) await XR8.loadChunk('slam'); } catch (e) { fail('카메라 엔진을 불러오지 못했습니다. 다시 시도해 주세요.', 'slam ' + (e?.message || e)); return; }
    try {
      XR8.XrController.configure({ imageTargetData: data, disableWorldTracking: true });
      XR8.addCameraPipelineModules([
        XR8.GlTextureRenderer.pipelineModule(), XR8.Threejs.pipelineModule(), XR8.XrController.pipelineModule(),
        XRExtras.FullWindowCanvas.pipelineModule(), statusModule(), salonModule()]);
      XR8.run({ canvas: $('c') });
    } catch (e) { fail('카메라를 켜지 못했습니다. 다시 시도해 주세요.', 'xr ' + (e?.message || e)); }
  };
  if (window.XR8) { run(); return; }
  window.addEventListener('xrloaded', run, { once: true });
  setTimeout(() => { if (!window.XR8) fail('카메라 엔진을 불러오지 못했습니다. 다시 시도해 주세요.', 'engine'); }, 20000);
}
$('go').addEventListener('click', () => location.reload());
</script>
