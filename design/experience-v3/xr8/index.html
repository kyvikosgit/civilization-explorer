<!-- 11/25 시민사회 꺾인 벽 — 8th Wall 엔진(배포용 바이너리, SLAM 포함) 시험. 그림을 한 번 인식하면 공간에 고정돼 손을 움직여도 붙어 있게
     면마다 각자 인식(카페 · 박람회 거리), 90도 계산 없음. 카페 = 영상, 거리 = 영상 없음
     대사 = 기획서 260928 그대로, 11/25: 화면 위 상자가 아니라 그림 벽 위(그 인물 머리 위)에 글자가 한 자씩 스르륵 써지는 AR 글(벽과 같은 원근) — 화면 가운데에 가장 가까운 인물 하나만
     화면 채우기 · 권한 · 오류 = 공식 XRExtras(FullWindowCanvas · Loading · RuntimeError)
     타깃 = tools/xr8/make_targets.mjs(공식 image-target-cli) → ./image-targets/*.json
     11/25 티 안 나게: (1) 움직이는 부분만 덮기 — 영상 화소가 첫 장면(*_ref.jpg)과 달라진 곳만 보이고 나머지는 카메라에 비친 실제 그림
                     (2) 실시간 색 맞춤 — 카메라 화소(CameraPixelArray)를 원본 그림 같은 자리와 비교해 영상 밝기 · 대비 · 색을 맞춤 (3) 카메라 같은 흐림 · 잡티 조금
     ?rot=1 · ?rot=-1 : 영상을 90° 돌려 보기(점검용, 기본 0) · ?debug=1 : 판을 붉게 + 상태 · ?noslam=1 : 공간 고정 끄기(점검용) -->
<script src="../i18n.js"></script>  <!-- 11/26 앱 언어(영 · 일 · 중) — 안내 글은 사전으로, 벽 위 대사는 아래 makeText 전에 M100_T 로 -->

<style>
html,body{margin:0;height:100%;background:#000;color:#F2EDE2;font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;overflow:hidden}
#c{position:fixed;left:0;top:0}
.start{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:0 32px;text-align:center;background:#0E0C0A}   /* 11/28 체험 카메라 공통 로딩 화면(위 막대는 그대로 보임) */
.start .spin{width:34px;height:34px;box-sizing:border-box;border-radius:50%;border:2.5px solid rgba(242,237,226,.14);border-top-color:#E9C77B;animation:m100spin .9s linear infinite}
@keyframes m100spin{to{transform:rotate(360deg)}}
.start p{margin:0;color:rgba(242,237,226,.72);font-size:15px;line-height:1.5;white-space:pre-line;word-break:keep-all}
.start #err:empty{display:none}
.start button{min-height:56px;box-sizing:border-box;padding:0 28px;border:0;border-radius:12px;background:#F2EDE2;color:#141210;font:700 17px Freesentation,sans-serif}
.start.fail .spin{display:none}
.hint{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 32px);text-align:center;z-index:5;pointer-events:none}   /* 11/28 체험 카메라 화면 공통 아래 안내 줄 */
.hint span{display:inline-block;max-width:100%;box-sizing:border-box;padding:10px 18px;border-radius:20px;background:rgba(20,16,13,.6);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;font-size:15px;font-weight:500;line-height:1.45;white-space:pre-line;word-break:keep-all}
#dbg{position:fixed;left:8px;top:calc(8px + env(safe-area-inset-top));font:12px/1.4 ui-monospace,Menlo,monospace;background:rgba(0,0,0,.6);padding:6px 8px;border-radius:8px;white-space:pre;z-index:6}
.xbar{position:fixed;left:0;right:0;top:0;z-index:30;box-sizing:border-box;height:calc(52px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 12px 0;display:grid;grid-template-columns:40px 1fr 40px;align-items:center;color:#fff;background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,0))}   /* 11/28 체험 화면 공통 위 막대 */
.xbar button{width:40px;height:40px;padding:0;margin:0;border:0;border-radius:20px;background:none;color:inherit;display:grid;place-items:center;-webkit-tap-highlight-color:transparent}
.xbar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.xbar b{text-align:center;font-size:19px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.credit{position:fixed;right:8px;bottom:calc(6px + env(safe-area-inset-bottom));font-size:9px;color:rgba(255,255,255,.45);z-index:5}
.credit a{color:inherit}

<!-- 11/26 화면 아래 엔진 표기(8th Wall Engine © Niantic Spatial · XR Engine License) 뺌(사용자 지시) — 라이선스 고지는 앱 정보 화면 쪽으로 -->
<script>

(function () {
  var q = new URLSearchParams(location.search), DEBUG = q.has('debug'), ROT = q.has('rot') ? +q.get('rot') || 0 : 0,   // 11/25 폰 확인: 돌린 타깃도 엔진이 원래(가로) 방향으로 알려 줌 → 돌리지 않음(0). 점검용 ?rot=1 · ?rot=-1
      SLAM = q.has('slam');   // 11/26: 기본 끔 — 켜면 아이폰이 '동작 및 방향 접근' 허락 창을 띄우고 첫 터치가 필요해서(시작 단추). 그림 인식만으로도 매 장면 벽에 붙음
  // 11/25 최종 그림(미술팀 261117) — 카페 = 실내(가로), 박람회 거리 = 세로. 인식은 가운데 3:4 만 쓰므로 판을 그림 전체 크기로 늘림(FULL)
  //   대사는 기술 점검용 자리 채움(기획서 260928 대사) — 최종 원고 · 인물 자리를 받으면 바꿈. 영상은 최종 그림으로 새로 만들어야 해서 지금은 없음(글만)
  var ROTATED = { cafe: true, street: false, cafe3: false }, FULL = { cafe: [2400 / 2007, 1], street: [1, 2185 / 2053], cafe3: [1387 / 1200, 1], cafe1: [1205 / 1007, 1], cafe2: [1, 1155 / 689] };
  ROTATED.cafe1 = false; ROTATED.cafe2 = false;
  // 11/27 현장: 카페 그림 앞에 창문 벽체 — 창 안(그림 오른쪽 위)만 보여 카페 전체 인식이 안 됨 → 창 안 장면을 따로 인식(cafe3 = 사용자 현장 사진, tools/xr8/make_cafe3_target.mjs)
  //   영상 = 3번 구간을 창 모양에 맞춘 cafe3_turns.mp4, 대사는 화면에서. 글 폭은 창이 좁아 그림 폭의 절반(TW)
  var TW = { cafe: 0.24, street: 0.24, cafe3: 0.41, cafe1: 0.4, cafe2: 0.6 };   // cafe3 판이 창틀까지 커진 만큼 줄임(글 크기 그대로)
  var ALIAS = { cafe3a1: 'cafe3', cafe3a2: 'cafe3', cafe3a3: 'cafe3', cafe3a4: 'cafe3', cafe1a: 'cafe1', cafe1b: 'cafe1', cafe2a: 'cafe2', cafe2b: 'cafe2' }, lock = {};
  var HEADS = {
    cafe: [
      { x: 0.108, y: 0.50, t: '아카데미 살롱의 기준은 너무 낡았어. 세상이 바뀌었는데, 언제까지 그런 그림만 그릴 거냐고.' },
      { x: 0.455, y: 0.50, t: '마네가 살롱에서 또 낙선했다며? 그 사람 그림이 뭐가 문제인지 나는 도통 모르겠어.' },
      { x: 0.955, y: 0.53, t: '그런데 말이야, 우리끼리 전시회를 연다고 누가 봐주기나 할까? 살롱 없이 팔리긴 할까?' }],
    cafe1: [], cafe2: [],   // 11/28 왼쪽 창 · 가운데 문 창 — 대사(자막)는 나중에
    cafe3: [   // 창 안 오른쪽 모자 쓴 사람(창 폭 안에 들게 글 가운데를 0.75 로)
      { x: 0.6896, y: 0.625, t: '그런데 말이야, 우리끼리 전시회를 연다고 누가 봐주기나 할까? 살롱 없이 팔리긴 할까?' }],   // 11/28 판이 창틀까지 커져 판 기준 자리로(창 안 0.75 · 0.66)
    street: [   // 11/29 판 = 연석 위(원본 0~2185줄) 기준 자리
      { x: 0.615, y: 0.500, t: '박람회 참가국이 42개국이라고? 이걸 다 보려면 며칠은 걸리겠어.' },
      { x: 0.23, y: 0.467, t: '그 동양 전시관 가 봤어요? 그림이 너무 특이하고 신기해요.' },
      { x: 0.40, y: 0.428, t: '이런 건 귀족들이나 보는 줄 알았는데 말야. 세상이 많이 변했어.' },
      { x: 0.84, y: 0.461, t: '예전엔 다들 비슷하게 입고 다녔는데, 요즘은 다들 자기만의 느낌이 있는 것 같아. 취향과 개성이 중요해졌어.' }],
  };
  // 붙음 시험용 영상(tools/xr8/make_text_video.py): 그림은 멈춘 채 머리 위 대사만 한 글자씩 — '달라진 곳만 덮기'라 글자만 보인다. ref = 첫 장면(글 없음)
  var VIDEO = { cafe: q.get('v') === 'all' ? { src: 'cafe_live.mp4', ref: 'cafe_live_ref.jpg', px: [1600, 1004] } : { src: 'cafe_turns.mp4', ref: 'cafe_turns_ref.jpg', px: [1600, 1004], full: true }   /* 11/25 기본 = 말하는 테이블만 그 대사 6초 동안 움직임(총 18초) · ?v=all = 전체가 움직임 */, street: { src: 'street_lit.mp4', ref: 'street_lit_ref.jpg', px: [864, 1226], ownText: true, full: true, mask: 'street_mask.png' },   /* 11/28 새 Veo 영상 전체를 덮되 현장 사진(사용자 11/28)으로 가공: 벽 조명 · 색을 입히고(street_lit) 앞을 가리는 천장 턱 · 기둥 · 카페 벽체와 차양 · 연석은 비움(street_mask) — 가장자리 흐림 없이 그림 테두리에 맞춤 · 대사는 화면에서 */
    // 11/27 현장 창문(카페 그림 오른쪽 위 x 0.68–0.91 · y 0.24–0.65, 특징점 185개로 맞춤) — 3번 구간(12–18초)만 창문 모양에 맞게 펴서 얹음. 영상에 박힌 글은 지우고(인물만 움직임) 대사는 화면에서 따로 씀(ownText)
    // 11/28 카페 창 = 새 Veo 영상(반사 없는 원본에서)에 현장 사진 창살을 구워 넣은 것 — 사용자: 해돋이처럼 영상 전체를 창에 덮음(달라진 곳만 얹으면 실제 창살이 가려져 사라져 보임)
    //   (같은 날 시험한 '창 전체 덮기 + 창살 깊이 계산'(glass)은 판이 떠 보여 안 씀 — liveMat 의 uGlass 코드는 남겨 둠)
    // 11/28 사용자: 창틀 안쪽(그림 면)에 영상을 깔면 상이 뒤에 맺혀 실제 창틀 끝자락과 어긋남 → 창틀까지 덮는 판을 창틀 깊이에 띄움
    //   영상 = 정면 현장 사진(004)의 창틀 · 둘레 + 안쪽은 창살 구운 영상(cafe3_framed.mp4, 창 영역의 1.319 × 1.28 배), 바깥 4% 는 벽에 스며들게(cafe3_framed_edge.png)
    //   front = { depth: 그림보다 앞(창 폭 단위, 현장 사진 12장 시차 0.151), ext: 창 영역 대비 판 크기, k: 그 깊이에서의 크기(정면 카메라 거리 기준 1/1.084) }
    // 11/28 왼쪽 창(cafe1) · 가운데 문 창(cafe2) — 오른쪽 창과 같은 방식: 11/25 전체 벽 영상(글 없는 원본, tools/xr8/gen/cafe_veo31fast_6s_v4cycle.mp4)을 창 자리대로 자르고
    //   현장 영상(11/28 23:46) 정면 프레임의 유리 + 얇은 창틀(왼쪽은 창살도)을 입혀 그 영상 시차로 잰 창틀 깊이(문 74.5 · 왼쪽 94.3, 원본 그림 px)에 띄움 — tools/xr8/make_cafe12.py. off = 판 가운데가 유리 가운데에서 벗어난 만큼(유리 크기 단위, 아래 +)
    cafe1: { src: 'cafe1_framed.mp4', ref: 'cafe1_framed_ref.jpg', px: [1096, 1220], ownText: true, full: true, mask: 'cafe1_edge.png', front: { depth: 0.1721, ext: [1.0, 1.0], k: 0.8934, off: [-0.0013, 0.0017] } },   /* 11/29 판 = 유리만(창틀 · 창살은 실제 카메라) */
    cafe2: { src: 'cafe2_framed.mp4', ref: 'cafe2_framed_ref.jpg', px: [470, 1050], ownText: true, full: true, mask: 'cafe2_edge.png', front: { depth: 0.317, ext: [1.0, 1.0], k: 0.8956, off: [-0.0043, -0.0025] } },   /* 11/29 판 = 유리만(창틀 · 창살은 실제 카메라) */
    cafe3: { src: 'cafe3_framed.mp4', ref: 'cafe3_framed_ref.jpg', px: [900, 1008], ownText: true, full: true, mask: 'cafe3_framed_edge.png',

  var $ = function (id) { return document.getElementById(id); };
  var videos = {};

  Object.keys(VIDEO).forEach(function (k) { var v = document.createElement('video'); Object.assign(v, { muted: true, loop: true, playsInline: true, crossOrigin: 'anonymous', preload: 'metadata', src: VIDEO[k].src }); v.setAttribute('playsinline', ''); videos[k] = v; });
  var faces = {}, seen = {}, dbg = {}, camera = null, v3 = null, curHead = null, cand = null, candAt = 0;

  // ── (1)(3) 움직이는 부분만 · 색 맞춤 · 카메라 같은 흐림/잡티
  var TONE = {}, UU = {};
  function liveMat(k) {
    var V = VIDEO[k], vt = new THREE.VideoTexture(videos[k]), ref = new THREE.TextureLoader().load(V.ref); ref.minFilter = THREE.LinearFilter;
    TONE[k] = { gain: new THREE.Vector3(1, 1, 1), off: new THREE.Vector3(0, 0, 0) };
    var U = UU[k] = { uVid: { value: vt }, uRef: { value: ref }, uGain: { value: TONE[k].gain }, uOff: { value: TONE[k].off }, uTexel: { value: new THREE.Vector2(1 / V.px[0], 1 / V.px[1]) }, uTime: { value: 0 }, uDbg: { value: DEBUG ? 1 : 0 }, uFull: { value: V.full ? 1 : 0 },
      uBars: { value: V.bars ? new THREE.Vector4(V.bars[0], V.bars[1], 1 - V.bars[3], 1 - V.bars[2]) : new THREE.Vector4(-1, -1, -1, -1) },
      uGlass: { value: V.glass ? new THREE.Vector4(V.glass.depth, V.glass.open, V.glass.bscale, V.glass.alpha) : new THREE.Vector4(0, 0, 1, 1) }, uCam: { value: new THREE.Vector3(0, 0, 2) }, uVis: { value: 0 }, uHasMask: { value: V.mask ? 1 : 0 }, uMask: { value: V.mask ? new THREE.TextureLoader().load(V.mask) : null },
      uBarTex: { value: V.glass && V.glass.bars ? new THREE.TextureLoader().load(V.glass.bars) : null }, uBarOn: { value: V.glass && V.glass.bars ? 1 : 0 } };
    if (U.uBarTex.value) U.uBarTex.value.minFilter = THREE.LinearFilter;
    return new THREE.ShaderMaterial({ uniforms: U, transparent: true, depthWrite: false,
      vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
      fragmentShader: [
        'uniform sampler2D uVid, uRef, uBarTex; uniform vec3 uGain, uOff, uCam; uniform vec2 uTexel; uniform float uTime, uDbg, uFull, uVis, uHasMask, uBarOn; uniform sampler2D uMask; uniform vec4 uBars, uGlass; varying vec2 vUv;',
        'float df(vec2 p){ return length(texture2D(uVid, p).rgb - texture2D(uRef, p).rgb); }',
        'float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }',
        'void main(){',

      var f = faces[k]; if ((VIDEO[k] && !VIDEO[k].ownText) || !f.g.visible || !f.sized || now - (seen[k] || 0) > 4000) return;
      f.heads.forEach(function (h) {
        h.o.getWorldPosition(v3); v3.project(camera); if (v3.z > 1) return;
        var x = (v3.x + 1) / 2 * W, y = (1 - v3.y) / 2 * H; if (x < 0 || x > W || y < 0 || y > H) return;
        var dd = Math.hypot(x - W / 2, y - H / 2); if (dd < bd) { bd = dd; best = h; }
      });
    });
    // 바뀐 인물은 0.5초 이상 계속 가장 가까울 때만 넘어감(왔다 갔다 방지)
    if (best !== cand) { cand = best; candAt = now; }
    if (cand !== curHead && now - candAt > 500) { curHead = cand; if (curHead) curHead.t0 = now; }
    Object.keys(faces).forEach(function (k) { faces[k].heads.forEach(function (h) {
      var on = h === curHead; h.a = Math.max(0, Math.min(1, h.a + (on ? 0.08 : -0.06)));
      h.tx.mesh.visible = h.a > 0;
      if (h.a > 0) drawText(h.tx, on ? (now - h.t0) / 1000 : 99, h.a);
    }); });
    $('hint').hidden = !!best || Object.keys(seen).some(function (k) { return now - seen[k] < 4000; });
    if (DEBUG) { $('dbg').hidden = false; $('dbg').textContent = JSON.stringify(dbg, null, 1); }
  }

  function statusModule() {
    var ready = function () { $('start').style.display = 'none'; $('hint').hidden = false; };
    return { name: 'm100status', onStart: ready, onCameraStatusChange: function (e) {
      if (e.status === 'hasStream' || e.status === 'hasVideo') ready();
      else if (e.status === 'failed') { $('go').onclick = function () { if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'camera-perm' })); else location.reload(); }; $('start').style.display = ''; $('start').classList.add('fail'); $('go').hidden = false; $('lead').hidden = true; $('err').textContent = '카메라를 켜지 못했습니다. 카메라 사용을 허용해 주세요.'; }
    } };
  }
  function boot() {
    Promise.all(['street', 'cafe3', 'cafe3a1', 'cafe3a4', 'cafe1', 'cafe1a', 'cafe1b', 'cafe2', 'cafe2a', 'cafe2b'].map(function (n) {   /* 11/28 엔진 한도 10개 — 현장에서 안 보이는 카페 전체 그림(cafe) · 오른쪽 창 각도 2장은 뺌 */   /* 11/28 cafe3a1–a4 = 현장 사진 여러 각도(tools/xr8/make_cafe3_angles.mjs) — 모두 cafe3 로 */ return fetch('image-targets/' + n + '.json').then(function (r) { return r.json(); }); })).then(function (data) {
      XR8.XrController.configure({ imageTargetData: data, disableWorldTracking: !SLAM });
      XR8.addCameraPipelineModules([
        XR8.GlTextureRenderer.pipelineModule(), XR8.CameraPixelArray.pipelineModule({ luminance: false, maxDimension: 192 }), XR8.Threejs.pipelineModule(), XR8.XrController.pipelineModule(),
        XRExtras.FullWindowCanvas.pipelineModule(),   // 캔버스를 화면 크기 · 화소 밀도에 맞춤(좌상단에 작게 그려지던 문제)
        statusModule(),                               // 11/26: 8th Wall 로딩 화면(로고) · 오류 화면 대신 우리 안내 한 줄
        wallModule()]);
      XR8.run({ canvas: $('c') });
      $('start').style.display = 'none'; $('hint').hidden = false;   // 엔진을 켜면 바로 카메라 화면으로(못 켜면 위 statusModule 이 안내를 다시 띄움)
    });
  }
  // 11/26: 시작 단추 없이 바로 카메라(공간 고정을 끄면 동작 센서 허락이 필요 없어 터치 없이 시작 가능) — 못 켜면 그때만 단추
  function start() {
    $('go').hidden = true; $('lead').hidden = false; $('err').textContent = ''; $('start').classList.remove('fail');
    Object.keys(videos).forEach(function (k) { videos[k].play().then(function () { videos[k].pause(); }).catch(function () {}); });
    var asks = [window.DeviceOrientationEvent, window.DeviceMotionEvent].filter(function (E) { return SLAM && E && typeof E.requestPermission === 'function'; }).map(function (E) { return E.requestPermission().catch(function () { return 'denied'; }); });
    Promise.all(asks).then(function () {
      var fontReady = document.fonts && document.fonts.load ? document.fonts.load(FONT, '가나다').catch(function () {}) : Promise.resolve();
      fontReady.then(function () { if (window.XR8) boot(); else window.addEventListener('xrloaded', boot); });
    });
  }
  $('go').addEventListener('click', function () { location.reload(); });
  if (SLAM) { $('go').hidden = false; $('lead').hidden = true; $('go').onclick = start; } else start();
})();
</script>
