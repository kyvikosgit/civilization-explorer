<title>벽 AR 시험 · 8th Wall</title>
<!-- 11/25 시민사회 꺾인 벽 — 8th Wall 엔진(배포용 바이너리, SLAM 포함) 시험. 그림을 한 번 인식하면 공간에 고정돼 손을 움직여도 붙어 있게
     면마다 각자 인식(카페 · 박람회 거리), 90도 계산 없음. 카페 = 영상, 거리 = 영상 없음
     대사 = 기획서 260928 그대로, 11/25: 화면 위 상자가 아니라 그림 벽 위(그 인물 머리 위)에 글자가 한 자씩 스르륵 써지는 AR 글(벽과 같은 원근) — 화면 가운데에 가장 가까운 인물 하나만
     화면 채우기 · 권한 · 오류 = 공식 XRExtras(FullWindowCanvas · Loading · RuntimeError)
     타깃 = tools/xr8/make_targets.mjs(공식 image-target-cli) → ./image-targets/*.json
     11/25 티 안 나게: (1) 움직이는 부분만 덮기 — 영상 화소가 첫 장면(*_ref.jpg)과 달라진 곳만 보이고 나머지는 카메라에 비친 실제 그림
                     (2) 실시간 색 맞춤 — 카메라 화소(CameraPixelArray)를 원본 그림 같은 자리와 비교해 영상 밝기 · 대비 · 색을 맞춤 (3) 카메라 같은 흐림 · 잡티 조금
     ?rot=1 · ?rot=-1 : 영상을 90° 돌려 보기(점검용, 기본 0) · ?debug=1 : 판을 붉게 + 상태 · ?noslam=1 : 공간 고정 끄기(점검용) -->

<style>
html,body{margin:0;height:100%;background:#000;color:#F2EDE2;font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;overflow:hidden}
#c{position:fixed;left:0;top:0}
.start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:28px;text-align:center;background:#000;z-index:20}
.start h1{font-size:21px;margin:0}.start p{color:#9C958A;font-size:14px;line-height:1.6;margin:0;word-break:keep-all}

.credit{position:fixed;right:8px;bottom:calc(6px + env(safe-area-inset-bottom));font-size:9px;color:rgba(255,255,255,.45);z-index:5}

</style>

<body>
<canvas id="c"></canvas>
<div class="start" id="start"><h1>벽 AR 시험 (8th Wall)</h1><p>카페 그림이나 거리 그림을 화면에 가득 비춰 주세요.<br>한 번 잡히면 폰을 움직여도 그 자리에 붙어 있어야 합니다.</p><button type="button" id="go">시작</button><p id="err"></p></div>
<div class="hint" id="hint" hidden><span>그림을 화면에 가득 비춰 주세요</span></div>
<div id="dbg" hidden></div>
<div class="credit">AR: 8th Wall Engine © Niantic Spatial · <a href="https://github.com/8thwall/engine/blob/main/LICENSE" target="_blank" rel="noopener">XR Engine License</a> · 보증 없음</div>
<script>
(function () {
  var q = new URLSearchParams(location.search), DEBUG = q.has('debug'), ROT = q.has('rot') ? +q.get('rot') || 0 : 0,   // 11/25 폰 확인: 돌린 타깃도 엔진이 원래(가로) 방향으로 알려 줌 → 돌리지 않음(0). 점검용 ?rot=1 · ?rot=-1
      SLAM = !q.has('noslam');
  // 11/25 최종 그림(미술팀 261117) — 카페 = 실내(가로), 박람회 거리 = 세로. 인식은 가운데 3:4 만 쓰므로 판을 그림 전체 크기로 늘림(FULL)
  //   대사는 기술 점검용 자리 채움(기획서 260928 대사) — 최종 원고 · 인물 자리를 받으면 바꿈. 영상은 최종 그림으로 새로 만들어야 해서 지금은 없음(글만)
  var ROTATED = { cafe: true, street: false }, FULL = { cafe: [2400 / 2007, 1], street: [1, 2400 / 2053] };
  var HEADS = {
    cafe: [
      { x: 0.108, y: 0.50, t: '아카데미 살롱의 기준은 너무 낡았어. 세상이 바뀌었는데, 언제까지 그런 그림만 그릴 거냐고.' },
      { x: 0.455, y: 0.50, t: '마네가 살롱에서 또 낙선했다며? 그 사람 그림이 뭐가 문제인지 나는 도통 모르겠어.' },
      { x: 0.955, y: 0.53, t: '그런데 말이야, 우리끼리 전시회를 연다고 누가 봐주기나 할까? 살롱 없이 팔리긴 할까?' }],
    street: [
      { x: 0.615, y: 0.455, t: '박람회 참가국이 42개국이라고? 이걸 다 보려면 며칠은 걸리겠어.' },
      { x: 0.23, y: 0.425, t: '그 동양 전시관 가 봤어요? 그림이 너무 특이하고 신기해요.' },
      { x: 0.40, y: 0.39, t: '이런 건 귀족들이나 보는 줄 알았는데 말야. 세상이 많이 변했어.' },
      { x: 0.84, y: 0.42, t: '예전엔 다들 비슷하게 입고 다녔는데, 요즘은 다들 자기만의 느낌이 있는 것 같아. 취향과 개성이 중요해졌어.' }],
  };
  // 붙음 시험용 영상(tools/xr8/make_text_video.py): 그림은 멈춘 채 머리 위 대사만 한 글자씩 — '달라진 곳만 덮기'라 글자만 보인다. ref = 첫 장면(글 없음)
  var VIDEO = { cafe: { src: 'cafe_live.mp4', ref: 'cafe_live_ref.jpg', px: [1600, 1004] }   /* 11/25 Veo 3.1 Fast 전체 움직임 + 대사(한 줄 6초) */, street: { src: 'street_text.mp4', ref: 'street_text_ref.jpg', px: [1080, 1684] } };
  var $ = function (id) { return document.getElementById(id); };
  var videos = {};
  Object.keys(VIDEO).forEach(function (k) { var v = document.createElement('video'); Object.assign(v, { muted: true, loop: true, playsInline: true, crossOrigin: 'anonymous', preload: 'auto', src: VIDEO[k].src }); v.setAttribute('playsinline', ''); videos[k] = v; });
  var faces = {}, seen = {}, dbg = {}, camera = null, v3 = null, curHead = null, cand = null, candAt = 0;

  // ── (1)(3) 움직이는 부분만 · 색 맞춤 · 카메라 같은 흐림/잡티
  var TONE = {}, UU = {};
  function liveMat(k) {
    var V = VIDEO[k], vt = new THREE.VideoTexture(videos[k]), ref = new THREE.TextureLoader().load(V.ref); ref.minFilter = THREE.LinearFilter;
    TONE[k] = { gain: new THREE.Vector3(1, 1, 1), off: new THREE.Vector3(0, 0, 0) };
    var U = UU[k] = { uVid: { value: vt }, uRef: { value: ref }, uGain: { value: TONE[k].gain }, uOff: { value: TONE[k].off }, uTexel: { value: new THREE.Vector2(1 / V.px[0], 1 / V.px[1]) }, uTime: { value: 0 }, uDbg: { value: DEBUG ? 1 : 0 } };
    return new THREE.ShaderMaterial({ uniforms: U, transparent: true, depthWrite: false,
      vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
      fragmentShader: [
        'uniform sampler2D uVid, uRef; uniform vec3 uGain, uOff; uniform vec2 uTexel; uniform float uTime, uDbg; varying vec2 vUv;',
        'float df(vec2 p){ return length(texture2D(uVid, p).rgb - texture2D(uRef, p).rgb); }',
        'float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }',
        'void main(){',
        '  vec2 o = uTexel * 3.0;',
        '  float d = max(max(df(vUv), df(vUv + vec2(o.x, 0.0))), max(max(df(vUv - vec2(o.x, 0.0)), df(vUv + vec2(0.0, o.y))), df(vUv - vec2(0.0, o.y))));',
        '  float m = smoothstep(0.05, 0.16, d);',   // 첫 장면과 달라진 곳(움직이는 사람 · 연기 등)만
        '  vec2 e = smoothstep(vec2(0.0), vec2(0.03), vUv) * smoothstep(vec2(0.0), vec2(0.03), 1.0 - vUv);',
        '  vec3 c = (texture2D(uVid, vUv).rgb * 2.0 + texture2D(uVid, vUv + vec2(uTexel.x, 0.0)).rgb + texture2D(uVid, vUv - vec2(uTexel.x, 0.0)).rgb + texture2D(uVid, vUv + vec2(0.0, uTexel.y)).rgb + texture2D(uVid, vUv - vec2(0.0, uTexel.y)).rgb) / 6.0;',
        '  c = clamp(c * uGain + uOff + (h(vUv * 917.0 + uTime) - 0.5) * 0.025, 0.0, 1.0);',
        '  float a = m * e.x * e.y;',
        '  if (uDbg > 0.5) { c = mix(c, vec3(1.0, 0.0, 0.0), 0.45); a = max(a, 0.18 * e.x * e.y); }',
        '  gl_FragColor = vec4(c, a);',
        '}'].join('\n') });
  }
  // ── (2) 실시간 색 맞춤: 카페 면 위 격자 점마다 카메라 색 ↔ 원본 그림 색 → 채널별 대비(gain) · 밝기(off), 천천히 따라감
  var refPx = {};
  Object.keys(VIDEO).forEach(function (k) { var im = new Image(); im.crossOrigin = 'anonymous'; im.onload = function () { var c = document.createElement('canvas'); c.width = 240; c.height = 240; var x = c.getContext('2d'); x.drawImage(im, 0, 0, 240, 240); refPx[k] = x.getImageData(0, 0, 240, 240); }; im.src = VIDEO[k].ref; });
  var lastTone = 0, flipVote = 0, tp = null;
  function tone(cpa) {
    var now = Date.now(); if (now - lastTone < 250) return; lastTone = now;
    Object.keys(VIDEO).forEach(function (k) { toneFace(k, cpa, now); });
  }
  function toneFace(k, cpa, now) {
    var f = faces[k], rp = refPx[k], TN = TONE[k]; if (!TN || !rp || !cpa || !cpa.pixels || !f || !f.g.visible || !f.sized) return;
    if (now - (seen[k] || 0) > 600) return;
    tp = tp || new THREE.Vector3();
    var W = window.innerWidth, H = window.innerHeight, ac = cpa.cols / cpa.rows, as = W / H, pts = [];
    for (var j = 0; j < 6; j++) for (var i = 0; i < 8; i++) {
      var u = 0.08 + i * 0.84 / 7, v = 0.08 + j * 0.84 / 5;
      tp.set(u - 0.5, 0.5 - v, 0); f.m.localToWorld(tp); tp.project(camera); if (tp.z > 1) continue;
      var sx = (tp.x + 1) / 2, sy = (1 - tp.y) / 2; if (sx < 0.02 || sx > 0.98 || sy < 0.02 || sy > 0.98) continue;
      var cx = ac > as ? (sx - 0.5) * (as / ac) + 0.5 : sx, cy = ac > as ? sy : (sy - 0.5) * (ac / as) + 0.5;
      var ri = Math.round(u * 239) + Math.round(v * 239) * 240, r = [rp.data[ri * 4] / 255, rp.data[ri * 4 + 1] / 255, rp.data[ri * 4 + 2] / 255];
      pts.push({ cx: cx, cy: cy, r: r });
    }
    if (pts.length < 10) return;
    var samp = function (flip) { return pts.map(function (p) { var col = Math.round(p.cx * (cpa.cols - 1)), row = Math.round((flip ? 1 - p.cy : p.cy) * (cpa.rows - 1)), k = row * cpa.rowBytes + col * 4; return [cpa.pixels[k] / 255, cpa.pixels[k + 1] / 255, cpa.pixels[k + 2] / 255]; }); };
    var lum = function (c) { return 0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]; };
    var corr = function (A, B) { var n = A.length, ma = 0, mb = 0, sab = 0, saa = 0, sbb = 0; for (var i = 0; i < n; i++) { ma += A[i]; mb += B[i]; } ma /= n; mb /= n; for (i = 0; i < n; i++) { sab += (A[i] - ma) * (B[i] - mb); saa += (A[i] - ma) * (A[i] - ma); sbb += (B[i] - mb) * (B[i] - mb); } return sab / Math.sqrt(saa * sbb + 1e-9); };
    var R = pts.map(function (p) { return lum(p.r); }), c0 = samp(false), c1 = samp(true);
    var k0 = corr(c0.map(lum), R), k1 = corr(c1.map(lum), R); flipVote = Math.max(-20, Math.min(20, flipVote + (k1 > k0 ? 1 : -1)));
    var cam = flipVote > 0 ? c1 : c0, kk = Math.max(k0, k1); if (kk < 0.4) return;   // 그림과 잘 안 맞는 순간(가림 · 반사)은 건너뜀
    for (var ch = 0; ch < 3; ch++) {
      var mr = 0, mc = 0, vr = 0, vc = 0, n = pts.length;
      for (var i2 = 0; i2 < n; i2++) { mr += pts[i2].r[ch]; mc += cam[i2][ch]; } mr /= n; mc /= n;
      for (i2 = 0; i2 < n; i2++) { vr += Math.pow(pts[i2].r[ch] - mr, 2); vc += Math.pow(cam[i2][ch] - mc, 2); }
      var g = Math.max(0.4, Math.min(1.6, Math.sqrt(vc / (vr + 1e-6)))), o = Math.max(-0.35, Math.min(0.35, mc - g * mr));
      TN.gain.setComponent(ch, TN.gain.getComponent(ch) * 0.8 + g * 0.2); TN.off.setComponent(ch, TN.off.getComponent(ch) * 0.8 + o * 0.2);
    }
    dbg['tone_' + k] = 'gain ' + TN.gain.toArray().map(function (x) { return x.toFixed(2); }).join(',') + ' off ' + TN.off.toArray().map(function (x) { return x.toFixed(2); }).join(',') + ' corr ' + kk.toFixed(2) + (flipVote > 0 ? ' flip' : '');
  }

  function wallModule() {
    return {
      name: 'society-wall',
      onStart: function () {
        var xs = XR8.Threejs.xrScene(); camera = xs.camera; v3 = new THREE.Vector3();
        camera.position.set(0, 3, 0);
        XR8.XrController.updateCameraProjectionMatrix({ origin: camera.position, facing: camera.quaternion });
        ['cafe', 'street'].forEach(function (k) {
          var g = new THREE.Group(); g.visible = false; xs.scene.add(g);
          // 판 = 그 면 그림(가로) 크기. 카페만 영상을 보이고, 거리는 안 보이는 판(머리 자리 계산용)
          var mat = VIDEO[k] ? liveMat(k) : new THREE.MeshBasicMaterial({ visible: false });
          var m = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat); g.add(m);
          var heads = HEADS[k].map(function (h) {
            var o = new THREE.Object3D(); o.position.set(h.x - 0.5, 0.5 - h.y, 0); m.add(o);
            var tx = makeText(h.t); tx.mesh.visible = false; g.add(tx.mesh);
            return { o: o, t: h.t, face: k, hx: h.x, hy: h.y, tx: tx, a: 0, t0: 0 };
          });
          faces[k] = { g: g, m: m, heads: heads, sized: false };
        });
      },
      onUpdate: function (a) { Object.keys(UU).forEach(function (k) { UU[k].uTime.value = (UU[k].uTime.value + 0.013) % 100; }); tone(a && a.processGpuResult && a.processGpuResult.camerapixelarray); placeSay(); },
      listeners: [
        { event: 'reality.imagefound', process: place },
        { event: 'reality.imageupdated', process: place },
        { event: 'reality.imagelost', process: function (e) { dbg[e.detail.name] = 'lost(고정 유지)'; } },
      ],
    };
  }
  // 타깃 자리에 판을 놓는다. 가로 그림을 90° 돌려 세로 타깃으로 만들었으므로(isRotated) 엔진이 세로로 알려 주면 판을 90° 돌려 맞춘다
  function place(e) {
    var d = e.detail, f = faces[d.name]; if (!f) return;
    f.g.position.copy(d.position); f.g.quaternion.copy(d.rotation); f.g.scale.set(d.scale, d.scale, d.scale); f.g.visible = true;
    if (!f.sized) {
      var w = d.scaledWidth, h = d.scaledHeight;
      var fl = FULL[d.name] || [1, 1];   // 인식한 3:4 → 그림 전체
      if (ROTATED[d.name]) { f.m.scale.set(Math.max(w, h) * fl[0], Math.min(w, h) * fl[1], 1); f.m.rotation.z = ROT * Math.PI / 2; } else f.m.scale.set(w * fl[0], h * fl[1], 1);
      f.sized = true; f.m.updateMatrix();
      // 글판: 그림 벽과 같은 면 · 같은 위쪽 방향으로, 머리 꼭대기 바로 위에(그림 가로의 24% 폭)
      var up = new THREE.Vector3(0, 1, 0).applyAxisAngle(new THREE.Vector3(0, 0, 1), f.m.rotation.z), cw = f.m.scale.x;
      f.heads.forEach(function (hd) {
        var p = new THREE.Vector3(hd.hx - 0.5, 0.5 - hd.hy, 0).applyMatrix4(f.m.matrix), tw = cw * 0.24, th = tw * hd.tx.ar;
        hd.tx.mesh.scale.set(tw, th, 1); hd.tx.mesh.rotation.z = f.m.rotation.z;
        hd.tx.mesh.position.copy(p).addScaledVector(up, th / 2 + cw * 0.01).setZ(cw * 0.002);
      });
    }
    seen[d.name] = Date.now(); dbg[d.name] = 'tracked ' + (d.scaledWidth || 0).toFixed(2) + 'x' + (d.scaledHeight || 0).toFixed(2);
    var vv = videos[d.name]; if (vv && vv.paused) vv.play().catch(function () {});
  }
  // ── 벽 위 글: 캔버스에 글을 그려 벽면과 같은 판에 붙인다. 한 글자씩 0.35초 동안 스르륵(투명 → 진하게), 초당 11자
  var FONT = "700 54px 'Gowun Batang', 'AppleMyungjo', serif", CW = 720, LH = 74, PAD = 28;   // 머리 위에 좁게(한 줄 12자 안팎)
  function wrap(ctx, text, maxW) {   // 한국어는 낱자 단위로 줄바꿈(띄어쓰기 우선)
    var words = text.split(' '), lines = [], cur = '';
    words.forEach(function (w) { var t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width <= maxW) cur = t; else { if (cur) lines.push(cur); cur = w; } });
    if (cur) lines.push(cur); return lines;
  }
  function makeText(text) {
    var c = document.createElement('canvas'), ctx = c.getContext('2d'); ctx.font = FONT;
    var lines = wrap(ctx, text, CW - PAD * 2); c.width = CW; c.height = lines.length * LH + PAD * 2;
    ctx.font = FONT;   // 캔버스 크기를 바꾸면 글꼴 설정이 초기화된다 — 다시 지정하지 않으면 글자 폭을 10px 기본 글꼴로 재서 한자리에 뭉침(11/25 버그)
    var tex = new THREE.CanvasTexture(c); tex.minFilter = THREE.LinearFilter; tex.generateMipmaps = false;
    var mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, depthTest: false, toneMapped: false }));
    mesh.renderOrder = 10;
    var chars = []; lines.forEach(function (ln, li) { var x = 0, w = ctx.measureText(ln).width, x0 = (CW - w) / 2; Array.from(ln).forEach(function (ch) { chars.push({ ch: ch, x: x0 + x, y: PAD + li * LH + LH * 0.78 }); x += ctx.measureText(ch).width; }); });
    return { c: c, ctx: ctx, tex: tex, mesh: mesh, chars: chars, ar: c.height / c.width, drawn: -1 };
  }
  function drawText(tx, el, fade) {   // el = 시작 뒤 지난 초, fade = 전체 투명도
    var ctx = tx.ctx; ctx.clearRect(0, 0, tx.c.width, tx.c.height); ctx.font = FONT; ctx.textBaseline = 'alphabetic';
    tx.chars.forEach(function (o, i) {
      var a = Math.max(0, Math.min(1, (el - i / 11) / 0.35)) * fade; if (a <= 0) return;
      ctx.globalAlpha = a; ctx.shadowColor = 'rgba(0,0,0,.85)'; ctx.shadowBlur = 14; ctx.fillStyle = '#FFF4DE';
      ctx.fillText(o.ch, o.x, o.y + (1 - Math.min(1, a / Math.max(fade, 0.01))) * 6);   // 살짝 떠오르며
    });
    ctx.globalAlpha = 1; tx.tex.needsUpdate = true;
  }
  function placeSay() {
    if (!camera) return;
    var W = window.innerWidth, H = window.innerHeight, best = null, bd = 1e9, now = Date.now();
    Object.keys(faces).forEach(function (k) {
      var f = faces[k]; if (VIDEO[k] || !f.g.visible || !f.sized || now - (seen[k] || 0) > 4000) return;
      f.heads.forEach(function (h) {
        h.o.getWorldPosition(v3); v3.project(camera); if (v3.z > 1) return;
        var x = (v3.x + 1) / 2 * W, y = (1 - v3.y) / 2 * H; if (x < 0 || x > W || y < 0 || y > H) return;
        var dd = Math.hypot(x - W / 2, y - H / 2); if (dd < bd) { bd = dd; best = h; }
      });
    });
    // 바뀐 인물은 0.5초 이상 계속 가장 가까울 때만 넘어감(왔다 갔다 방지)
    if (best !== cand) { cand = best; candAt = now; }
    if (cand !== curHead && now - candAt > 500) { curHead = cand; if (curHead) curHead.t0 = now; }
    Object.keys(faces).forEach(function (k) { faces[k].heads.forEach(function (h) {
      var on = h === curHead; h.a = Math.max(0, Math.min(1, h.a + (on ? 0.08 : -0.06)));
      h.tx.mesh.visible = h.a > 0;
      if (h.a > 0) drawText(h.tx, on ? (now - h.t0) / 1000 : 99, h.a);
    }); });
    $('hint').hidden = !!best || Object.keys(seen).some(function (k) { return now - seen[k] < 4000; });
    if (DEBUG) { $('dbg').hidden = false; $('dbg').textContent = JSON.stringify(dbg, null, 1); }
  }

  function boot() {
    Promise.all(['cafe', 'street'].map(function (n) { return fetch('image-targets/' + n + '.json').then(function (r) { return r.json(); }); })).then(function (data) {
      XR8.XrController.configure({ imageTargetData: data, disableWorldTracking: !SLAM });
      XR8.addCameraPipelineModules([
        XR8.GlTextureRenderer.pipelineModule(), XR8.CameraPixelArray.pipelineModule({ luminance: false, maxDimension: 192 }), XR8.Threejs.pipelineModule(), XR8.XrController.pipelineModule(),
        XRExtras.FullWindowCanvas.pipelineModule(),   // 캔버스를 화면 크기 · 화소 밀도에 맞춤(좌상단에 작게 그려지던 문제)
        XRExtras.Loading.pipelineModule(),            // 카메라 · 동작 센서 허락 안내
        XRExtras.RuntimeError.pipelineModule(),
        wallModule()]);
      XR8.run({ canvas: $('c') });
    });
  }
  $('go').addEventListener('click', function () {
    Object.keys(videos).forEach(function (k) { videos[k].play().then(function () { videos[k].pause(); }).catch(function () {}); });   // 첫 터치로 재생 권한
    var asks = [window.DeviceOrientationEvent, window.DeviceMotionEvent].filter(function (E) { return SLAM && E && typeof E.requestPermission === 'function'; }).map(function (E) { return E.requestPermission().catch(function () { return 'denied'; }); });
    Promise.all(asks).then(function (r) {
      if (r.indexOf('denied') >= 0) { $('err').textContent = '동작 및 방향 접근을 허용해야 그림이 제자리에 고정됩니다. 다시 시작을 눌러 허용해 주세요.'; return; }
      $('start').style.display = 'none'; $('hint').hidden = false;
      var fontReady = document.fonts && document.fonts.load ? document.fonts.load(FONT, '가나다').catch(function () {}) : Promise.resolve();
      fontReady.then(function () { if (window.XR8) boot(); else window.addEventListener('xrloaded', boot); });
    });
  });
})();
</script>
