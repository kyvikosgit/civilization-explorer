<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex">
<title>벽 AR 시험 · 8th Wall</title>
<!-- 11/25 시민사회 꺾인 벽 — 8th Wall 엔진(배포용 바이너리, SLAM 포함) 시험. MindAR 대신: 그림을 한 번 인식하면 공간에 고정돼 손을 움직여도 붙어 있게
     면마다 각자 인식(카페 · 박람회 거리), 90도 계산 없음. 카페 = 영상, 거리 = 영상 없음(대사만). 대사 = 기획서 260928 그대로, 화면 아래 자막
     타깃 = tools/xr8/make_targets.mjs(공식 image-target-cli) → ./image-targets/*.json
     ?rot=1 : 가로 그림 돌림 방향 반대로(어긋나 보일 때) · ?debug=1 : 판을 붉게 + 상태 숫자 -->
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1.0.0/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
<style>
html,body{margin:0;height:100%;background:#000;color:#F2EDE2;font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;overflow:hidden}
canvas#c{position:fixed;inset:0;width:100%;height:100%}
.start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:28px;text-align:center;background:#000;z-index:10}
.start h1{font-size:21px;margin:0}.start p{color:#9C958A;font-size:14px;line-height:1.6;margin:0;word-break:keep-all}
.start button{font:700 17px inherit;background:#F2EDE2;color:#141210;border:0;border-radius:12px;padding:15px 30px}
.sub{position:fixed;left:16px;right:16px;bottom:calc(40px + env(safe-area-inset-bottom));background:rgba(0,0,0,.62);border-radius:10px;padding:12px 16px;font-size:16px;line-height:1.45;font-weight:600;text-align:center;word-break:keep-all;opacity:0;transition:opacity .3s;z-index:5}
.sub.on{opacity:1}
.hint{position:fixed;left:0;right:0;bottom:calc(44px + env(safe-area-inset-bottom));text-align:center;z-index:5}
.hint span{background:rgba(0,0,0,.5);padding:8px 14px;border-radius:18px;font-size:15px}
#dbg{position:fixed;left:8px;top:calc(8px + env(safe-area-inset-top));font:12px/1.4 ui-monospace,Menlo,monospace;background:rgba(0,0,0,.6);padding:6px 8px;border-radius:8px;white-space:pre;z-index:6}
.credit{position:fixed;right:8px;bottom:calc(6px + env(safe-area-inset-bottom));font-size:9px;color:rgba(255,255,255,.45);z-index:5}
.credit a{color:inherit}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="start" id="start"><h1>벽 AR 시험 (8th Wall)</h1><p>카페 그림이나 거리 그림을 화면에 가득 비춰 주세요.<br>한 번 잡히면 폰을 움직여도 그 자리에 붙어 있어야 합니다.</p><button type="button" id="go">시작</button><p id="err"></p></div>
<div class="hint" id="hint" hidden><span>그림을 화면에 가득 비춰 주세요</span></div>
<div class="sub" id="sub"></div>
<div id="dbg" hidden></div>
<div class="credit">AR: 8th Wall Engine © Niantic Spatial · <a href="https://github.com/8thwall/engine/blob/main/LICENSE" target="_blank" rel="noopener">XR Engine License</a> · 보증 없음</div>
<script>
(function () {
  var q = new URLSearchParams(location.search), DEBUG = q.has('debug'), ROT = q.has('rot') ? 1 : -1, SLAM = !q.has('noslam');   // noslam: 공간 고정 끄고 그림 인식만(점검용)
  var LINES = {
    cafe: ['아카데미 살롱의 기준은 너무 낡았어. 세상이 바뀌었는데, 언제까지 그런 그림만 그릴 거냐고.',
           '마네가 살롱에서 또 낙선했다며? 그 사람 그림이 뭐가 문제인지 나는 도통 모르겠어.',
           '그런데 말이야, 우리끼리 전시회를 연다고 누가 봐주기나 할까? 살롱 없이 팔리긴 할까?'],
    street: ['박람회 참가국이 42개국이라고? 이걸 다 보려면 며칠은 걸리겠어.',
             '그 동양 전시관 가 봤어요? 그림이 너무 특이하고 신기해요.',
             '이런 건 귀족들이나 보는 줄 알았는데 말야. 세상이 많이 변했어.',
             '예전엔 다들 비슷하게 입고 다녔는데, 요즘은 다들 자기만의 느낌이 있는 것 같아. 취향과 개성이 중요해졌어.'],
  };
  var VIDEO = { cafe: '../video/cafe_plan.mp4' };   // 첫 장면 = 카페 그림(cafe_plan.jpg)과 같은 판
  var $ = function (id) { return document.getElementById(id); };
  var video = document.createElement('video');
  Object.assign(video, { muted: true, loop: true, playsInline: true, crossOrigin: 'anonymous', preload: 'auto', src: VIDEO.cafe });
  video.setAttribute('playsinline', '');
  var faces = {}, seen = {}, cur = null, li = 0, lt = 0, dbg = {};

  function wallModule() {
    return {
      name: 'society-wall',
      onStart: function () {
        var xs = XR8.Threejs.xrScene(), scene = xs.scene, camera = xs.camera;
        camera.position.set(0, 3, 0);
        XR8.XrController.updateCameraProjectionMatrix({ origin: camera.position, facing: camera.quaternion });
        var vt = new THREE.VideoTexture(video);
        ['cafe', 'street'].forEach(function (k) {
          var g = new THREE.Group(); g.visible = false; scene.add(g);
          var m = null;
          if (k === 'cafe') {
            var mat = new THREE.MeshBasicMaterial({ map: vt, transparent: true, opacity: 1, depthWrite: false });
            if (DEBUG) mat.color.setRGB(1, 0.6, 0.6);
            m = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat); g.add(m);
          }
          faces[k] = { g: g, m: m, sized: false };
        });
      },
      listeners: [
        { event: 'reality.imagefound', process: place },
        { event: 'reality.imageupdated', process: place },
        { event: 'reality.imagelost', process: function (e) { var d = e.detail; dbg[d.name] = 'lost(고정 유지)'; } },
      ],
    };
  }
  // 타깃 자리에 판을 놓는다. 가로 그림을 90° 돌려 세로 타깃으로 만들었으므로(isRotated), 엔진이 세로로 알려 주면 영상 판을 90° 돌려 맞춤
  function place(e) {
    var d = e.detail, f = faces[d.name]; if (!f) return;
    f.g.position.copy(d.position); f.g.quaternion.copy(d.rotation); f.g.scale.set(d.scale, d.scale, d.scale); f.g.visible = true;
    if (f.m && !f.sized) {
      var w = d.scaledWidth, h = d.scaledHeight;
      if (w < h) { f.m.scale.set(h, w, 1); f.m.rotation.z = ROT * Math.PI / 2; } else f.m.scale.set(w, h, 1);
      f.sized = true;
    }
    seen[d.name] = Date.now(); dbg[d.name] = 'tracked ' + (d.scaledWidth || 0).toFixed(2) + 'x' + (d.scaledHeight || 0).toFixed(2);
    if (video.paused) video.play().catch(function () {});
  }
  // 자막: 지금 비추는 면의 대사를 4.5초마다 하나씩
  setInterval(function () {
    var now = Date.now(), vis = Object.keys(seen).filter(function (k) { return now - seen[k] < 1500; });
    var next = cur && vis.indexOf(cur) >= 0 ? cur : vis[0] || null;
    if (next !== cur) { cur = next; li = 0; lt = now; }
    else if (cur && now - lt > 4500) { li = (li + 1) % LINES[cur].length; lt = now; }
    var s = $('sub'); if (cur) { s.textContent = LINES[cur][li]; s.classList.add('on'); } else s.classList.remove('on');
    $('hint').hidden = !!cur || $('start').style.display !== 'none';
    if (DEBUG) { $('dbg').hidden = false; $('dbg').textContent = JSON.stringify(dbg, null, 1); }
  }, 300);

  function boot() {
    XR8.XrController.configure({ imageTargetData: [], disableWorldTracking: !SLAM });
    Promise.all(['cafe', 'street'].map(function (n) { return fetch('image-targets/' + n + '.json').then(function (r) { return r.json(); }); })).then(function (data) {
      XR8.XrController.configure({ imageTargetData: data, disableWorldTracking: !SLAM });
      XR8.addCameraPipelineModules([XR8.GlTextureRenderer.pipelineModule(), XR8.Threejs.pipelineModule(), XR8.XrController.pipelineModule(), wallModule(),
        { name: 'err', onCameraStatusChange: function (x) { if (x.status === 'failed') $('err').textContent = '카메라를 열지 못했습니다.'; }, onException: function (x) { try { $('err').textContent = (x && x.message) || JSON.stringify(x).slice(0, 300); } catch (e) { $('err').textContent = String(x); } } }]);
      XR8.run({ canvas: $('c') });
    });
  }
  $('go').addEventListener('click', function () {
    video.play().then(function () { video.pause(); }).catch(function () {});   // 첫 터치로 재생 권한
    // 공간 고정(SLAM)은 폰 기울기 센서가 필요 — 아이폰은 이 터치 안에서 허락을 받아야 한다
    var asks = [window.DeviceOrientationEvent, window.DeviceMotionEvent].filter(function (E) { return SLAM && E && typeof E.requestPermission === 'function'; }).map(function (E) { return E.requestPermission().catch(function () { return 'denied'; }); });
    Promise.all(asks).then(function (r) {
      if (r.indexOf('denied') >= 0) { $('err').textContent = '동작 및 방향 접근을 허용해야 그림이 제자리에 고정됩니다. 다시 시작을 눌러 허용해 주세요.'; return; }
      $('start').style.display = 'none'; $('hint').hidden = false;
      if (window.XR8) boot(); else window.addEventListener('xrloaded', boot);
    });
  });
})();
</script>
</body>
</html>
