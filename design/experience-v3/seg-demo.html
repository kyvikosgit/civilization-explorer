<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>탐사 도구 시험 · 텀블러</title>
<!-- 11/26 '탐사 도구' 시험 (3판: 흐림 필터 없앰 · 작은 그림에서 계산 — 폰에서 터지던 것) — 화면 가운데 조준점을 물체에 대면 그 물체 실루엣만 테두리가 빛남(게임식 하이라이트)
     물체 분할 AI(YOLO11n-seg 320, tools/seg — 텀블러 한 바퀴 영상 7초 → 장면 98장 자동 윤곽 → 학습)
     2판(버벅임 줄임): 카메라는 <video> 로 그대로(매끄럽게) · 분석은 폰 그래픽 칩(WebGPU, 안 되면 WebGL → CPU) · 320 크기
                       빛 테두리는 분석이 끝날 때만 한 번 만들어 두고, 매 장면은 그 그림을 띄우기만(스캔 빛만 움직임) -->
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Freesentation/Freesentation.css">
<style>
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:Freesentation,-apple-system,sans-serif;overflow:hidden}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:28px;text-align:center;background:#000;z-index:20}
.start h1{margin:0;font-size:22px}.start p{margin:0;color:#aaa;font-size:15px;line-height:1.6;word-break:keep-all}
.start button{font:700 17px inherit;background:#fff;color:#111;border:0;border-radius:12px;padding:15px 30px}
.reticle{position:fixed;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;z-index:5;pointer-events:none;transition:transform .25s}
.reticle i{position:absolute;width:12px;height:12px;border:2px solid rgba(255,255,255,.85)}
.reticle i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}.reticle i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
.reticle i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}.reticle i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
.reticle b{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:#fff}
.reticle.on{transform:scale(.8)}.reticle.on i{border-color:#bfe8b9}
.ring{position:fixed;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;z-index:5;pointer-events:none}
.ring circle{fill:none;stroke:#bfe8b9;stroke-width:3;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.msg{position:fixed;left:0;right:0;bottom:calc(40px + env(safe-area-inset-bottom));text-align:center;z-index:6}
.msg span{background:rgba(0,0,0,.55);padding:10px 16px;border-radius:20px;font-size:15px}
.ok{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%) scale(.9);background:rgba(40,70,40,.92);padding:16px 24px;border-radius:16px;font-size:20px;font-weight:700;opacity:0;transition:.25s;z-index:7}
.ok.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#dbg{position:fixed;left:8px;top:calc(8px + env(safe-area-inset-top));font:11px ui-monospace,Menlo,monospace;color:rgba(255,255,255,.6);z-index:6}
.hid{display:none!important}
</style>
</head>
<body>
<video id="v" playsinline muted autoplay></video>
<canvas id="fx"></canvas>
<div class="reticle hid" id="ret"><i></i><i></i><i></i><i></i><b></b></div>
<svg class="ring hid" id="ring" viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" stroke-dasharray="176" stroke-dashoffset="176" id="ringc"/></svg>
<div class="msg hid" id="msg"><span>조준점을 텀블러에 대 보세요</span></div>
<div class="ok" id="ok">인식됨 ✓ 텀블러</div>
<div id="dbg"></div>
<div class="start" id="start"><h1>탐사 도구 시험</h1><p>화면 가운데 조준점을 텀블러에 대면<br>텀블러 모양 그대로 테두리가 빛납니다. 어느 각도에서든.</p><button id="go" type="button">카메라 켜기</button><p id="err"></p></div>
<script type="module">
const ORT = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.31.1/dist/';
const $ = (id) => document.getElementById(id);
const S = 320, P = 80, NC = 1, NM = 32, MODEL = 'model/demo/tumbler-seg-320.onnx?v=1126b';
let sess, ort, ep = '', hitT = 0, aimT = 0, done = false, hit = false, prevHit = false;
const v = $('v'), fx = $('fx'), fxx = fx.getContext('2d');
const inp = document.createElement('canvas'); inp.width = inp.height = S; const ix = inp.getContext('2d', { willReadFrequently: true });
const tensor = new Float32Array(3 * S * S), coef = new Float32Array(NM);
// 11/26 3판(폰에서 텀블러에 대면 페이지가 터지던 것): 화면 크기 캔버스 3장 + 흐림 필터(ctx.filter)를 분석마다 → 아이폰 메모리 초과로 새로 고침.
//   이제 실루엣 · 빛 테두리를 160칸 작은 그림에서 직접 계산(필터 없음)하고, 화면에는 늘려 그리기만. 분석은 초당 약 15번으로 제한
const Q = 160;
let W = 0, H = 0, dpr = Math.min(2, devicePixelRatio || 1);
const mask = document.createElement('canvas'), glow = document.createElement('canvas'); mask.width = mask.height = glow.width = glow.height = Q;
const mc = mask.getContext('2d'), gc = glow.getContext('2d');
const mI = mc.createImageData(Q, Q), gI = gc.createImageData(Q, Q);
const lg80 = new Float32Array(P * P), al = new Float32Array(Q * Q), bl = new Float32Array(Q * Q), sl = new Float32Array(Q * Q), tmp = new Float32Array(Q * Q);
let geo = { px: 0, py: 0, k: 1 };
function size() { W = innerWidth; H = innerHeight; fx.width = W * dpr; fx.height = H * dpr; }
addEventListener('resize', size);
function boxBlur(src, dst, r) {   // 가로 · 세로 상자 흐림(작은 그림이라 가벼움)
  const n = 2 * r + 1;
  for (let y = 0; y < Q; y++) { let acc = 0; for (let x = -r; x <= r; x++) acc += src[y * Q + Math.min(Q - 1, Math.max(0, x))];
    for (let x = 0; x < Q; x++) { tmp[y * Q + x] = acc / n; acc += src[y * Q + Math.min(Q - 1, x + r + 1)] - src[y * Q + Math.max(0, x - r)]; } }
  for (let x = 0; x < Q; x++) { let acc = 0; for (let y = -r; y <= r; y++) acc += tmp[Math.min(Q - 1, Math.max(0, y)) * Q + x];
    for (let y = 0; y < Q; y++) { dst[y * Q + x] = acc / n; acc += tmp[Math.min(Q - 1, y + r + 1) * Q + x] - tmp[Math.max(0, y - r) * Q + x]; } }
}

async function makeSession() {
  // 폰 그래픽 칩 먼저(WebGPU → WebGL), 안 되면 CPU
  for (const [mod, eps] of [['ort.webgpu.min.mjs', ['webgpu']], ['ort.min.mjs', ['webgl']], ['ort.wasm.min.mjs', ['wasm']]]) {
    try {
      if (eps[0] === 'webgpu' && !navigator.gpu) continue;
      ort = await import(ORT + mod); ort.env.wasm.wasmPaths = ORT; ort.env.wasm.numThreads = 1;
      const s = await ort.InferenceSession.create(MODEL, { executionProviders: eps, graphOptimizationLevel: 'all' });
      await s.run({ images: new ort.Tensor('float32', new Float32Array(3 * S * S), [1, 3, S, S]) });   // 미리 한 번(첫 분석 지연 없애기)
      ep = eps[0]; return s;
    } catch (e) { console.warn('ep', eps[0], e?.message || e); }
  }
  throw new Error('모델을 열지 못했습니다');
}
async function boot() {
  $('go').disabled = true; $('go').textContent = '준비 중…';
  try {
    const st = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    v.srcObject = st; await v.play();
    sess = await makeSession();
  } catch (e) { $('err').textContent = '카메라나 모델을 열지 못했습니다: ' + (e.message || e); $('go').disabled = false; $('go').textContent = '다시 시도'; return; }
  $('start').classList.add('hid'); ['ret', 'ring', 'msg'].forEach((k) => $(k).classList.remove('hid')); size();
  requestAnimationFrame(frame); analyze();
}
$('go').addEventListener('click', boot);

// 화면에 보이는(가득 채운) 영역 = 영상의 어느 부분인지
function view() {
  const vw = v.videoWidth, vh = v.videoHeight, s = Math.max(W / vw, H / vh);
  return { sx: (vw - W / s) / 2, sy: (vh - H / s) / 2, sw: W / s, sh: H / s };
}
// 분석: 보이는 영역 → 320 정사각(가장자리 회색) → 실루엣 → 빛 테두리 그림. 끝나면 바로 다음
async function analyze() {
  if (!v.videoWidth) { setTimeout(analyze, 50); return; }
  const t0 = performance.now(), r = view();
  const k = S / Math.max(W, H), lw = W * k, lh = H * k, px = (S - lw) / 2, py = (S - lh) / 2;
  ix.fillStyle = '#727272'; ix.fillRect(0, 0, S, S); ix.drawImage(v, r.sx, r.sy, r.sw, r.sh, px, py, lw, lh);
  const d = ix.getImageData(0, 0, S, S).data, n = S * S;
  for (let i = 0; i < n; i++) { tensor[i] = d[i * 4] / 255; tensor[i + n] = d[i * 4 + 1] / 255; tensor[i + 2 * n] = d[i * 4 + 2] / 255; }
  let out;
  try { out = await sess.run({ images: new ort.Tensor('float32', tensor, [1, 3, S, S]) }); } catch (e) { setTimeout(analyze, 200); return; }
  const o0 = out.output0.getData ? await out.output0.getData() : out.output0.data, o1 = out.output1.getData ? await out.output1.getData() : out.output1.data, N = out.output0.dims[2];
  try { out.output0.dispose?.(); out.output1.dispose?.(); } catch {}
  let best = -1, bs = 0.6;   // 11/26 엉뚱한 곳(비슷한 밝기)에 반응하던 것 — 확신 60% 넘을 때만
  for (let j = 0; j < N; j++) { const s = o0[4 * N + j]; if (s > bs) { bs = s; best = j; } }
  if (best >= 0) {
    const bx = o0[best], by = o0[N + best], bw = o0[2 * N + best], bh = o0[3 * N + best], q = P / S, PP = P * P;
    for (let m = 0; m < NM; m++) coef[m] = o0[(4 + NC + m) * N + best];
    const x0 = (bx - bw / 2) * q - 2, x1 = (bx + bw / 2) * q + 2, y0 = (by - bh / 2) * q - 2, y1 = (by + bh / 2) * q + 2;
    for (let y = 0; y < P; y++) for (let x = 0; x < P; x++) {
      const pi = y * P + x; let a = -12;
      if (x >= x0 && x <= x1 && y >= y0 && y <= y1) { a = 0; for (let m = 0; m < NM; m++) a += coef[m] * o1[m * PP + pi]; }
      lg80[pi] = a;
    }
    // 80 → 160: 값(로짓)을 부드럽게 늘린 뒤 실루엣으로(계단 없이 또렷한 경계)
    for (let y = 0; y < Q; y++) { const fy = Math.min(P - 1.001, Math.max(0, (y + 0.5) / 2 - 0.5)), y8 = fy | 0, ty = fy - y8;
      for (let x = 0; x < Q; x++) { const fxp = Math.min(P - 1.001, Math.max(0, (x + 0.5) / 2 - 0.5)), x8 = fxp | 0, tx = fxp - x8, i = y8 * P + x8;
        const l = (lg80[i] * (1 - tx) + lg80[i + 1] * tx) * (1 - ty) + (lg80[i + P] * (1 - tx) + lg80[i + P + 1] * tx) * ty;
        al[y * Q + x] = 1 / (1 + Math.exp(-l * 1.6)); } }
    boxBlur(al, bl, 4); boxBlur(al, sl, 1);   // bl = 바깥 번짐용 · sl = 선(경계 양쪽 1칸씩 → 늘려도 계단 없이)
    const md = mI.data, gd = gI.data;
    for (let i = 0; i < Q * Q; i++) {
      const a = al[i], edge = Math.min(1, Math.max(0, 1 - Math.abs(sl[i] - 0.5) / 0.3) * 1.4), halo = Math.max(0, bl[i] - a) * 2.2;
      md[i * 4] = md[i * 4 + 1] = md[i * 4 + 2] = 255; md[i * 4 + 3] = a * 255;
      const e = Math.min(1, edge + halo);   // 선(흰) + 바깥 번짐(연두)
      gd[i * 4] = 214 + 41 * edge; gd[i * 4 + 1] = 245 + 10 * edge; gd[i * 4 + 2] = 207 + 48 * edge; gd[i * 4 + 3] = e * 255;
    }
    mc.putImageData(mI, 0, 0); gc.putImageData(gI, 0, 0);
    geo = { px, py, k };
    // 조준점이 실루엣 안인가
    const cx = Math.min(Q - 1, Math.round((W / 2 * k + px) * Q / S)), cy = Math.min(Q - 1, Math.round((H / 2 * k + py) * Q / S));
    const h1 = al[cy * Q + cx] > 0.5;
    hit = h1 && prevHit; prevHit = h1;   // 두 번 연속 잡혀야(한 번 튄 것은 무시)
    if (hit) hitT = performance.now();
  } else { hit = false; prevHit = false; }
  $('dbg').textContent = `${ep} · ${Math.round(performance.now() - t0)}ms`;
  const dt = performance.now() - t0; setTimeout(analyze, Math.max(0, 66 - dt));   // 초당 약 15번(폰 발열 · 메모리)
}
let glowA = 0;
function frame() {
  requestAnimationFrame(frame);
  const on = performance.now() - hitT < 350;   // 잠깐 놓쳐도 깜빡이지 않게
  glowA += ((on ? 1 : 0) - glowA) * 0.2;
  $('ret').classList.toggle('on', on);
  if (on && !done) { if (!aimT) aimT = performance.now(); } else if (!on) aimT = 0;
  const p = aimT ? Math.min(1, (performance.now() - aimT) / 800) : 0;
  $('ringc').setAttribute('stroke-dashoffset', String(176 * (1 - p)));
  if (p >= 1 && !done) { done = true; $('ok').classList.add('on'); navigator.vibrate?.(30); setTimeout(() => { $('ok').classList.remove('on'); done = false; aimT = 0; }, 1800); }
  fxx.setTransform(dpr, 0, 0, dpr, 0, 0); fxx.globalCompositeOperation = 'source-over'; fxx.globalAlpha = 1; fxx.clearRect(0, 0, W, H);
  if (glowA < 0.02) return;
  // 스캔 빛: 실루엣 안을 위에서 아래로(그라데이션 띠를 실루엣 모양으로 오림)
  const t = performance.now() / 1000, y = H * ((t * 0.55) % 1.3 - 0.15);
  const g = fxx.createLinearGradient(0, y - 60, 0, y + 60);
  g.addColorStop(0, 'rgba(214,245,207,0)'); g.addColorStop(0.5, 'rgba(214,245,207,.32)'); g.addColorStop(1, 'rgba(214,245,207,0)');
  fxx.fillStyle = g; fxx.fillRect(0, y - 60, W, 120);
  const gx = -geo.px / geo.k, gy = -geo.py / geo.k, gs = S / geo.k;   // 160칸 그림 → 화면 자리
  fxx.imageSmoothingEnabled = true; fxx.imageSmoothingQuality = 'high';
  fxx.globalCompositeOperation = 'destination-in'; fxx.drawImage(mask, gx, gy, gs, gs);
  fxx.globalCompositeOperation = 'source-over'; fxx.globalAlpha = glowA; fxx.drawImage(glow, gx, gy, gs, gs); fxx.globalAlpha = 1;
}
</script>
</body>
</html>
