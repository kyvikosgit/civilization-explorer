<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>탐사 도구 시험 · 텀블러</title>
<!-- 11/26 '탐사 도구' 시험 (4판: 실루엣을 카메라 화면의 실제 경계에 맞춰 다듬음 · 흐림 필터 없음) — 화면 가운데 조준점을 물체에 대면 그 물체 실루엣만 테두리가 빛남(게임식 하이라이트)
     물체 분할 AI(YOLO11n-seg 320, tools/seg — 텀블러 한 바퀴 영상 7초 → 장면 98장 자동 윤곽 → 학습)
     2판(버벅임 줄임): 카메라는 <video> 로 그대로(매끄럽게) · 분석은 폰 그래픽 칩(WebGPU, 안 되면 WebGL → CPU) · 320 크기
                       빛 테두리는 분석이 끝날 때만 한 번 만들어 두고, 매 장면은 그 그림을 띄우기만(스캔 빛만 움직임) -->
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Freesentation/Freesentation.css">
<style>
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:Freesentation,-apple-system,sans-serif;overflow:hidden}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:28px;text-align:center;background:#000;z-index:20}
.start h1{margin:0;font-size:22px}.start p{margin:0;color:#aaa;font-size:15px;line-height:1.6;word-break:keep-all}
.start button{font:700 17px inherit;background:#fff;color:#111;border:0;border-radius:12px;padding:15px 30px}
.reticle{position:fixed;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;z-index:5;pointer-events:none;transition:transform .25s}
.reticle i{position:absolute;width:12px;height:12px;border:2px solid rgba(255,255,255,.85)}
.reticle i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}.reticle i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
.reticle i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}.reticle i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
.reticle b{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:#fff}
.reticle.on{transform:scale(.8)}.reticle.on i{border-color:#bfe8b9}
.ring{position:fixed;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;z-index:5;pointer-events:none}
.ring circle{fill:none;stroke:#bfe8b9;stroke-width:3;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.msg{position:fixed;left:0;right:0;bottom:calc(40px + env(safe-area-inset-bottom));text-align:center;z-index:6}
.msg span{background:rgba(0,0,0,.55);padding:10px 16px;border-radius:20px;font-size:15px}
.ok{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%) scale(.9);background:rgba(40,70,40,.92);padding:16px 24px;border-radius:16px;font-size:20px;font-weight:700;opacity:0;transition:.25s;z-index:7;text-align:center;pointer-events:none}
.ok button{display:block;margin:12px auto 0;font:600 15px inherit;background:#fff;color:#1d331b;border:0;border-radius:10px;padding:10px 18px}
.ok.on{pointer-events:auto}
.mode{position:fixed;right:10px;top:calc(10px + env(safe-area-inset-top));z-index:8;display:flex;background:rgba(0,0,0,.55);border-radius:999px;padding:3px}
.mode button{font:600 14px Freesentation,sans-serif;color:#fff;background:none;border:0;border-radius:999px;padding:8px 14px}
.mode button.on{background:#fff;color:#111}
.ok.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#dbg{position:fixed;left:8px;top:calc(8px + env(safe-area-inset-top));font:11px ui-monospace,Menlo,monospace;color:rgba(255,255,255,.6);z-index:6}
.hid{display:none!important}
</style>
</head>
<body>
<video id="v" playsinline muted autoplay></video>
<canvas id="fx"></canvas>
<div class="reticle hid" id="ret"><i></i><i></i><i></i><i></i><b></b></div>
<svg class="ring hid" id="ring" viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" stroke-dasharray="176" stroke-dashoffset="176" id="ringc"/></svg>
<div class="msg hid" id="msg"><span>조준점을 텀블러에 대 보세요</span></div>
<div class="ok" id="ok">인식됨 ✓ 텀블러<button id="again" type="button">다시 비춰 보기</button></div>
<div id="dbg"></div>
<div class="start" id="start"><h1>탐사 도구 시험</h1><p>화면 가운데 조준점을 텀블러에 대면<br>텀블러 모양 그대로 빛으로 칠해집니다. 어느 각도에서든.</p><button id="go" type="button">카메라 켜기</button><p id="err"></p></div>
<script type="module">
const ORT = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.31.1/dist/';
const $ = (id) => document.getElementById(id);
const S = 320, P = 80, NC = 1, NM = 32, MODEL = 'model/demo/tumbler-seg-320.onnx?v=1126b';
const SHOW = new URLSearchParams(location.search).has('show');   // 시험용: 조준 없이도 잡히면 테두리 표시
const MODE = 'fill';   // 11/26 확정: 색칠(테두리보다 가볍고 가장자리 오차가 덜 보임). 테두리 코드는 남겨 둠(MODE = 'line')
let stopped = false;   // 인식되면 AI 멈춤(폰 부담) — '다시 비춰 보기'로 다시
let runs = 0, recogT = 0;
function mark(state) { try { sessionStorage.setItem('segLog', JSON.stringify({ t: Date.now(), ep, runs, state, since: recogT ? Math.round((Date.now() - recogT) / 1000) : -1 })); } catch {} }
const prevLog = (() => { try { return JSON.parse(sessionStorage.getItem('segLog')); } catch { return null; } })();
addEventListener('pagehide', () => { try { sessionStorage.removeItem('segLog'); } catch {} });   // 정상으로 닫힘 = 기록 지움
let sess, ort, ep = '', hitT = 0, aimT = 0, done = false, hit = false, prevHit = false;
const v = $('v'), fx = $('fx'), fxx = fx.getContext('2d');
const inp = document.createElement('canvas'); inp.width = inp.height = S; const ix = inp.getContext('2d', { willReadFrequently: true });
const tensor = new Float32Array(3 * S * S), coef = new Float32Array(NM);
// 11/26 4판: 테두리를 실제 경계에 붙임 — AI 실루엣(80칸, 거침)을 카메라 화면(2배 해상도)의 색 경계에 맞춰 다듬는다(가이드 필터 · 사진 앱 누끼와 같은 방식)
//   텀블러 둘레 상자 안만 계산 · 흐림 필터(ctx.filter) 없음 · 화면 크기 캔버스 없음(3판: 폰에서 터지던 것)
const G = S * 2, MAXA = G * G;
let W = 0, H = 0, dpr = Math.min(2, devicePixelRatio || 1);
const gcv = document.createElement('canvas'); gcv.width = gcv.height = G; const gx2 = gcv.getContext('2d', { willReadFrequently: true });
const mask = document.createElement('canvas'), glow = document.createElement('canvas');
mask.width = mask.height = glow.width = glow.height = G;   // 11/26 6판: 크기 고정 — 분석마다 새 그림(ImageData)을 만들지 않음(아이폰 메모리)
const mc = mask.getContext('2d'), gc = glow.getContext('2d');
const mImg = mc.createImageData(G, G), gImg = gc.createImageData(G, G);
let inT = null;   // 입력 텐서도 한 번만
const lg80 = new Float32Array(P * P);
const F = () => new Float32Array(MAXA);
const gI_ = F(), pP = F(), t1 = F(), t2 = F(), mI_ = F(), mP = F(), aA = F(), bB = F(), al = F(), sl = F(), bl = F(), integ = new Float64Array((G + 1) * (G + 1));
let geo = null;   // { x, y, w, h } 다듬은 실루엣 자리(G 좌표) + 그때의 px · py · k
function size() { W = innerWidth; H = innerHeight; fx.width = W * dpr; fx.height = H * dpr; }
addEventListener('resize', size);
function boxMean(src, dst, w, h, r) {   // 상자 평균(적분 영상) — 가장자리는 들어간 칸 수로 나눔
  const w1 = w + 1;
  for (let x = 0; x <= w; x++) integ[x] = 0;
  for (let y = 0; y < h; y++) { let row = 0; integ[(y + 1) * w1] = 0;
    for (let x = 0; x < w; x++) { row += src[y * w + x]; integ[(y + 1) * w1 + x + 1] = integ[y * w1 + x + 1] + row; } }
  for (let y = 0; y < h; y++) { const ya = Math.max(0, y - r), yb = Math.min(h, y + r + 1);
    for (let x = 0; x < w; x++) { const xa = Math.max(0, x - r), xb = Math.min(w, x + r + 1);
      dst[y * w + x] = (integ[yb * w1 + xb] - integ[ya * w1 + xb] - integ[yb * w1 + xa] + integ[ya * w1 + xa]) / ((yb - ya) * (xb - xa)); } }
}

async function makeSession() {
  // 폰 그래픽 칩 먼저(WebGPU → WebGL), 안 되면 CPU
  const want = new URLSearchParams(location.search).get('ep');   // 시험: ?ep=wasm 이면 CPU 로만
  for (const [mod, eps] of [['ort.webgpu.min.mjs', ['webgpu']], ['ort.min.mjs', ['webgl']], ['ort.wasm.min.mjs', ['wasm']]].filter(([, e]) => !want || e[0] === want)) {
    try {
      if (eps[0] === 'webgpu' && !navigator.gpu) continue;
      ort = await import(ORT + mod); ort.env.wasm.wasmPaths = ORT; ort.env.wasm.numThreads = 1;
      const s = await ort.InferenceSession.create(MODEL, { executionProviders: eps, graphOptimizationLevel: 'all' });
      await s.run({ images: new ort.Tensor('float32', new Float32Array(3 * S * S), [1, 3, S, S]) });   // 미리 한 번(첫 분석 지연 없애기)
      ep = eps[0]; return s;
    } catch (e) { console.warn('ep', eps[0], e?.message || e); }
  }
  throw new Error('모델을 열지 못했습니다');
}
async function boot() {
  $('go').disabled = true; $('go').textContent = '준비 중…';
  try {
    const st = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    v.srcObject = st; await v.play();
    sess = await makeSession();
  } catch (e) { $('err').textContent = '카메라나 모델을 열지 못했습니다: ' + (e.message || e); $('go').disabled = false; $('go').textContent = '다시 시도'; return; }
  $('start').classList.add('hid'); ['ret', 'ring', 'msg'].forEach((k) => $(k).classList.remove('hid')); size();
  requestAnimationFrame(frame); analyze();
}
$('go').addEventListener('click', boot);
if (prevLog && Date.now() - prevLog.t < 120000) $('err').textContent = `직전에 페이지가 다시 열림 — ${prevLog.ep} · 분석 ${prevLog.runs}번 · 마지막 상태 ${prevLog.state}${prevLog.since >= 0 ? ` · 인식 ${prevLog.since}초 뒤` : ''}`;
setInterval(() => { if (sess || stopped) mark(stopped ? (sess ? 'stopped' : 'freed') : 'run'); }, 2000);
async function freeEngine() {   // 인식 뒤 = 계산이 끝날 때까지 기다렸다가 AI 를 내려 그래픽 메모리를 돌려줌
  clearTimeout(timer); while (analyzing) await new Promise((r) => setTimeout(r, 30));
  if (!stopped || !sess) return; const s0 = sess; sess = null; inT = null; mark('freed');
  try { await s0.release(); } catch {}
}
$('again').addEventListener('click', async () => {
  $('ok').classList.remove('on'); done = false; aimT = 0; hitT = 0; prevHit = false; geo = null;
  if (!stopped) return;
  $('again').disabled = true;
  try { if (!sess) sess = await makeSession(); } catch (e) { $('dbg').textContent = '모델 다시 열기 실패'; }
  $('again').disabled = false; stopped = false; clearTimeout(timer); analyze();
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && !stopped && sess) { clearTimeout(timer); analyze(); } });

// 화면에 보이는(가득 채운) 영역 = 영상의 어느 부분인지
function view() {
  const vw = v.videoWidth, vh = v.videoHeight, s = Math.max(W / vw, H / vh);
  return { sx: (vw - W / s) / 2, sy: (vh - H / s) / 2, sw: W / s, sh: H / s };
}
// 분석: 보이는 영역 → 320 정사각(가장자리 회색) → 실루엣 → 빛 테두리 그림. 끝나면 바로 다음
async function analyze() {
  if (stopped || document.hidden || !sess) return;   // 인식 뒤 · 화면 꺼짐 = 계산 안 함
  if (analyzing) return; analyzing = true;
  try { await analyzeOnce(); } finally { analyzing = false; }
  if (stopped || document.hidden) return;
  clearTimeout(timer); timer = setTimeout(analyze, Math.max(33, lastDt * 1.5));   // 폰 속도에 맞춤: 빠른 폰 초당 ~30번, 느린 폰은 계산 시간의 1.5배 쉼(계속 꽉 차게 돌지 않게)
}
let analyzing = false, lastDt = 30, timer = 0;
async function analyzeOnce() {
  if (!v.videoWidth) { await new Promise((r) => setTimeout(r, 50)); return; }
  const t0 = performance.now(), r = view();
  const k = S / Math.max(W, H), lw = W * k, lh = H * k, px = (S - lw) / 2, py = (S - lh) / 2;
  ix.fillStyle = '#727272'; ix.fillRect(0, 0, S, S); ix.drawImage(v, r.sx, r.sy, r.sw, r.sh, px, py, lw, lh);
  const d = ix.getImageData(0, 0, S, S).data, n = S * S;
  for (let i = 0; i < n; i++) { tensor[i] = d[i * 4] / 255; tensor[i + n] = d[i * 4 + 1] / 255; tensor[i + 2 * n] = d[i * 4 + 2] / 255; }
  let out;
  if (!inT) inT = new ort.Tensor('float32', tensor, [1, 3, S, S]);
  try { out = await sess.run({ images: inT }); } catch (e) { await new Promise((r) => setTimeout(r, 200)); return; }
  const o0 = out.output0.getData ? await out.output0.getData() : out.output0.data, o1 = out.output1.getData ? await out.output1.getData() : out.output1.data, N = out.output0.dims[2];
  try { out.output0.dispose?.(); out.output1.dispose?.(); } catch {}
  let best = -1, bs = 0.6;   // 11/26 엉뚱한 곳(비슷한 밝기)에 반응하던 것 — 확신 60% 넘을 때만
  for (let j = 0; j < N; j++) { const s = o0[4 * N + j]; if (s > bs) { bs = s; best = j; } }
  if (best >= 0) {
    const bx = o0[best], by = o0[N + best], bw = o0[2 * N + best], bh = o0[3 * N + best], q = P / S, PP = P * P;
    for (let m = 0; m < NM; m++) coef[m] = o0[(4 + NC + m) * N + best];
    const x0 = (bx - bw / 2) * q - 2, x1 = (bx + bw / 2) * q + 2, y0 = (by - bh / 2) * q - 2, y1 = (by + bh / 2) * q + 2;
    for (let y = 0; y < P; y++) for (let x = 0; x < P; x++) {
      const pi = y * P + x; let a = -12;
      if (x >= x0 && x <= x1 && y >= y0 && y <= y1) { a = 0; for (let m = 0; m < NM; m++) a += coef[m] * o1[m * PP + pi]; }
      lg80[pi] = a;
    }
    // 다듬을 상자(G 좌표 = 모델 입력 2배): 텀블러 상자 + 여유
    const fill = MODE === 'fill', SC = fill ? 1 : 2, GS = S * SC;   // 색칠 = 모델 크기 그대로(가벼움) · 테두리 = 2배로 경계 다듬기
    const M = 14 * SC, rx = Math.max(0, Math.floor((bx - bw / 2) * SC - M)), ry = Math.max(0, Math.floor((by - bh / 2) * SC - M));
    const rw = Math.min(GS, Math.ceil((bx + bw / 2) * SC + M)) - rx, rh = Math.min(GS, Math.ceil((by + bh / 2) * SC + M)) - ry;
    if (rw > 8 && rh > 8) {
      // 같은 자리 카메라 화면을 2배 해상도로
      let gd = null; const A = rw * rh;
      if (!fill) { gx2.fillStyle = '#727272'; gx2.fillRect(rx, ry, rw, rh); gx2.drawImage(v, r.sx, r.sy, r.sw, r.sh, px * 2, py * 2, lw * 2, lh * 2); gd = gx2.getImageData(rx, ry, rw, rh).data; }
      for (let y = 0; y < rh; y++) { const fy = Math.min(P - 1.001, Math.max(0, (ry + y + 0.5) / (4 * SC) - 0.5)), y8 = fy | 0, ty = fy - y8;
        for (let x = 0; x < rw; x++) { const fxp = Math.min(P - 1.001, Math.max(0, (rx + x + 0.5) / (4 * SC) - 0.5)), x8 = fxp | 0, tx = fxp - x8, i = y8 * P + x8, o = y * rw + x;
          const l = (lg80[i] * (1 - tx) + lg80[i + 1] * tx) * (1 - ty) + (lg80[i + P] * (1 - tx) + lg80[i + P + 1] * tx) * ty;
          pP[o] = 1 / (1 + Math.exp(-l));
          if (gd) gI_[o] = (gd[o * 4] * 0.3 + gd[o * 4 + 1] * 0.55 + gd[o * 4 + 2] * 0.15) / 255; } }
      if (fill) {   // 색칠: AI 모양 그대로 반투명으로 덮기(계산 최소)
        for (let i = 0; i < A; i++) { const t = Math.min(1, Math.max(0, (pP[i] - 0.3) / 0.4)); al[i] = t * t * (3 - 2 * t); }
      } else {
      // 가이드 필터: 실루엣 경계를 화면의 밝기 경계에 붙임
      const R = 7, EPS = 0.0015;
      boxMean(gI_, mI_, rw, rh, R); boxMean(pP, mP, rw, rh, R);
      for (let i = 0; i < A; i++) { t1[i] = gI_[i] * pP[i]; t2[i] = gI_[i] * gI_[i]; }
      boxMean(t1, t1, rw, rh, R); boxMean(t2, t2, rw, rh, R);
      for (let i = 0; i < A; i++) { const va = t2[i] - mI_[i] * mI_[i], a = (t1[i] - mI_[i] * mP[i]) / (va + EPS); aA[i] = a; bB[i] = mP[i] - a * mI_[i]; }
      boxMean(aA, aA, rw, rh, R); boxMean(bB, bB, rw, rh, R);
      for (let i = 0; i < A; i++) { const qv = aA[i] * gI_[i] + bB[i], t = Math.min(1, Math.max(0, (qv - 0.32) / 0.36)); al[i] = t * t * (3 - 2 * t); }
      boxMean(al, sl, rw, rh, 1); boxMean(al, bl, rw, rh, 9);   // sl = 선 · bl = 바깥 번짐
      }
      const md = mImg.data, gq = gImg.data;
      if (fill) for (let i = 0; i < A; i++) {
        const a = al[i], o = ((ry + (i / rw | 0)) * G + rx + i % rw) * 4; md[o] = md[o + 1] = md[o + 2] = 255; md[o + 3] = a * 255;
        gq[o] = 191; gq[o + 1] = 232; gq[o + 2] = 185; gq[o + 3] = a * 120;   // 연두 반투명
      } else for (let i = 0; i < A; i++) {
        const o = ((ry + (i / rw | 0)) * G + rx + i % rw) * 4, a = al[i], edge = Math.min(1, Math.max(0, 1 - Math.abs(sl[i] - 0.5) / 0.32) * 1.5), halo = Math.max(0, bl[i] - a) * 2;
        md[o] = md[o + 1] = md[o + 2] = 255; md[o + 3] = a * 255;
        gq[o] = 214 + 41 * edge; gq[o + 1] = 245 + 10 * edge; gq[o + 2] = 207 + 48 * edge; gq[o + 3] = Math.min(1, edge + halo) * 255;
      }
      mc.putImageData(mImg, 0, 0, rx, ry, rw, rh); gc.putImageData(gImg, 0, 0, rx, ry, rw, rh);
      geo = { x: rx, y: ry, w: rw, h: rh, px, py, k, sc: SC };
      // 조준점이 실루엣 안인가
