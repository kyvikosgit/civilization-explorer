<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F4EFE4">
<!-- 11/09: 홈 화면에 추가하면 사파리 주소창 · 탭 없이 전체 화면으로(주소의 ?k= 그대로 저장됨) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="대기 접수">
<link rel="apple-touch-icon" href="kiosk-icon.png">
<link rel="manifest" href="kiosk.webmanifest">   <!-- start_url 을 두지 않음 — 추가할 때의 주소(?k= 포함) 그대로 열린다 -->
<title>입장 대기 접수</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="wait.css">
<style>
/* 현장 태블릿 — 가로 · 세로 모두 스크롤 없이 한 화면. 크기는 화면 비율 단위(--s)로: 가로는 높이, 세로는 폭이 기준
   인원 → 휴대폰 번호(숫자판) → 동의 → 접수 → 접수번호(10초 뒤 처음으로) */
:root{--s:min(1dvh,.75vw)}
html,body{height:100%;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{position:fixed;inset:0;width:100%}   /* 11/09: 끌어내림 · 튕김 막기 */
.wrap{height:100dvh;display:grid;grid-template-columns:1fr 1.1fr;gap:calc(var(--s)*4);padding:calc(var(--s)*4.5 + env(safe-area-inset-top)) calc(var(--s)*5) calc(var(--s)*4 + env(safe-area-inset-bottom))}
.info{display:flex;flex-direction:column;justify-content:space-between;min-height:0;padding:calc(var(--s)*1) 0}
.cap{font-size:calc(var(--s)*2);font-weight:700;color:var(--green)}
.info h1{font-size:calc(var(--s)*6.6);font-weight:800;line-height:1.18;margin-top:calc(var(--s)*1.4)}
.info .lead{margin-top:calc(var(--s)*2);font-size:calc(var(--s)*2.4);line-height:1.6;color:var(--sub)}
.now{margin-top:calc(var(--s)*3.6);display:flex;gap:calc(var(--s)*1.6)}
.now div{flex:1;padding:calc(var(--s)*2.2) calc(var(--s)*2.6);border-radius:calc(var(--s)*2);background:var(--card);border:1px solid var(--line)}
.now small{display:block;font-size:calc(var(--s)*1.8);color:var(--sub);font-weight:600}
.now b{display:block;margin-top:calc(var(--s)*.6);font-family:Paperlogy,sans-serif;font-size:calc(var(--s)*4.8);font-weight:800;line-height:1.1}
.now b i{font-style:normal;font-size:calc(var(--s)*2.3);margin-left:2px}
.steps{display:grid;gap:calc(var(--s)*1.4);font-size:calc(var(--s)*2.1);color:var(--sub)}
.steps li{list-style:none;display:flex;gap:calc(var(--s)*1.3);align-items:center}
.steps li span{display:grid;place-items:center;width:calc(var(--s)*3.4);height:calc(var(--s)*3.4);border-radius:50%;background:var(--green-l);color:var(--green);font-weight:800;font-size:calc(var(--s)*1.8);flex:none}
.form{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto;gap:calc(var(--s)*1.8);padding:calc(var(--s)*2.8);border-radius:calc(var(--s)*2.8);background:var(--card);border:1px solid var(--line);box-shadow:0 20px 50px -30px rgba(40,30,20,.35);min-height:0}
.lab{font-size:calc(var(--s)*1.9);font-weight:700;color:var(--sub)}
.party{display:grid;grid-template-columns:repeat(6,1fr);gap:calc(var(--s)*1);margin-top:calc(var(--s)*1)}
.party button{height:calc(var(--s)*7.4);border-radius:calc(var(--s)*1.5);border:1.5px solid var(--line);font-size:calc(var(--s)*2.9);font-weight:800;background:#fff}
.party button.on{background:var(--green);border-color:var(--green);color:#fff}
.phone{margin-top:calc(var(--s)*1);height:calc(var(--s)*8);border-radius:calc(var(--s)*1.5);border:1.5px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-family:Paperlogy,sans-serif;font-size:calc(var(--s)*3.9);font-weight:700}
.phone.ok{border-color:var(--green)}
.phone .ph{color:#BDB3A5}
.phone .dash{font-style:normal;margin:0 .22em}
.pad{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:calc(var(--s)*1);min-height:0}
.pad button{min-height:0;border-radius:calc(var(--s)*1.5);background:#F5F1E9;font-size:calc(var(--s)*3.3);font-weight:700}
.pad button:active{background:var(--line)}
.pad .fn{font-size:calc(var(--s)*2.2);color:var(--sub)}
.agree{display:flex;align-items:center;gap:calc(var(--s)*1.5);text-align:left;padding:calc(var(--s)*1.5) calc(var(--s)*1.8);border-radius:calc(var(--s)*1.5);background:#F5F1E9;font-size:calc(var(--s)*1.95);line-height:1.45}
.agree .box{flex:none;width:calc(var(--s)*3.3);height:calc(var(--s)*3.3);border-radius:calc(var(--s)*.9);border:2px solid #BDB3A5;display:grid;place-items:center;background:#fff}
.agree.on .box{background:var(--green);border-color:var(--green)}
.agree.on .box::after{content:"";width:36%;height:22%;border:solid #fff;border-width:0 0 3px 3px;transform:rotate(-45deg) translate(1px,-1px)}
.agree small{display:block;color:var(--sub);font-size:calc(var(--s)*1.6);margin-top:2px}
.go-wrap{position:relative}
.go{width:100%;min-height:calc(var(--s)*8);border-radius:calc(var(--s)*1.5);font-size:calc(var(--s)*2.8)}
/* 오류 문구는 단추 위에 겹쳐 띄운다 — 자리를 차지하지 않아 화면 높이가 변하지 않게 */
.err{position:absolute;left:0;right:0;bottom:calc(100% + var(--s)*.6);font-size:calc(var(--s)*1.9);font-weight:600;color:var(--warn);text-align:center;pointer-events:none}
.err:empty{display:none}
/* 접수 완료 */
.done{position:fixed;inset:0;display:none;place-items:center;background:var(--bg);z-index:10;padding:calc(var(--s)*4);text-align:center}
.done.on{display:grid;animation:fi .35s ease}
@keyframes fi{from{opacity:0}to{opacity:1}}
.done .cap{font-size:calc(var(--s)*2.6)}
.done .no{font-family:Paperlogy,sans-serif;font-size:calc(var(--s)*22);font-weight:800;line-height:1;margin:calc(var(--s)*2) 0 calc(var(--s)*.6);color:var(--green)}
.done .no i{font-style:normal;font-size:.35em;margin-left:6px;color:var(--ink)}
.done h2{font-size:calc(var(--s)*3.8);font-weight:800}
.done p{margin-top:calc(var(--s)*2);font-size:calc(var(--s)*2.5);line-height:1.6;color:var(--sub)}
.done .btn{margin-top:calc(var(--s)*4);min-width:calc(var(--s)*32);min-height:calc(var(--s)*7.4);font-size:calc(var(--s)*2.6);border-radius:calc(var(--s)*1.5)}
.done .count{margin-top:calc(var(--s)*1.6);font-size:calc(var(--s)*1.9);color:var(--sub)}
.closed{position:fixed;inset:0;display:none;place-items:center;background:var(--bg);z-index:9;text-align:center;padding:calc(var(--s)*4)}
.closed.on{display:grid}
.closed h2{font-size:calc(var(--s)*4.4)}
.closed p{margin-top:calc(var(--s)*1.6);font-size:calc(var(--s)*2.5);color:var(--sub)}
/* 세로 태블릿 — 위에 안내 한 줄 판, 아래 입력이 남은 높이를 다 쓴다(숫자판이 늘어난다) */
@media (orientation:portrait){
  :root{--s:min(.72dvh,1.05vw)}
  .wrap{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);gap:calc(var(--s)*3.6);padding:calc(var(--s)*5 + env(safe-area-inset-top)) calc(var(--s)*5) calc(var(--s)*5 + env(safe-area-inset-bottom))}
  .info{display:grid;grid-template-columns:1fr auto;align-items:end;gap:calc(var(--s)*3);padding:0}
  .info h1 br{display:none}
  .now{margin-top:0}
  .now div{min-width:calc(var(--s)*17)}
  .steps{display:none}
  .form{gap:calc(var(--s)*2.2);padding:calc(var(--s)*3.4)}
}

/* 11/06: 왼쪽(세로는 위) 판 = 행사 키비주얼 + 공식 로고(흰색) */
.info{position:relative;overflow:hidden;border-radius:calc(var(--s)*2.8);padding:calc(var(--s)*4) calc(var(--s)*4.2);color:#fff;background:var(--green) 64% 42%/cover no-repeat}
.info::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,18,20,.5) 0%,rgba(14,18,20,0) 26%,rgba(14,18,20,0) 40%,rgba(14,18,20,.62) 66%,rgba(14,18,20,.9) 100%)}
.info>*{position:relative}
.logo{display:block;width:calc(var(--s)*34);max-width:78%;height:auto;filter:drop-shadow(0 2px 10px rgba(0,0,0,.35))}
.info .cap{color:#fff;font-family:Paperlogy,sans-serif;font-size:calc(var(--s)*3.4);font-weight:800}
.info h1{color:#fff;margin-top:0}
.info .lead{color:rgba(255,255,255,.82)}
/* 대기 현황 칸은 그림 위에서도 읽히게 — 반투명 대신 불투명 크림 판 · 진한 글자 · 큰 숫자 */
.now div{background:var(--card);border:0;box-shadow:0 10px 28px -12px rgba(0,0,0,.55);color:var(--ink)}
.now small{color:var(--sub);font-size:calc(var(--s)*2);font-weight:700}
.now b{font-size:calc(var(--s)*5.6);color:var(--green)}
.now b i{color:var(--ink);font-size:calc(var(--s)*2.5);margin-left:calc(var(--s)*.9)}
.steps{margin-top:calc(var(--s)*3);color:rgba(255,255,255,.85)}
.steps li span{background:rgba(255,255,255,.18);color:#fff}
@media (orientation:portrait){
  .info{grid-template-columns:1fr auto;grid-template-rows:auto 1fr;min-height:calc(var(--s)*40);padding:calc(var(--s)*4)}
  .info>div:first-child{grid-column:1/-1}
  .info .bottom{grid-column:1/-1;align-self:end;display:grid;grid-template-columns:1fr auto;align-items:end;gap:calc(var(--s)*3)}
  .info .bottom .now{grid-row:1/3;grid-column:2}
  .info .bottom .steps{display:none}
  .logo{width:calc(var(--s)*30)}
}
/* 휴대폰 크기(태블릿 아님)로 열었을 때만 스크롤 허용 */
@media (max-width:600px){
  html,body{overflow:auto}
  :root{--s:1.9vw}
  .wrap{height:auto;min-height:100dvh;grid-template-rows:auto auto}
  .info{grid-template-columns:1fr}
  .pad{grid-auto-rows:calc(var(--s)*12)}
}
</style>
</head>
<body>
<div class="wrap">
  <section class="info">
    <div>
      <img class="logo" id="logo" alt="" hidden><p class="cap" id="cap"></p>
    </div>
    <div class="bottom">
      <h1>입장 대기 <br>접수</h1>
      <p class="lead">번호를 남기시면 입장 차례에<br>카카오톡 알림톡으로 알려 드립니다.</p>
      <div class="now"><div><small>지금 기다리는 팀</small><b><span id="teams">–</span><i>팀</i></b></div><div><small>대기 인원</small><b><span id="people">–</span><i>명</i></b></div></div>
      <ol class="steps">
        <li><span>1</span>인원과 휴대폰 번호를 입력해 주세요</li>
        <li><span>2</span>알림톡으로 접수번호와 현황 링크가 옵니다</li>
        <li><span>3</span>입장 차례 알림이 오면 입구로 와 주세요</li>
      </ol>
    </div>
  </section>

  <section class="form">
    <div><p class="lab">인원</p><div class="party" id="party"></div></div>
    <div><p class="lab">휴대폰 번호</p><div class="phone" id="phone"></div></div>
    <div class="pad" id="pad"></div>
    <button class="agree" id="agree" type="button" aria-pressed="false"><span class="box"></span><span>[필수] 개인정보 수집·이용에 동의합니다<small>항목: 휴대폰 번호 · 목적: 입장 순서 알림(알림톡·문자) · 보유: 당일 운영 종료 후 파기</small></span></button>
    <div class="go-wrap"><p class="err" id="err"></p><button class="btn go" id="go" type="button" disabled>대기 접수</button></div>
  </section>
</div>

<div class="done" id="done"><div>
  <p class="cap">접수되었습니다</p>
  <div class="no"><span id="dNo"></span><i>번</i></div>
  <h2 id="dAhead"></h2>
  <p>입장 차례가 되면 알림톡으로 알려 드립니다.<br>알림톡의 버튼에서 대기 현황을 보거나 취소할 수 있습니다.</p>
  <button class="btn" id="dOk" type="button">확인</button>
  <p class="count" id="dCount"></p>
</div></div>
<div class="closed" id="closed"><div><h2>지금은 대기 접수를 받지 않습니다</h2><p>현장 직원에게 문의해 주세요.</p></div></div>
<div class="toast" id="toast"></div>

<script type="module">
import { call, qs, say } from './wait.js';
const $ = (id) => document.getElementById(id);
const KEY = qs('k');
let maxParty = 6, party = 2, digits = '010', agree = false, busy = false;

function drawParty() {
  $('party').style.gridTemplateColumns = `repeat(${Math.min(maxParty, 6)},1fr)`;
  $('party').innerHTML = Array.from({ length: maxParty }, (_, i) => `<button type="button" data-n="${i + 1}" class="${i + 1 === party ? 'on' : ''}">${i + 1}${i + 1 === maxParty && maxParty >= 6 ? '+' : ''}</button>`).join('');
}
$('party').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; party = +b.dataset.n; drawParty(); check(); };
const fmt = (d) => d.length <= 3 ? d : d.length <= 7 ? `${d.slice(0, 3)}-${d.slice(3)}` : `${d.slice(0, 3)}-${d.slice(3, 7)}-${d.slice(7)}`;
const okPhone = () => /^01[016789]\d{7,8}$/.test(digits);
// 대시 양옆을 조금 띄운다(010 - 1234 - 5678 처럼 읽히게)
const dash = (t) => t.replace(/-/g, '<i class="dash">-</i>');
function drawPhone() { $('phone').innerHTML = digits.length > 3 ? dash(fmt(digits)) : `${dash(fmt(digits))}<span class="ph">${dash('-0000-0000')}</span>`; $('phone').classList.toggle('ok', okPhone()); }
$('pad').innerHTML = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '지움', '0', '←'].map((k) => `<button type="button" class="${k.length > 1 ? 'fn' : ''}" data-k="${k}">${k}</button>`).join('');
$('pad').onclick = (e) => {
  const b = e.target.closest('button'); if (!b) return; const k = b.dataset.k;
  if (k === '지움') digits = '010'; else if (k === '←') digits = digits.slice(0, -1); else if (digits.length < 11) digits += k;
  drawPhone(); check();
};
$('agree').onclick = () => { agree = !agree; $('agree').classList.toggle('on', agree); $('agree').setAttribute('aria-pressed', agree); check(); };
function check() { $('err').textContent = ''; $('go').disabled = !(okPhone() && agree && party >= 1); }

let doneT = 0;
function reset() { clearInterval(doneT); $('done').classList.remove('on'); party = 2; digits = '010'; agree = false; $('agree').classList.remove('on'); drawParty(); drawPhone(); check(); refresh(); }
$('go').onclick = async () => {
  if (busy) return; busy = true; $('go').disabled = true; $('go').textContent = '접수하는 중';
  try {
    const r = await call('join', { key: KEY, phone: digits, party, agree });
    $('dNo').textContent = r.no;
    $('dAhead').textContent = r.again ? `이미 접수된 번호입니다 · 내 앞 ${r.ahead}팀` : r.ahead ? `내 앞에 ${r.ahead}팀이 기다리고 있습니다` : '곧 입장하실 수 있습니다';
    $('done').classList.add('on');
    let n = 10; $('dCount').textContent = `${n}초 뒤 처음 화면으로`;
    doneT = setInterval(() => { n--; $('dCount').textContent = `${n}초 뒤 처음 화면으로`; if (n <= 0) reset(); }, 1000);
  } catch (e) {
    $('err').textContent = say(e.code);
    if (e.code === 'closed') $('closed').classList.add('on');
  } finally { busy = false; $('go').textContent = '대기 접수'; check(); }
};
$('dOk').onclick = reset;

// 행사 공식 로고 · 키비주얼(직원 설정 · wait_config) — 없으면 행사명 글자 · 초록 판
function brand(s) {
  $('cap').textContent = s.title;
  const L = $('logo');
  if (s.logo) { if (L.dataset.src !== s.logo) { L.dataset.src = s.logo; L.src = '/' + s.logo; L.alt = s.title; } L.hidden = false; $('cap').hidden = true; }
  else { L.hidden = true; $('cap').hidden = false; }
  document.querySelector('.info').style.backgroundImage = s.visual ? `url(/${s.visual})` : '';
  document.body.classList.toggle('has-visual', !!s.visual);
}
async function refresh() {
  try {
    const s = await call('summary', { key: KEY });
    brand(s); $('teams').textContent = s.teams; $('people').textContent = s.people;
    $('closed').classList.toggle('on', !s.open);
    if (s.max_party !== maxParty) { maxParty = s.max_party; party = Math.min(party, maxParty); drawParty(); }
  } catch (e) { if (e.code === 'bad_key') { $('err').textContent = say('bad_key'); $('go').disabled = true; } }
}
drawParty(); drawPhone(); check(); refresh();
setInterval(refresh, 15000);
// 태블릿을 오래 켜 둔다 — 화면이 꺼지지 않게
try { navigator.wakeLock?.request('screen'); document.addEventListener('visibilitychange', () => { if (!document.hidden) navigator.wakeLock?.request('screen').catch(() => {}); }); } catch {}
</script>
<script>
// 11/09: 무인 태블릿 — 두 손가락 확대 · 두 번 탭 확대 · 길게 눌러 메뉴 · 화면 끌기(새로고침 · 튕김)를 막는다. 입력칸 · 단추 누르기는 그대로
(() => {
  const no = (e) => e.preventDefault();
  ['gesturestart', 'gesturechange', 'gestureend'].forEach((t) => document.addEventListener(t, no, { passive: false }));
  document.addEventListener('contextmenu', no);
  document.addEventListener('touchmove', (e) => { if (e.touches.length > 1 || !e.target.closest('[data-scroll]')) e.preventDefault(); }, { passive: false });
  // 두 번 탭 확대는 touch-action:manipulation 으로 막는다(숫자 단추를 빠르게 눌러도 안 씹히게 touchend 는 건드리지 않음)
})();
</script>
</body>
</html>
