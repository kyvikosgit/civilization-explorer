<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F4EFE4">
<title>내 대기 현황</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="wait.css">
<style>
/* 손님 현황 — 알림톡 버튼으로 열린다(?t=토큰). 15초마다 새로 */
body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:calc(20px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom))}
/* 11/06: 행사 공식 로고 · 키비주얼 띠(행사 설정 wait_config) — 없으면 띠 없이 행사명 글자 */
.hero{position:relative;width:100%;max-width:400px;aspect-ratio:2.2/1;margin-bottom:12px;border-radius:20px;overflow:hidden;background:var(--green) 62% 40%/cover no-repeat;display:flex;align-items:flex-end;padding:18px 20px}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,18,20,0) 30%,rgba(14,18,20,.7))}
.hero img{position:relative;width:58%;height:auto;filter:drop-shadow(0 2px 8px rgba(0,0,0,.35))}
.hero[hidden]{display:none}
.card{width:100%;max-width:400px;padding:28px 22px;border-radius:20px;background:var(--card);border:1px solid var(--line);text-align:center}
.cap{font-size:14px;font-weight:700;color:var(--green)}
.st{display:inline-block;margin-top:14px;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:800;background:var(--green-l);color:var(--green)}
.st.call{background:var(--green);color:#fff}
.st.end{background:#EEE8DD;color:var(--sub)}
.no{font-family:Paperlogy,sans-serif;font-size:84px;font-weight:800;line-height:1;margin-top:14px}
.no i{font-style:normal;font-size:28px;margin-left:4px}
.party{margin-top:6px;font-size:16px;color:var(--sub)}
.ahead{margin-top:22px;padding:16px;border-radius:14px;background:#F5F1E9;font-size:17px;line-height:1.55}
.ahead b{font-family:Paperlogy,sans-serif;font-size:30px;color:var(--green);margin:0 2px}
.ahead.call{background:var(--green);color:#fff}
.ahead.call b{color:#fff}
.upd{margin-top:14px;font-size:13px;color:var(--sub)}
.cancel{margin-top:22px;width:100%;max-width:400px}
[hidden]{display:none!important}
.msg{white-space:pre-line;margin-top:40px;font-size:17px;color:var(--sub);text-align:center;line-height:1.6}
</style>
</head>
<body>
<header class="hero" id="hero" hidden><img id="logo" alt=""></header>
<div class="card" id="card" hidden>
  <p class="cap" id="title"></p>
  <span class="st" id="st"></span>
  <div class="no"><span id="no"></span><i>번</i></div>
  <p class="party" id="party"></p>
  <div class="ahead" id="ahead"></div>
  <p class="upd" id="upd"></p>
</div>
<button class="btn line cancel" id="cancel" type="button" hidden>대기 취소</button>
<p class="msg" id="msg">불러오는 중</p>
<div class="toast" id="toast"></div>
<script type="module">
import { call, qs, say } from './wait.js';
const $ = (id) => document.getElementById(id);
const T = qs('t');
const LABEL = { waiting: '대기 중', called: '입장 차례', entered: '입장 완료', noshow: '호출 만료', canceled: '취소됨' };
async function load(action = 'status') {
  try {
    const d = await call(action, { token: T });
    if (d.canceled || ['canceled', 'entered', 'noshow'].includes(d.status)) { ended(d.status, action === 'cancel'); return; }
    $('msg').hidden = true; $('card').hidden = false;
    $('title').textContent = d.title;
    if (d.visual || d.logo) {
      $('hero').hidden = false; $('hero').style.backgroundImage = d.visual ? `url(/${d.visual})` : '';
      if (d.logo && $('logo').dataset.src !== d.logo) { $('logo').dataset.src = d.logo; $('logo').src = '/' + d.logo; $('logo').alt = d.title; }
      $('logo').hidden = !d.logo; $('title').hidden = !!d.logo;
    }
    $('no').textContent = d.no; $('party').textContent = `${d.party}명`;
    const st = $('st'); st.textContent = LABEL[d.status] || d.status; st.className = 'st' + (d.status === 'called' ? ' call' : ['entered', 'noshow', 'canceled'].includes(d.status) ? ' end' : '');
    const a = $('ahead'); a.className = 'ahead' + (d.status === 'called' ? ' call' : '');
    a.innerHTML = d.status === 'waiting' ? (d.ahead ? `내 앞에 <b>${d.ahead}</b>팀이 기다리고 있습니다` : '다음 차례입니다. 입구 근처에서 대기 부탁드립니다')
      : d.status === 'called' ? `지금 입장 부탁드립니다<br><b>${d.call_minutes}</b>분 안에 입구로 와 주십시오`
      : d.status === 'entered' ? '입장하셨습니다. 즐거운 관람 되세요'
      : d.status === 'noshow' ? '호출 시간이 지났습니다. 입구 직원에게 문의해 주세요'
      : '대기를 취소했습니다';
    $('cancel').hidden = !(d.status === 'waiting' || d.status === 'called');
    $('upd').textContent = d.status === 'waiting' ? `${new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })} 기준 · 자동으로 새로 고칩니다` : '';
  } catch (e) { clearInterval(poll); $('hero').hidden = true; $('card').hidden = true; $('cancel').hidden = true; $('msg').hidden = false; $('msg').textContent = say(e.code); }
}
// 끝난 대기 — 이 링크로는 더 볼 것이 없다. 방금 취소했으면 그 한 줄만
function ended(st, justNow) {
  clearInterval(poll);
  $('card').hidden = true; $('cancel').hidden = true; $('msg').hidden = false;
  $('msg').innerHTML = justNow ? '대기를 취소했습니다.<br>다시 기다리시려면 현장 태블릿에서 새로 접수해 주세요.'
    : st === 'entered' ? '입장이 끝난 대기입니다.<br>이 링크는 더 이상 쓰이지 않습니다.'
    : '끝난 대기입니다. 이 링크는 더 이상 쓰이지 않습니다.<br>다시 기다리시려면 현장 태블릿에서 새로 접수해 주세요.';
}
let poll = 0;
$('cancel').onclick = async () => { if (!confirm('대기를 취소할까요? 취소하면 접수번호가 사라집니다.')) return; await load('cancel'); };
if (!T) { $('msg').textContent = say('not_found'); } else { load(); poll = setInterval(() => { if (!document.hidden) load(); }, 15000); }
</script>
</body>
</html>
